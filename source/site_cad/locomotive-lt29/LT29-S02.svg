   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203c3b" x="552.96" y="130.878261" transform="rotate(-0 552.96 130.878261)">Transverse section at crosshead</text>
   </g>
  </g>
  <g id="axes_3">
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(60.48 422.318437)">Truck frame / bearing housing → outer race → spherical contact → inner ring face → cartridge → seat</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(60.48 435.873906)">→ stiffened cheek → cap / endwebs → diaphragms / rail walls → main rails.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(60.48 474.806438)">The bearing/housing axial impact capacity is NOT established. Pin nut retention is not the axial catch.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(60.48 489.043625)">Seat must bear directly; 6 mm trial seat fillet is retention only. Endweb perimeter fillet trial 8 mm.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(60.48 503.280813)">Net-section cheek strip, gusset weld and rail-increment screens are in the report; they do not qualify</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(60.48 517.518)">contact edge loads, cap plate bending, diaphragm/wall bending, weld fatigue or existing global frame stress.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(60.48 531.755188)">If the cartridge bottoms, the hard-stop force is unknown. Confirm an overload case before structural release.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203c3b" x="60.48" y="408.72" transform="rotate(-0 60.48 408.72)">Engineer review — force path and unresolved links</text>
   </g>
  </g>
  <g id="text_12">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203c3b" x="47.52" y="26.715937" transform="rotate(-0 47.52 26.715937)">LT29-S02  |  Cheek, crosshead and frame load path</text>
  </g>
  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203c3b" x="47.52" y="631.8" transform="rotate(-0 47.52 631.8)">REVIEW CANDIDATE • All dimensions in mm • No qualified catch • Fabrication dimensions UNRELEASED</text>
  </g>

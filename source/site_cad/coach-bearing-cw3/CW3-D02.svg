<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse"><path d="M6 3L0 0V6Z" fill="#27444e"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#203b45}.title{font-size:31px;font-weight:bold}.s{font-size:22px}.n{font-size:18px}.ln{fill:none;stroke:#27444e;stroke-width:1.4}.dim{fill:none;stroke:#27444e;stroke-width:1.3;marker-start:url(#arrow);marker-end:url(#arrow)}.dash{fill:none;stroke:#ad6c19;stroke-width:2;stroke-dasharray:7 5}</style><rect width="1600" height="1120" fill="#fbfcf8"/><text x="50" y="55" class="title">Spacer centering, relief and bearing locking details</text><text x="50" y="92" class="s">CW3-D02 · CW3-R0 · 20 October 2026 · dimensions in mm · DESIGN REVIEW</text><path d="M50 113L1550 113" class="ln"/><text x="65" y="160" class="n">Enlarged retention section · axial and radial scales differ</text><rect x="100" y="345" width="148" height="180" fill="#a4b8c1" stroke="#27444e" stroke-width="1.3"/><rect x="248" y="349" width="37" height="176" fill="#a4b8c1" stroke="#27444e" stroke-width="1.3"/><rect x="285" y="353" width="37" height="172" fill="#a4b8c1" stroke="#27444e" stroke-width="1.3"/><rect x="322" y="349" width="37" height="176" fill="#a4b8c1" stroke="#27444e" stroke-width="1.3"/><rect x="359" y="345" width="740" height="180" fill="#a4b8c1" stroke="#27444e" stroke-width="1.3"/><rect x="174" y="317" width="74" height="28" fill="#dbb35b" stroke="#27444e" stroke-width="1.3"/><rect x="248" y="317" width="111" height="27.6" fill="#dbb35b" stroke="#27444e" stroke-width="1.3"/><rect x="359" y="309" width="64.75" height="36" fill="#bd9559" stroke="#27444e" stroke-width="1.3"/><rect x="423.75" y="285" width="592" height="60" fill="#c39d62" stroke="#27444e" stroke-width="1.3"/><path d="M174 317L174 235" class="ln"/><path d="M359 317L359 235" class="ln"/><path d="M174 230H359" class="dim"/><text x="266.5" y="221" class="n" text-anchor="middle">5 spacer</text><path d="M174 525L174 590" class="ln"/><path d="M248 525L248 590" class="ln"/><path d="M174 585H248" class="dim"/><text x="211.0" y="576" class="n" text-anchor="middle">2 pilot</text><path d="M248 525L248 640" class="ln"/><path d="M359 525L359 640" class="ln"/><path d="M248 635H359" class="dim"/><text x="303.5" y="626" class="n" text-anchor="middle">3 relief</text><path d="M423.75 525L423.75 695" class="ln"/><path d="M1015.75 525L1015.75 695" class="ln"/><path d="M423.75 690H1015.75" class="dim"/><text x="719.75" y="681" class="n" text-anchor="middle">16 KM18 nut</text><text x="1160" y="240" class="s">Spacer OD104</text><text x="1160" y="280" class="s">Bore 90 H7 ×2</text><text x="1160" y="320" class="s">Outboard bore</text><text x="1160" y="350" class="s">90.2 ×3</text><text x="1160" y="405" class="s">MB18: 1.75</text><text x="1160" y="450" class="s">Nut end 662.75</text><text x="1160" y="490" class="s">Axle tip 665</text><text x="65" y="750" class="n">Pilot: Ø90 g6 = 89.966–89.988. Spacer bore: Ø90 H7 = 90.000–90.035. Proposed centering fit.</text><text x="65" y="788" class="n">Diametral clearance 0.012–0.069; max radial freedom 0.0345. Pilot is separate from the bearing-journal fit.</text><text x="65" y="826" class="n">Relief: custom Ø86 root, R1 corners, flat root Y643–644. Schematic above; no DIN76 or fatigue approval.</text><text x="65" y="864" class="n">M90×2-6g proposed; full-form thread must cover Y646.75–662.75. Check chamfers, tolerances and nut engagement.</text><text x="65" y="902" class="n">Washer slot: width 10.4, floor radius from axis 41.0, begins Y645. Tab nominal width 10, tip radius 41.5.</text><text x="65" y="940" class="n">Slot stop stays outside smooth pilot; cutting method / corner radii require shop approval. Do not run an endmill into the journal.</text><text x="65" y="978" class="n">H7 end faces bearing. Edge breaks ≤0.2 proposed; preserve ≥1.6 full pilot engagement. Final face tolerances and clamp force held.</text><path d="M50 1040L1550 1040" class="ln"/><text x="50" y="1075" class="n">PROPOSED DETAILS — materials, fits, fatigue, sealing performance and purchased-part interfaces require release.</text><text x="50" y="1100" class="n">Not for machining. Bearing internals / thread helix are schematic. All positive-side Y stations mirror at the left end.</text></svg>
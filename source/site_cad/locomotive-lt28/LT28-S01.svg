  <g id="axes_3">
   <g id="text_12">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start" x="475.2" y="370.662553" transform="rotate(-0 475.2 370.662553)">Datum and load-path notes</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 396.628072)">X is the pin axis; pivot centre is X = 0.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 410.105416)">Cheek inner faces ±65; stop faces ±49.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 423.58276)">Pin smooth grip ends ±90; cheek centres ±77.5.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 437.060103)"/>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 450.537447)">Normal: ring → sleeve → pin → cheeks.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 464.014791)">Axial traction normally passes through the link.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 477.492135)">Catch: ring face → one collar → seated cheek</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 490.969478)">→ crosshead → main rails.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 504.446822)"/>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 517.924166)">Outer bearing housing and internal race profile</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 531.40151)">are omitted; ring profile is schematic.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 544.878853)">Sleeve fit, weld access, seat gap, grades and</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 558.356197)">retention remain engineering holds.</text>
   </g>
  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start" x="51.84" y="26.715937" transform="rotate(-0 51.84 26.715937)">LT28-S01  |  Pivot connection sections — REVIEW ONLY</text>
  </g>
  <g id="text_15">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="51.84" y="631.8" transform="rotate(-0 51.84 631.8)">All dimensions describe the review model. Proposed tolerances, weld, materials and fabrication dimensions are UNRELEASED.</text>
  </g>

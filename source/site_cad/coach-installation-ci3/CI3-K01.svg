<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><rect width="1600" height="1120" fill="#fbfcf8"/><g font-family="Arial,sans-serif"><text x="50" y="55" font-size="32" fill="#25434e" text-anchor="start">Axlebox keeper — attachment and positive bolt locking</text><text x="50" y="92" font-size="20" fill="#25434e" text-anchor="start">CI3-K01 · CI3-R0 · Millimetres · Bogie service retention; one axlebox shown</text><path d="M50,112 L1550,112" fill="none" stroke="#335866" stroke-width="2"/><polygon points="106.0,273.0 694.0,273.0 694.0,567.0 106.0,567.0" fill="#b5cbc0" stroke="#335866" stroke-width="2"/><circle cx="157.45" cy="325.5" r="14.700000000000001" fill="#fbfcf8" stroke="#335866" stroke-width="2"/><circle cx="157.45" cy="514.5" r="14.700000000000001" fill="#fbfcf8" stroke="#335866" stroke-width="2"/><circle cx="642.55" cy="325.5" r="14.700000000000001" fill="#fbfcf8" stroke="#335866" stroke-width="2"/><circle cx="642.55" cy="514.5" r="14.700000000000001" fill="#fbfcf8" stroke="#335866" stroke-width="2"/><path d="M106.0,273.0 L106.0,238" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M694.0,273.0 L694.0,238" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M106.0,230 L694.0,230" fill="none" stroke="#335866" stroke-width="2"/><path d="M101.0,236 L111.0,224" fill="none" stroke="#335866" stroke-width="2"/><path d="M689.0,236 L699.0,224" fill="none" stroke="#335866" stroke-width="2"/><text x="400.0" y="220" font-size="21" fill="#25434e" text-anchor="middle">280</text><path d="M157.45,514.5 L157.45,618" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M642.55,514.5 L642.55,618" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M157.45,610 L642.55,610" fill="none" stroke="#335866" stroke-width="2"/><path d="M152.45,616 L162.45,604" fill="none" stroke="#335866" stroke-width="2"/><path d="M637.55,616 L647.55,604" fill="none" stroke="#335866" stroke-width="2"/><text x="400.0" y="600" font-size="21" fill="#25434e" text-anchor="middle">231 bolt centres</text><path d="M694.0,273.0 L758,273.0" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M694.0,567.0 L758,567.0" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M750,273.0 L750,567.0" fill="none" stroke="#335866" stroke-width="2"/><path d="M744,278.0 L756,268.0" fill="none" stroke="#335866" stroke-width="2"/><path d="M744,572.0 L756,562.0" fill="none" stroke="#335866" stroke-width="2"/><text x="762" y="427.0" font-size="21" fill="#25434e" text-anchor="start">140</text><path d="M157.45,325.5 L68,325.5" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M157.45,514.5 L68,514.5" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M60,325.5 L60,514.5" fill="none" stroke="#335866" stroke-width="2"/><path d="M54,330.5 L66,320.5" fill="none" stroke="#335866" stroke-width="2"/><path d="M54,519.5 L66,509.5" fill="none" stroke="#335866" stroke-width="2"/><text x="72" y="427.0" font-size="21" fill="#25434e" text-anchor="start">90</text><text x="120" y="190" font-size="24" fill="#25434e" text-anchor="start">Plan — four Ø14 clearance holes</text><text x="120" y="675" font-size="22" fill="#25434e" text-anchor="start">Plate 16 thick; both guide columns support it</text><path d="M157.45,325.5 L157.45,514.5" fill="none" stroke="#b58443" stroke-width="2" stroke-dasharray="6 5"/><path d="M642.55,325.5 L642.55,514.5" fill="none" stroke="#b58443" stroke-width="2" stroke-dasharray="6 5"/><text x="120" y="720" font-size="21" fill="#25434e" text-anchor="start">Dashed lines identify paired heads for lockwire.</text><text x="120" y="755" font-size="21" fill="#25434e" text-anchor="start">Route wire to tighten each head; verify clocking.</text><polygon points="1060,153 1140,153 1140,505 1060,505" fill="#8eaaa0" stroke="#335866" stroke-width="2"/><polygon points="980,505 1220,505 1220,633 980,633" fill="#b5cbc0" stroke="#335866" stroke-width="2"/><polygon points="1079.6,233 1120.3999999999999,233 1120.3999999999999,505 1079.6,505" fill="#fbfcf8" stroke="#335866" stroke-width="2"/><polygon points="1076,273 1124,273 1124,633 1076,633" fill="#a7b5ba" stroke="#335866" stroke-width="2"/><polygon points="1064,633 1136,633 1136,693.0 1064,693.0" fill="#8b9b9b" stroke="#335866" stroke-width="2"/><circle cx="1100" cy="663.4" r="8" fill="#fbfcf8" stroke="#335866" stroke-width="2"/><text x="950" y="140" font-size="24" fill="#25434e" text-anchor="start">B–B  Keeper bolt section</text><text x="1265" y="280" font-size="21" fill="#25434e" text-anchor="start">Guide</text><text x="1265" y="315" font-size="21" fill="#25434e" text-anchor="start">M12 × 1.75</text><text x="1265" y="350" font-size="21" fill="#25434e" text-anchor="start">30 full thread</text><text x="1265" y="385" font-size="21" fill="#25434e" text-anchor="start">34 drill depth</text><path d="M1060,273 L928,273" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M1060,505 L928,505" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M920,273 L920,505" fill="none" stroke="#335866" stroke-width="2"/><path d="M914,278 L926,268" fill="none" stroke="#335866" stroke-width="2"/><path d="M914,510 L926,500" fill="none" stroke="#335866" stroke-width="2"/><text x="932" y="396.0" font-size="21" fill="#25434e" text-anchor="start">29 engaged</text><path d="M1220,505 L1258,505" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M1220,633 L1258,633" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M1250,505 L1250,633" fill="none" stroke="#335866" stroke-width="2"/><path d="M1244,510 L1256,500" fill="none" stroke="#335866" stroke-width="2"/><path d="M1244,638 L1256,628" fill="none" stroke="#335866" stroke-width="2"/><text x="1262" y="576.0" font-size="21" fill="#25434e" text-anchor="start">16</text><text x="1000" y="795" font-size="21" fill="#25434e" text-anchor="start">Ø2 hole in rated predrilled head</text><path d="M50,850 L1550,850" fill="none" stroke="#335866" stroke-width="2"/><text x="50" y="890" font-size="21" fill="#25434e" text-anchor="start">M12 × 45 under-head length; grade 8.8 candidate. Bolts now seat directly against the keeper underside at Z124.</text><text x="50" y="925" font-size="21" fill="#25434e" text-anchor="start">Keeper top Z140; nominal axlebox bottom Z200. The 60 mm gap closes only at captured droop.</text><text x="50" y="960" font-size="21" fill="#25434e" text-anchor="start">Thread forms are schematic in CAD. Specify tap runout, verified minimum engagement, tightening and inspection with the fastener supplier.</text><text x="50" y="995" font-size="21" fill="#25434e" text-anchor="start">Spring core and lower capture washer remain a second physical capture path; their rod, nut and washer capacity is still unresolved.</text><text x="50" y="1030" font-size="21" fill="#25434e" text-anchor="start">The keeper screen covers a symmetric hanging-load sensitivity. It is not a lifting fixture rating or dynamic catch approval.</text><text x="50" y="1087" font-size="18" fill="#25434e" text-anchor="start">Development dimensions — material, welding procedure, local frame strength and fatigue release remain in separate engineering.</text></g></svg>
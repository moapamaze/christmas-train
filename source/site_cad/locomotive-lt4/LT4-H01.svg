<text x="48" y="138" font-size="13" font-weight="bold" text-anchor="start">LOWER PANEL MOUNT / RIB TRIMMED FOR VIEW</text><text x="790" y="185" font-size="13" font-weight="bold" text-anchor="start">PANEL TAB 20 × 60 × 6 / Ø9</text><text x="790" y="232" font-size="13" font-weight="normal" text-anchor="start">Rib 20 axial × 10 radial</text><text x="790" y="279" font-size="13" font-weight="normal" text-anchor="start">M8 × 35 removable attachment</text><text x="790" y="326" font-size="13" font-weight="bold" text-anchor="start">SADDLE 140 × 80 × 8</text><text x="790" y="373" font-size="13" font-weight="normal" text-anchor="start">Two Ø9 on 20 mm axial spacing</text><text x="790" y="420" font-size="13" font-weight="bold" text-anchor="start">FOOT 140 × 140 × 10</text><text x="790" y="467" font-size="13" font-weight="normal" text-anchor="start">Riser 12 × 80 × 57</text><text x="790" y="514" font-size="13" font-weight="normal" text-anchor="start">Top of main rail 1775</text><text x="790" y="561" font-size="13" font-weight="normal" text-anchor="start">Panel lower edge 1850</text><text x="42" y="700" font-size="13" font-weight="normal" text-anchor="start">Shell bays remain 1400 long; remove both halves/ribs in bays 1–3 for the proposed 1600–5800 opening. No pressure vessel.</text><text x="42" y="721" font-size="13" font-weight="normal" text-anchor="start">New saddle/rib joints and lifting provision need load/WPS review. Engine/pump OEM service and extraction envelopes remain unavailable.</text><path class="rule" d="M20.00,761.00 L1180.00,761.00"/><text x="42" y="786" font-size="13" font-weight="normal" text-anchor="start">LT4 R0 · 2026-10-19  |  mm · NTS  |  FITS / WELDS PROVISIONAL</text><text x="1158" y="786" font-size="13" font-weight="bold" text-anchor="end">NOT FOR FABRICATION</text></svg>
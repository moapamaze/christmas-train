<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#fafcfb"/><style>text{font-family:Arial,sans-serif;fill:#17364a}.t{font-size:30px;font-weight:bold}.h{font-size:21px;font-weight:bold}.l{font-size:18px}.s{font-size:15px}.p{fill:none;stroke:#ac7195;stroke-width:3;stroke-dasharray:9 6}.g{fill:none;stroke:#c19545;stroke-width:3;stroke-dasharray:8 5}</style><text x="50" y="56" class="t">LT25-A02 · Service reservations and shaft-datum clearance</text><text x="50" y="88" class="l">Planning spaces only · radiator forward / pump aft · supplier removal instructions still required</text><path d="M50 110 H1350" stroke="#bacbc5"/><text x="70" y="160" class="h">PLAN · shaft on locomotive centerline</text><text x="70" y="195" class="s">FORWARD ←</text><text x="730" y="195" class="s">→ AFT</text><rect x="145.0" y="264.5" width="42.5" height="231.0" fill="#b4d1da" stroke="#54766c" class=""/><rect x="220.0" y="304.4223" width="312.42" height="151.15540000000001" fill="#e3eee8" stroke="#54766c" class=""/><rect x="220.0" y="290.98316" width="312.42" height="178.03368" fill="none" stroke="#54766c" class="g"/><rect x="532.5" y="330.5" width="137.5" height="99.0" fill="#b7c8df" stroke="#54766c" class=""/><rect x="532.5" y="330.5" width="300.0" height="99.0" fill="none" stroke="#54766c" class="p"/><rect x="70.0" y="264.5" width="117.5" height="231.0" fill="none" stroke="#54766c" class="p"/><path d="M70 380 H850" stroke="#8a9f99" stroke-dasharray="5 4"/><text x="255" y="355" class="s">AIE reference region</text><text x="255" y="378" class="s">Gold: 809.2 mm reservation</text><text x="558" y="368" class="s">Pump</text><text x="70" y="535" class="l">Cooler: 300 mm forward</text><text x="520" y="535" class="l">Pump: 650 mm aft</text><text x="70" y="570" class="s">X2,400–2,870 swept occupancy</text><text x="520" y="570" class="s">X4,250–5,450 swept occupancy</text><text x="950" y="160" class="h">SHELL CROSS-SECTION</text><circle cx="1135" cy="353" r="143.6" fill="#edf3f1" stroke="#607a70" stroke-width="2"/><rect x="1070.26048" y="253.05792000000002" width="129.47904" height="164.47008000000002" fill="none" stroke="#54766c" class="g"/><text x="953" y="535" class="l">153.3 mm nominal radial gap</text><text x="953" y="567" class="s">Both orientations covered; no thermal</text><text x="953" y="592" class="s">or tolerance acceptance inferred.</text><text x="70" y="640" class="l">Drawing width is 687.07 mm; shaft-to-side dimensions read 404.622 / 282.448 mm.</text><text x="70" y="672" class="s">The prior centered-width fit screen was optimistic. Gold boundary covers either hand until AIE confirms.</text><text x="70" y="720" class="s">SERVICE HOLD: enclosure openings, lift paths, hoses, tools, guards and OEM withdrawal distances are unfinished.</text><text x="70" y="750" class="s">COOLING HOLD: one-fan topology is retained; core pressure drops, fan curve and hot-air separation are unverified.</text><path d="M50 820 H1350" stroke="#bacbc5"/><text x="50" y="850" class="s">PULSIPHER FARMS · LT25-A02 · 21 OCT 2026 · DIMENSIONS IN mm</text><text x="50" y="877" class="s">DEVELOPMENT STUDY · NO FABRICATION OR OPERATING RELEASE</text></svg>
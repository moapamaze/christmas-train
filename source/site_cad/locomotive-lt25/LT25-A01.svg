<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#fafcfb"/><style>text{font-family:Arial,sans-serif;fill:#17364a}.title{font-size:30px;font-weight:bold}.sub{font-size:18px;fill:#52706a}.label{font-size:18px}.small{font-size:15px}.dim{stroke:#466b64;stroke-width:1.5}.dash{stroke:#bf883e;stroke-width:2;stroke-dasharray:8 5;fill:#efc778;fill-opacity:.12}</style><text x="50" y="56" class="title">LT25-A01 · Packaged engine inside the locomotive</text><text x="50" y="88" class="sub">AIE radiator forward · flywheel / pump aft · existing boiler profile and running gear retained</text><path d="M50 110 H1350" stroke="#bacbc5"/><rect x="300.0" y="192.5" width="750.0" height="487.5" fill="#edf3f1" stroke="#ccd9d3" /><text x="110" y="145" class="small">BOILER VERTICAL LIMITS — side projection; circular cross-section checked separately</text><rect x="330.0" y="283.49000000000007" width="51.0" height="300.0" fill="#b4d1da" stroke="#55746a" /><rect x="420.0" y="275.1086" width="374.904" height="308.38140000000004" fill="#d6e9df" stroke="#55746a" /><rect x="795.0" y="421.9268000000001" width="165.0" height="150.0" fill="#b7c8df" stroke="#55746a" /><text x="441.0" y="357.5" class="label">AIE reference package</text><text x="441.0" y="384.5" class="label">1,249.7 L × 687.1 W × 1,027.9 H</text><text x="801.0" y="459.5" class="small">Pump reservation</text><text x="801.0" y="480.5" class="small">550 × 450 × 500</text><path d="M420.0 496.92679999999996 L993.0 496.92679999999996" stroke="#c57a30" stroke-width="2" stroke-dasharray="7 5"/><text x="807.0" y="524.9268" class="small">Shaft Z 2,135.2</text><rect x="345.0" y="587.09" width="675.0" height="18.0" fill="#728995" stroke="#55746a" /><rect x="360.0" y="605.09" width="30.0" height="15.0" fill="#4f6570" stroke="#55746a" /><rect x="720.0" y="605.09" width="30.0" height="15.0" fill="#4f6570" stroke="#55746a" /><path d="M761.9856 597.5 L761.9856 309.5" stroke="#416e61" stroke-width="2" stroke-dasharray="7 5"/><text x="717.0" y="297.5" class="small">Flywheel face X 4,140</text><text x="100" y="715" class="label">Common skid X 2,750–5,000 · base datum Z 1,846.7 · existing support stations X 2,850 / 4,050</text><text x="100" y="749" class="label">Hydraulic cooler ahead of radiator; one packaged suction fan is the development direction.</text><text x="100" y="782" class="small">Remote filters, full adapter, exhaust shields and hoses are outside this verified dimensional scope.</text><path d="M50 820 H1350" stroke="#bacbc5"/><text x="50" y="850" class="small">PULSIPHER FARMS · LT25-A01 · 21 OCT 2026 · DIMENSIONS IN mm</text><text x="50" y="875" class="small">SUPPLIER ENVELOPES / CONCEPTUAL SUPPORTS · NOT RELEASED FOR FABRICATION</text></svg>
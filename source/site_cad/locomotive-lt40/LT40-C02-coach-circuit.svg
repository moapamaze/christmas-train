<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc"><title id="title">LT40-C02 Coach brake module — port map and pressure hold</title><desc id="desc">Coordinated development drawing. Functional interfaces and catalog envelopes only; not released for construction.</desc><rect width="1600" height="1280" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#173b4b;font-size:19px}.small{font-size:16px}.title{font-size:30px;font-weight:bold}.bold{font-weight:bold}</style><text x="45.00" y="48.00" class="title">Coach brake module — port map and pressure hold</text><text x="45.00" y="82.00" class="small">LT40-C02 · LT40 · 23 OCT 2026 · REVIEW / NOT FOR CONSTRUCTION</text><polyline points="40.00,105.00 1560.00,105.00" fill="none" stroke="#173b4b" stroke-width="2"/><text x="55.00" y="145.00" class="small">Proposed functions. A06 is a published reference only; this is not a released pneumatic construction schematic.</text><rect x="60.00" y="200.00" width="265.00" height="145.00" rx="6" fill="#f0f5f3" stroke="#217d62" stroke-width="2" stroke-dasharray="8 5"/><text x="75.00" y="230.00" class="small bold" style="fill:#217d62">A05 · RESERVE PROTECT.</text><text x="75.00" y="258.00" class="small">FP input</text><text x="75.00" y="281.00" class="small">Check / pressure protection</text><text x="75.00" y="304.00" class="small">Exact valve unselected</text><polyline points="55.00,175.00 190.00,175.00 190.00,200.00" fill="none" stroke="#217d62" stroke-width="4"/><text x="60.00" y="166.00" class="bold" style="fill:#217d62">FP</text><rect x="390.00" y="200.00" width="290.00" height="145.00" rx="6" fill="#f0f5f3" stroke="#23786a" stroke-width="2"/><text x="405.00" y="230.00" class="small bold" style="fill:#23786a">A04 · LOCAL RESERVE</text><text x="405.00" y="258.00" class="small">Two connected 40 L tanks</text><text x="405.00" y="281.00" class="small">80 L study reserve</text><text x="405.00" y="304.00" class="small">8–9 bar basis NOT approved</text><polyline points="325.00,270.00 390.00,270.00" fill="none" stroke="#217d62" stroke-width="4"/><text x="331.00" y="257.00" class="small" style="fill:#217d62">N04</text><rect x="760.00" y="200.00" width="315.00" height="145.00" rx="6" fill="#f0f5f3" stroke="#23786a" stroke-width="2" stroke-dasharray="8 5"/><text x="775.00" y="230.00" class="small bold" style="fill:#23786a">A11 · CONTROL RESERVOIR</text><text x="775.00" y="258.00" class="small">Separate 6 L reference vessel</text><text x="775.00" y="281.00" class="small">Control pressure follows BP</text><text x="775.00" y="304.00" class="small">Part and mount unselected</text><rect x="390.00" y="470.00" width="460.00" height="220.00" rx="6" fill="#f0f5f3" stroke="#2374ab" stroke-width="2" stroke-dasharray="8 5"/><text x="405.00" y="500.00" class="small bold" style="fill:#2374ab">A06 · AUTOMATIC DISTRIBUTOR / RELAY</text><text x="405.00" y="528.00" class="small">Reference KE1diPKSL + RLV-11d, II93258</text><text x="405.00" y="551.00" class="small">L: brake pipe     R: auxiliary reserve</text><text x="405.00" y="574.00" class="small">C: brake-cylinder delivery     A: control chamber</text><text x="405.00" y="597.00" class="small">BP reduction applies; increase releases</text><polyline points="535.00,345.00 535.00,470.00" fill="none" stroke="#217d62" stroke-width="4"/><text x="545.00" y="425.00" class="bold" style="fill:#217d62">N05 / R</text><polyline points="920.00,345.00 920.00,405.00 740.00,405.00 740.00,470.00" fill="none" stroke="#23786a" stroke-width="3"/><text x="750.00" y="447.00" class="bold" style="fill:#23786a">A</text><polyline points="60.00,540.00 390.00,540.00" fill="none" stroke="#2374ab" stroke-width="4"/><text x="65.00" y="523.00" class="bold" style="fill:#2374ab">N06 / BP → L</text><rect x="60.00" y="735.00" width="290.00" height="160.00" rx="6" fill="#f0f5f3" stroke="#785a9b" stroke-width="2" stroke-dasharray="8 5"/><text x="75.00" y="765.00" class="small bold" style="fill:#785a9b">A07 · PARKING / RELEASE</text><text x="75.00" y="793.00" class="small">Reserve supply and control</text><text x="75.00" y="816.00" class="small">Anti-compounding required</text><text x="75.00" y="839.00" class="small">Hardware and sequence held</text><polyline points="480.00,345.00 480.00,385.00 350.00,385.00 350.00,705.00 205.00,705.00 205.00,735.00" fill="none" stroke="#217d62" stroke-width="3"/><rect x="1110.00" y="470.00" width="420.00" height="285.00" rx="6" fill="#f0f5f3" stroke="#173b4b" stroke-width="2" stroke-dasharray="8 5"/><text x="1125.00" y="500.00" class="small bold" style="fill:#173b4b">B01–B04 · FOUR BRAKES</text><text x="1125.00" y="528.00" class="small">Logical chamber 11: service</text><text x="1125.00" y="551.00" class="small">Logical chamber 12: spring release</text><text x="1125.00" y="574.00" class="small">Hand / drain orientation held</text><text x="1125.00" y="597.00" class="small">Physical station 97 / 116 identity OPEN</text><text x="1125.00" y="620.00" class="small">Two brake stations currently developed</text><text x="1125.00" y="643.00" class="small">Two further stations + branches required</text><polyline points="850.00,545.00 1110.00,545.00" fill="none" stroke="#b55329" stroke-width="4"/><text x="868.00" y="528.00" class="bold" style="fill:#b55329">N07 / C → 11</text><polyline points="350.00,820.00 1035.00,820.00 1035.00,715.00 1110.00,715.00" fill="none" stroke="#785a9b" stroke-width="4"/><text x="675.00" y="802.00" class="bold" style="fill:#785a9b">N08 / release → 12</text><polyline points="620.00,690.00 620.00,760.00 350.00,760.00" fill="none" stroke="#a26721" stroke-width="2" stroke-dasharray="9 6"/><text x="450.00" y="738.00" class="small" style="fill:#a26721">Coordination intent only</text><polyline points="800.00,690.00 800.00,925.00" fill="none" stroke="#74858a" stroke-width="2" stroke-dasharray="9 6"/><text x="820.00" y="900.00" class="small">A06 / A07 exhaust ports and outlets TBD</text><text x="820.00" y="925.00" class="small">No capped or blind-ended exhaust implied</text><rect x="55.00" y="965.00" width="1490.00" height="205.00" rx="6" fill="#fff5df" stroke="#a26721" stroke-width="2"/><text x="75.00" y="997.00" class="small">PRESSURE HOLD · reference circuit and present study are different designs</text><text x="75.00" y="1029.00" class="small">Knorr reference: BP 5 kgf/cm² ≈ 4.90 bar; FP 6 kgf/cm² ≈ 5.88 bar; delivery 3.8 kgf/cm² ≈ 3.73 bar.</text><text x="75.00" y="1061.00" class="small">Reference uses a check-protected 125 L brake reserve. Our proposed 80 L /8–9 bar arrangement is not approved for it.</text><text x="75.00" y="1093.00" class="small">Do not assume 6 bar delivery from II93258. Confirm brake torque at the selected pressure or obtain an approved configuration.</text><text x="75.00" y="1125.00" class="small">97/116 are physical geometry labels, NOT substitutes for OEM 11/12. No mapping is made on this sheet.</text><polyline points="40.00,1217.00 1560.00,1217.00" fill="none" stroke="#173b4b" stroke-width="1"/><text x="45.00" y="1247.00" class="small">PULSIPHER FARMS  |  Item tags match LT40 parts schedule  |  All pressures gauge unless stated</text><text x="1175.00" y="1247.00" class="small">Do not scale for manufacture</text></svg>
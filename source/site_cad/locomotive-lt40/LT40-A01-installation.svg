"bold">A04-Cn1</text><text x="1060.00" y="870.00" class="small">3700, -300, 480</text><text x="1060.00" y="894.00" class="small">927 × 246 × 262 mm</text><text x="850.00" y="927.00" class="bold">A04-Cn2</text><text x="1060.00" y="927.00" class="small">3700, 300, 480</text><text x="1060.00" y="951.00" class="small">927 × 246 × 262 mm</text><text x="850.00" y="984.00" class="bold">A06-SPACE</text><text x="1060.00" y="984.00" class="small">4500, 0, 500</text><text x="1060.00" y="1008.00" class="small">300 × 350 × 230 mm</text><text x="850.00" y="1056.00" class="small">Cn = each of C1–C4. Geometry shown for one coach.</text><text x="850.00" y="1081.00" class="small">A06-SPACE is NOT a Knorr II93258 envelope.</text><text x="850.00" y="1106.00" class="small">A11 separate 6 L control reservoir has no assigned mount.</text><text x="850.00" y="1131.00" class="small">B01–B04 brake units: see C57; two stations undeveloped.</text><text x="70.00" y="650.00" class="small">A04: Ø246 × 927 mm body; 262 mm overall height including boss.</text><text x="70.00" y="675.00" class="small">Tank body centres are layout coordinates, not hole datums.</text><text x="70.00" y="700.00" class="small">Straps, drains, port clocking and fittings remain unconfirmed.</text><text x="70.00" y="725.00" class="small">Pipe segments are cropped. See LT38 for full nominal routes.</text><text x="70.00" y="1400.00" class="small">Solid green: catalog tank envelope. Dashed amber: unverified equipment space.</text><text x="70.00" y="1423.00" class="small">This sheet adds no fit approval. Hose rerouting, control vessels, new compressor and missing brakes require revised geometry.</text><polyline points="40.00,1477.00 1560.00,1477.00" fill="none" stroke="#173b4b" stroke-width="1"/><text x="45.00" y="1507.00" class="small">PULSIPHER FARMS  |  Item tags match LT40 parts schedule  |  All pressures gauge unless stated</text><text x="1175.00" y="1507.00" class="small">Do not scale for manufacture</text></svg>
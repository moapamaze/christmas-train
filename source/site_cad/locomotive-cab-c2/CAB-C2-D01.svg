. Not</text><text x="932.00" y="321.90" font-size="15" fill="#386c60" font-weight="normal" text-anchor="start">conventional stairs; face the ladder. Ground</text><text x="932.00" y="343.35" font-size="15" fill="#386c60" font-weight="normal" text-anchor="start">and grip remain unverified.</text><text x="715.00" y="880.00" font-size="14" fill="#ad6939" font-weight="bold" text-anchor="start">Stowed ladder blocks exit; release and controlled descent are unresolved.</text><text x="715.00" y="906.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">32 OD handholds; 61.5 nominal skin clearance. Keep the broad sweep clear.</text><path d="M60.00,930.00 L1340.00,930.00" fill="none" stroke="#bac9bf" stroke-width="1"/><text x="60.00" y="958.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">CAB-C2-D01 · 22 October 2026 · dimensions in mm · review / fabrication unreleased</text><text x="1340.00" y="958.00" font-size="14" fill="#ad6939" font-weight="bold" text-anchor="end">LT32 + Cab C2</text></svg>
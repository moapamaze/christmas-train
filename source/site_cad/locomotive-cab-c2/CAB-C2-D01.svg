fill="#386c60" font-weight="bold" text-anchor="start">Net cut 700 ×1900</text><text x="410.00" y="473.00" font-size="15" fill="#263e43" font-weight="normal" text-anchor="start">600 ×1850 comparison</text><text x="410.00" y="494.45" font-size="15" fill="#263e43" font-weight="normal" text-anchor="start">envelope leaves 50 mm each</text><text x="410.00" y="515.90" font-size="15" fill="#263e43" font-weight="normal" text-anchor="start">side and 50 mm above. This</text><text x="410.00" y="537.35" font-size="15" fill="#263e43" font-weight="normal" text-anchor="start">is a project probe, not a</text><text x="410.00" y="558.80" font-size="15" fill="#263e43" font-weight="normal" text-anchor="start">regulatory clearance.</text><text x="410.00" y="620.00" font-size="15" fill="#ad6939" font-weight="normal" text-anchor="start">Door leaf, latch, seals,</text><text x="410.00" y="641.45" font-size="15" fill="#ad6939" font-weight="normal" text-anchor="start">jamb strength and weather</text><text x="410.00" y="662.90" font-size="15" fill="#ad6939" font-weight="normal" text-anchor="start">protection remain</text><text x="410.00" y="684.35" font-size="15" fill="#ad6939" font-weight="normal" text-anchor="start">unselected.</text><text x="100.00" y="843.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">40 square ×3 header/posts are unqualified candidates.</text><text x="100.00" y="872.00" font-size="14" fill="#ad6939" font-weight="normal" text-anchor="start">Former C1 net opening: 540 ×1735.</text><path d="M665.00,195.00 L665.00,900.00" fill="none" stroke="#bac9bf" stroke-width="1"/><text x="715.00" y="195.00" font-size="17" fill="#386c60" font-weight="bold" text-anchor="start">FOLDING ACCESS LADDER / TRANSVERSE SECTION</text><text x="715.00" y="219.00" font-size="12" fill="#386c60" font-weight="normal" text-anchor="start">SCHEMATIC · DIMENSIONS GOVERN</text><path d="M745.38,563.24 L745.38,264.94" fill="none" stroke="#386c60" stroke-width="3"/><path d="M744.70,563
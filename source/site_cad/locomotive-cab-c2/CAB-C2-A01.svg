text x="1320.00" y="410.00" font-size="15" fill="#263e43" font-weight="bold" text-anchor="end">Y−1220…−1060</text><text x="875.00" y="442.00" font-size="15" fill="#263e43" font-weight="normal" text-anchor="start">Console underside</text><text x="1320.00" y="442.00" font-size="15" fill="#263e43" font-weight="bold" text-anchor="end">Z2255</text><text x="875.00" y="474.00" font-size="15" fill="#263e43" font-weight="normal" text-anchor="start">Console / liner gap</text><text x="1320.00" y="474.00" font-size="15" fill="#263e43" font-weight="bold" text-anchor="end">22.5</text><text x="875.00" y="506.00" font-size="15" fill="#263e43" font-weight="normal" text-anchor="start">Aft seat-back limit</text><text x="1320.00" y="506.00" font-size="15" fill="#263e43" font-weight="bold" text-anchor="end">X10112</text><rect x="875.00" y="555.00" width="445.00" height="135.00" rx="6" fill="#edf2e9" stroke="none" stroke-width="0"/><text x="892.00" y="583.00" font-size="16" fill="#386c60" font-weight="bold" text-anchor="start">Movement around the seats</text><text x="892.00" y="609.00" font-size="15" fill="#386c60" font-weight="normal" text-anchor="start">600-wide plan envelope runs down the central</text><text x="892.00" y="630.45" font-size="15" fill="#386c60" font-weight="normal" text-anchor="start">aisle and behind the seats to either side exit.</text><text x="892.00" y="651.90" font-size="15" fill="#386c60" font-weight="normal" text-anchor="start">Rear clearance: 883.8 at full aft.</text><rect x="875.00" y="710.00" width="445.00" height="130.00" rx="6" fill="#f7ecdf" stroke="none" stroke-width="0"/><text x="892.00" y="738.00" font-size="16" fill="#ad6939" font-weight="bold" text-anchor="start">Occupied mock-up still needed</text><text x="892.00" y="764.00" font-size="15" fill="#ad6939" font-weight="normal" text-anchor="start">Belt release, standing from the seat, turning</text><text x="892.00" y="785.45" font-size="15" fill="#ad6939" font-weight="normal" text-anchor="start">and ladder descent are not proved by this plan.</text><text x="892.00" y="806.90" font-size="15" fill="#ad6939" font-weight="normal" text-anchor="start">The stowed ladder obstructs the exit.</text><text x="875.00" y="870.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">Dashed amber seat boxes show full travel. Console</text><text x="875.00" y="890.02" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">overlaps the cushion in plan but sits above it.</text><path d="M60.00,930.00 L1340.00,930.00" fill="none" stroke="#bac9bf" stroke-width="1"/><text x="60.00" y="958.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">CAB-C2-A01 · 22 October 2026 · dimensions in mm · review / fabrication unreleased</text><text x="1340.00" y="958.00" font-size="14" fill="#ad6939" font-weight="bold" text-anchor="end">LT32 + Cab C2</text></svg>
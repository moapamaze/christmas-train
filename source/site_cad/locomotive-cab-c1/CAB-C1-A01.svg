xt x="368.2" y="500.5075" font-size="14" fill="#386c60" font-weight="bold" text-anchor="start">1031 aisle</text><path d="M860,200 L860,880" fill="none" stroke="#ccd5cd" stroke-width="1"/><text x="910" y="220" font-size="18" fill="#386c60" font-weight="bold" text-anchor="start">SEAT DATUMS</text><text x="910" y="260" font-size="15" fill="#263e43" font-weight="normal" text-anchor="start">Centres</text><text x="1320" y="260" font-size="15" fill="#263e43" font-weight="bold" text-anchor="end">X9730 / Y±900</text><text x="910" y="296" font-size="15" fill="#263e43" font-weight="normal" text-anchor="start">Cushion top</text><text x="1320" y="296" font-size="15" fill="#263e43" font-weight="bold" text-anchor="end">Z2108 nominal</text><text x="910" y="332" font-size="15" fill="#263e43" font-weight="normal" text-anchor="start">Seat movement</text><text x="1320" y="332" font-size="15" fill="#263e43" font-weight="bold" text-anchor="end">±105 X / ±30 Z probe</text><text x="910" y="368" font-size="15" fill="#263e43" font-weight="normal" text-anchor="start">Side lining gap</text><text x="1320" y="368" font-size="15" fill="#263e43" font-weight="bold" text-anchor="end">83.5 mm</text><text x="910" y="404" font-size="15" fill="#263e43" font-weight="normal" text-anchor="start">Rear at full aft</text><text x="1320" y="404" font-size="15" fill="#263e43" font-weight="bold" text-anchor="end">X10112</text><text x="910" y="440" font-size="15" fill="#263e43" font-weight="normal" text-anchor="start">Rear to exit start</text><text x="1320" y="440" font-size="15" fill="#263e43" font-weight="bold" text-anchor="end">208 mm</text><text x="910" y="476" font-size="15" fill="#263e43" font-weight="normal" text-anchor="start">Footrest top</text><text x="1320" y="476" font-size="15" fill="#263e43" font-weight="bold" text-anchor="end">Z1508 /1583 /1658</text><text x="910" y="555" font-size="18" fill="#386c60" font-weight="bold" text-anchor="start">REVISED FROM LT32</text><text x="910" y="590.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">Seats move 170 mm aft, 100 mm inboard and</text><text x="910" y="614.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">100 mm up. The carried-forward seat had 1.5</text><text x="910" y="638.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">mm overlap with the current cab wall.</text><text x="910" y="700.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">Amber dashed boxes show the full seat</text><text x="910" y="724.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">travel envelope. The central aisle</text><text x="910" y="748.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">dimension is a local plan width, not a</text><text x="910" y="772.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">complete evacuation clearance.</text><text x="910" y="810.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">Cab openings and rear steps remain</text><text x="910" y="834.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">unresolved. Verify occupied entry, turning,</text><text x="910" y="858.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">exit and restraint release with a full-size</text><text x="910" y="882.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">mock-up.</text><path d="M60,930 L1340,930" fill="none" stroke="#afbeb4" stroke-width="1"/><text x="60" y="959" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">CAB-C1-A01 · 22 October 2026 · mm · review geometry / fabrication unreleased</text><text x="1340" y="959" font-size="14" fill="#b36a3c" font-weight="normal" text-anchor="end">LT32 cab datum · no supplier acceptance</text></svg>
58.0" cy="304.5" r="12" fill="#bda875" stroke="#263e43" stroke-width="1.5"/><circle cx="1158.0" cy="408.0" r="12" fill="#bda875" stroke="#263e43" stroke-width="1.5"/><path d="M915.0,485 L1054.5,485" fill="none" stroke="#386c60" stroke-width="1"/><path d="M915.0,479.0 L915.0,491.0" fill="none" stroke="#386c60" stroke-width="1.5"/><path d="M1054.5,479.0 L1054.5,491.0" fill="none" stroke="#386c60" stroke-width="1.5"/><text x="984.75" y="475.0" font-size="14" fill="#386c60" font-weight="bold" text-anchor="middle">155 centres</text><text x="780" y="565.0" font-size="15" fill="#263e43" font-weight="normal" text-anchor="start">Brake handles: 84 mm pivot-to-tip; ±25° fore/aft</text><text x="780" y="587.5" font-size="15" fill="#263e43" font-weight="normal" text-anchor="start">travel is a packaging assumption. The supplier must</text><text x="780" y="610.0" font-size="15" fill="#263e43" font-weight="normal" text-anchor="start">define the actual valve, detents, forces and</text><text x="780" y="632.5" font-size="15" fill="#263e43" font-weight="normal" text-anchor="start">connectors.</text><path d="M60,675 L1340,675" fill="none" stroke="#aabcb1" stroke-width="1"/><text x="80" y="712" font-size="17" fill="#386c60" font-weight="bold" text-anchor="start">CONTROL INTERFACES / FUNCTIONAL REVIEW ONLY</text><rect x="80" y="745" width="300" height="135" fill="#edf1e8" stroke="#386c60" stroke-width="1.5"/><text x="96" y="776" font-size="17" fill="#386c60" font-weight="bold" text-anchor="start">Inputs</text><text x="96" y="805.0" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">E-stop contacts · seat presence ·</text><text x="96" y="826.0" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">neutral / direction · BP and brake</text><text x="96" y="847.0" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">feedback</text><rect x="490" y="745" width="340" height="135" fill="#edf1e8" stroke="#386c60" stroke-width="1.5"/><text x="506" y="776" font-size="17" fill="#386c60" font-weight="bold" text-anchor="start">Safety-control interface</text><text x="506" y="805.0" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">Monitored logic and contactors / valves</text><text x="506" y="826.0" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">to be selected. Manual reset must not</text><text x="506" y="847.0" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">start motion.</text><rect x="940" y="745" width="360" height="135" fill="#edf1e8" stroke="#386c60" stroke-width="1.5"/><text x="956" y="776" font-size="17" fill="#386c60" font-weight="bold" text-anchor="start">Output interfaces</text><text x="956" y="805.0" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">Traction inhibit / neutral demand ·</text><text x="956" y="826.0" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">automatic brake emergency path · park</text><text x="956" y="847.0" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">and engine coordination</text><path d="M380,812 L490,812" fill="none" stroke="#386c60" stroke-width="2"/><path d="M830,812 L940,812" fill="none" stroke="#386c60" stroke-width="2"/><path d="M60,930 L1340,930" fill="none" stroke="#afbeb4" stroke-width="1"/><text x="60" y="959" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">CAB-C1-C01 · 22 October 2026 · mm · review geometry / fabrication unreleased</text><text x="1340" y="959" font-size="14" fill="#b36a3c" font-weight="normal" text-anchor="end">LT32 cab datum · no supplier acceptance</text></svg>
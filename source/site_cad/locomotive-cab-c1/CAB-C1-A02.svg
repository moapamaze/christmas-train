<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><style>text{font-family:Arial,Helvetica,sans-serif}*{stroke-linejoin:round}</style><rect width="1400" height="1000" fill="#fbfcf8"/><rect x="24" y="24" width="1352" height="952" fill="none" stroke="#b9c8be" stroke-width="1"/><text x="60" y="65" font-size="15" fill="#386c60" font-weight="bold" text-anchor="start">PULSIPHER FARMS / CAB C1</text><text x="60" y="112" font-size="32" fill="#263e43" font-weight="bold" text-anchor="start">Seat height, reach and legroom</text><text x="60" y="145" font-size="16" fill="#597068" font-weight="normal" text-anchor="start">Current floor Z1508 with finish · shallow roof retained · short, middle and tall geometric probes</text><text x="90" y="190" font-size="17" fill="#386c60" font-weight="bold" text-anchor="start">DRIVER SIDE / FORWARD ←</text><path d="M90.0,860.0 L842.5,860.0" fill="none" stroke="#386c60" stroke-width="3"/><path d="M90.0,256.79999999999995 L842.5,256.79999999999995" fill="none" stroke="#386c60" stroke-width="3"/><path d="M90.0,860.0 L90.0,462.56" fill="none" stroke="#263e43" stroke-width="8"/><path d="M90.0,302.55999999999995 L90.0,256.79999999999995" fill="none" stroke="#263e43" stroke-width="8"/><path d="M90.0,462.56 L90.0,302.55999999999995" fill="none" stroke="#528b9d" stroke-width="2" stroke-dasharray="6 4"/><text x="105.0" y="446.56" font-size="14" fill="#528b9d" font-weight="normal" text-anchor="start">2750 clear sill</text><rect x="310.5" y="722.4" width="175.0" height="137.6" fill="#d1dfd7" stroke="#386c60" stroke-width="1.5"/><rect x="301.04999999999995" y="668.0" width="157.5" height="27.2" fill="#627d89" stroke="#263e43" stroke-width="1.5"/><rect x="466.95" y="537.44" width="28.0" height="157.76" fill="#415a65" stroke="#263e43" stroke-width="1.5"/><rect x="228.77499999999998" y="520.16" width="4" height="99.2" fill="#9dadae" stroke="#263e43" stroke-width="1.5"/><text x="223.0" y="494.56" font-size="14" fill="#386c60" font-weight="normal" text-anchor="middle">Panel top2570</text><path d="M128.5,860.0 L296.5,860.0" fill="none" stroke="#386c60" stroke-width="2" stroke-dasharray="5 3"/><path d="M128.5,836.0 L296.5,836.0" fill="none" stroke="#386c60" stroke-width="2" stroke-dasharray="5 3"/><path d="M128.5,812.0 L296.5,812.0" fill="none" stroke="#386c60" stroke-width="2" stroke-dasharray="5 3"/><text x="212.5" y="800.16" font-size="12" fill="#386c60" font-weight="normal" text-anchor="middle">Footrest: 0 /75 /150 above finish</text><path d="M237.0,789.6 L252.75,677.6" fill="none" stroke="#b36a3c" stroke-width="5"/><path d="M252.75,677.6 L392.75,648.8" fill="none" stroke="#b36a3c" stroke-width="5"/><path d="M392.75,648.8 L399.75,508.0" fill="none" stroke="#b36a3c" stroke-width="5"/><circle cx="385.75" cy="447.2" r="30" fill="none" stroke="#b36a3c" stroke-width="1.5"/><circle cx="385.75" cy="447.2" r="4" fill="#b36a3c" stroke="#b36a3c" stroke-width="1.5"/><path d="M90.0,447.2 L385.75,447.2" fill="none" stroke="#b36a3c" stroke-width="1" stroke-dasharray="5 4"/><text x="415.75" y="440.2" font-size="13" fill="#b36a3c" font-weight="bold" text-anchor="start">Compact</text><path d="M238.75,813.6 L254.5,677.6" fill="none" stroke="#528b9d" stroke-width="5"/><path d="M254.5,677.6 L429.5,648.8" fill="none" stroke="#528b9d" stroke-width="5"/><path d="M429.5,648.8 L436.5,484.0" fill="none" stroke="#528b9d" stroke-width="5"/><circle cx="422.5" cy="420.0" r="30" fill="none" stroke="#528b9d" stroke-width="1.5"/><circle cx="422.5" cy="421.59999999999997" r="4" fill="#528b9d" stroke="#528b9d" stroke-width="1.5"/><path d="M90.0,421.59999999999997 L422.5,421.59999999999997" fill="none" stroke="#528b9d" stroke-width="1" stroke-dasharray="5 4"/><text x="452.5" y="414.59999999999997" font-size="13" fill="#528b9d" font-weight="bold" text-anchor="start">Middle</text><path d="M240.5,837.6 L256.25,677.6" fill="none" stroke="#386c60" stroke-width="5"/><path d="M256.25,677.6 L466.25,648.8" fill="none" stroke="#386c60" stroke-width="5"/><path d="M466.25,648.8 L473.25,460.0" fill="none" stroke="#386c60" stroke-width="5"/><circle cx="459.25" cy="392.8" r="30" fill="none" stroke="#386c60" stroke-width="1.5"/><circle cx="459.25" cy="396.0" r="4" fill="#386c60" stroke="#386c60" stroke-width="1.5"/><path d="M90.0,396.0 L459.25,396.0" fill="none" stroke="#386c60" stroke-width="1" stroke-dasharray="5 4"/><text x="489.25" y="389.0" font-size="13" fill="#386c60" font-weight="bold" text-anchor="start">Tall</text><path d="M545.0,668.0 L545.0,860.0" fill="none" stroke="#386c60" stroke-width="1"/><path d="M551.0,668.0 L539.0,668.0" fill="none" stroke="#386c60" stroke-width="1.5"/><path d="M551.0,860.0 L539.0,860.0" fill="none" stroke="#386c60" stroke-width="1.5"/><text x="563.0" y="754.0" font-size="14" fill="#386c60" font-weight="bold" text-anchor="start">600</text><path d="M920,200 L920,885" fill="none" stroke="#ccd5cd" stroke-width="1"/><text x="960" y="220" font-size="17" fill="#386c60" font-weight="bold" text-anchor="start">BODY PROBES / NOT PERCENTILES</text><text x="960" y="260.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">Three declared body envelopes expose</text><text x="960" y="284.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">fit problems. They are not validated</text><text x="960" y="308.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">5th /95th percentile operators or</text><text x="960" y="332.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">approval limits.</text><text x="960" y="390" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">Seat-top / floor</text><text x="1320" y="390" font-size="14" fill="#386c60" font-weight="bold" text-anchor="end">600 nominal mm</text><text x="960" y="430" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">Minimum crown gap</text><text x="1320" y="430" font-size="14" fill="#386c60" font-weight="bold" text-anchor="end">268.5 mm</text><text x="960" y="470" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">Min knee-to-panel vertical</text><text x="1320" y="470" font-size="14" fill="#386c60" font-weight="bold" text-anchor="end">87 mm</text><text x="960" y="510" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">Toe / barrier, paired settings</text><text x="1320" y="510" font-size="14" fill="#386c60" font-weight="bold" text-anchor="end">155 mm</text><text x="960" y="550" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">Min eye / sill, paired</text><text x="1320" y="550" font-size="14" fill="#386c60" font-weight="bold" text-anchor="end">18 mm</text><text x="960" y="615.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">All controls fall inside the declared</text><text x="960" y="639.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">reach spheres at the three paired seat</text><text x="960" y="663.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">settings and ±30 mm suspension probes.</text><text x="960" y="687.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">This does not prove hand access, effort</text><text x="960" y="711.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">or comfortable posture.</text><text x="960" y="755.0" font-size="16" fill="#b36a3c" font-weight="normal" text-anchor="start">Other slide settings fail reach or</text><text x="960" y="779.0" font-size="16" fill="#b36a3c" font-weight="normal" text-anchor="start">legroom: the tall probe at full forward</text><text x="960" y="803.0" font-size="16" fill="#b36a3c" font-weight="normal" text-anchor="start">places its shoe 45 mm into the front</text><text x="960" y="827.0" font-size="16" fill="#b36a3c" font-weight="normal" text-anchor="start">barrier. Full travel is not usable by</text><text x="960" y="851.0" font-size="16" fill="#b36a3c" font-weight="normal" text-anchor="start">every operator.</text><path d="M60,930 L1340,930" fill="none" stroke="#afbeb4" stroke-width="1"/><text x="60" y="959" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">CAB-C1-A02 · 22 October 2026 · mm · review geometry / fabrication unreleased</text><text x="1340" y="959" font-size="14" fill="#b36a3c" font-weight="normal" text-anchor="end">LT32 cab datum · no supplier acceptance</text></svg>
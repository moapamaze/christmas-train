-width="1.5"/><rect x="832" y="653.4" width="36" height="18" fill="#b8a476" stroke="#263e43" stroke-width="1.5"/><text x="730" y="745.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">Load path: OEM seat / belt system → adapter → pedestal → floor</text><text x="730" y="769.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">bolts and sleeves → twin outriggers → rail-side attachment</text><text x="730" y="793.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">plates → main frame.</text><text x="730" y="835.0" font-size="16" fill="#b36a3c" font-weight="normal" text-anchor="start">Only mounting-candidate steel is counted: 260.9 kg. Full cab</text><text x="730" y="859.0" font-size="16" fill="#b36a3c" font-weight="normal" text-anchor="start">mass / CG and the LT32 load cases have not been updated. No</text><text x="730" y="883.0" font-size="16" fill="#b36a3c" font-weight="normal" text-anchor="start">weld or bolt capacity released.</text><path d="M60,930 L1340,930" fill="none" stroke="#afbeb4" stroke-width="1"/><text x="60" y="959" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">CAB-C1-D01 · 22 October 2026 · mm · review geometry / fabrication unreleased</text><text x="1340" y="959" font-size="14" fill="#b36a3c" font-weight="normal" text-anchor="end">LT32 cab datum · no supplier acceptance</text></svg>
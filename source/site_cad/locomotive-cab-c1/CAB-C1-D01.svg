<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><style>text{font-family:Arial,Helvetica,sans-serif}*{stroke-linejoin:round}</style><rect width="1400" height="1000" fill="#fbfcf8"/><rect x="24" y="24" width="1352" height="952" fill="none" stroke="#b9c8be" stroke-width="1"/><text x="60" y="65" font-size="15" fill="#386c60" font-weight="bold" text-anchor="start">PULSIPHER FARMS / CAB C1</text><text x="60" y="112" font-size="32" fill="#263e43" font-weight="bold" text-anchor="start">Exit constraint and frame attachment detail</text><text x="60" y="145" font-size="16" fill="#597068" font-weight="normal" text-anchor="start">Expose the remaining problems before releasing the cab · seat restraint load path is still unqualified</text><text x="80" y="200" font-size="17" fill="#386c60" font-weight="bold" text-anchor="start">CURRENT SIDE EXIT / CLEAR OPENING</text><rect x="100" y="290.49999999999994" width="162.0" height="499.50000000000006" fill="none" stroke="#528b9d" stroke-width="2" stroke-dasharray="7 4"/><rect x="108.1" y="321.54999999999995" width="145.8" height="468.45000000000005" fill="#ddc09b55" stroke="#b36a3c" stroke-width="2"/><path d="M100,820 L262.0,820" fill="none" stroke="#386c60" stroke-width="1"/><path d="M100.0,814.0 L100.0,826.0" fill="none" stroke="#386c60" stroke-width="1.5"/><path d="M262.0,814.0 L262.0,826.0" fill="none" stroke="#386c60" stroke-width="1.5"/><text x="181.0" y="810.0" font-size="14" fill="#386c60" font-weight="bold" text-anchor="middle">600 review envelope</text><text x="95" y="253" font-size="18" fill="#b36a3c" font-weight="bold" text-anchor="start">540 ×1735 available</text><text x="315" y="325.0" font-size="17" fill="#b36a3c" font-weight="normal" text-anchor="start">60 mm width shortfall. 115 mm</text><text x="315" y="350.5" font-size="17" fill="#b36a3c" font-weight="normal" text-anchor="start">height shortfall. This is a</text><text x="315" y="376.0" font-size="17" fill="#b36a3c" font-weight="normal" text-anchor="start">declared project comparison,</text><text x="315" y="401.5" font-size="17" fill="#b36a3c" font-weight="normal" text-anchor="start">not a regulation or a validated</text><text x="315" y="427.0" font-size="17" fill="#b36a3c" font-weight="normal" text-anchor="start">body envelope.</text><text x="315" y="505.0" font-size="17" fill="#263e43" font-weight="normal" text-anchor="start">The 300 mm rise rear steps,</text><text x="315" y="530.5" font-size="17" fill="#263e43" font-weight="normal" text-anchor="start">doorway, handholds, latch /</text><text x="315" y="556.0" font-size="17" fill="#263e43" font-weight="normal" text-anchor="start">guard and standing route need</text><text x="315" y="581.5" font-size="17" fill="#263e43" font-weight="normal" text-anchor="start">one coordinated redesign. No</text><text x="315" y="607.0" font-size="17" fill="#263e43" font-weight="normal" text-anchor="start">exit clearance approval is</text><text x="315" y="632.5" font-size="17" fill="#263e43" font-weight="normal" text-anchor="start">claimed.</text><text x="315" y="690.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">Final side-window opening, rear</text><text x="315" y="714.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">cab closure, rain drainage and</text><text x="315" y="738.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">smoke / heat separation are</text><text x="315" y="762.0" font-size="16" fill="#263e43" font-weight="normal" text-anchor="start">also unfinished.</text><path d="M675,210 L675,880" fill="none" stroke="#c5cfc6" stroke-width="1"/><text x="730" y="200" font-size="17" fill="#386c60" font-weight="bold" text-anchor="start">SEAT ATTACHMENT / SECTION THROUGH BOLT</text><rect x="730.0" y="387.0" width="240" height="21.6" fill="#6b9588" stroke="#386c60" stroke-width="1.5"/><path d="M970.0,397.8 L1115,397.8" fill="none" stroke="#386c60" stroke-width="1"/><rect x="730.0" y="40
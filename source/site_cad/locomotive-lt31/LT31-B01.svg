<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img"><title>LT31–B01 · Two separate brake-line interfaces</title><style>text{font:22px Arial;fill:#25424b}.title{font-size:34px;font-weight:bold}.sub{font-size:25px;font-weight:bold}.small{font-size:19px}.dim{stroke:#47656b;stroke-width:1.5;fill:none}.dash{stroke:#a87029;stroke-width:2;fill:none;stroke-dasharray:8 5}</style><rect width="1600" height="1000" fill="#fff"/><text class="title" x="55" y="55">LT31–B01 · Two separate brake-line interfaces</text><text x="55" y="93">Functional and packaging proposal · no component selection or demonstrated failure response</text><path d="M55 115H1545" stroke="#9eb5ae"/><text class="sub" x="55" y="195">BP · Automatic brake demand / emergency pressure reduction</text><path d="M75 290H530 C700 425 900 425 1070 290H1510" fill="none" stroke="#c84f4b" stroke-width="9"/><rect x="392" y="267" width="56" height="46" rx="5" fill="white" stroke="#c84f4b" stroke-width="4"/><path d="M420 267V232h40" stroke="#c84f4b" stroke-width="5" fill="none"/><rect x="1152" y="267" width="56" height="46" rx="5" fill="white" stroke="#c84f4b" stroke-width="4"/><path d="M1180 267V232h40" stroke="#c84f4b" stroke-width="5" fill="none"/><rect x="770" y="355" width="60" height="40" rx="8" fill="white" stroke="#c84f4b" stroke-width="4"/><text class="small" x="60" y="340">Loco trunk</text><text class="small" x="335" y="218">Isolating cock</text><text class="small" x="710" y="430">Keyed coupling</text><text class="small" x="1105" y="218">Isolating cock</text><text class="small" x="1290" y="340">Coach module</text><text class="sub" x="55" y="455">FP · Reservoir charging supply / isolated from stored brake energy</text><path d="M75 550H530 C700 685 900 685 1070 550H1510" fill="none" stroke="#4288bc" stroke-width="9"/><rect x="392" y="527" width="56" height="46" rx="5" fill="white" stroke="#4288bc" stroke-width="4"/><path d="M420 527V492h40" stroke="#4288bc" stroke-width="5" fill="none"/><rect x="1152" y="527" width="56" height="46" rx="5" fill="white" stroke="#4288bc" stroke-width="4"/><path d="M1180 527V492h40" stroke="#4288bc" stroke-width="5" fill="none"/><rect x="770" y="615" width="60" height="40" rx="8" fill="white" stroke="#4288bc" stroke-width="4"/><text class="small" x="60" y="600">Loco trunk</text><text class="small" x="335" y="478">Isolating cock</text><text class="small" x="710" y="690">Keyed coupling</text><text class="small" x="1105" y="478">Isolating cock</text><text class="small" x="1290" y="600">Coach module</text><text class="small" x="55" y="780">Routing: leave the rear floor edge before descending. Keep the two loops outside the moving drawbar.</text><text class="small" x="55" y="825">BP separation must trigger automatic braking in the approved circuit; self-sealing connectors must not defeat it.</text><text class="small" x="55" y="870">FP loss must preserve stored-energy braking. Hoses are not a secondary mechanical restraint.</text><text class="small" x="55" y="940">Hold: exact hose lengths / bend limits, supports, keyed couplings, pressure ratings, valves, reservoirs and whole-train test.</text></svg>
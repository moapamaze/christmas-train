"239" class="l">Oil cooler → removable transition</text><text x="920" y="271" class="l">Package cores → one suction fan</text><text x="920" y="303" class="l">Engine bay → paired aft outlets</text><text x="920" y="385" class="s">INLET: X2050–2550 / Z1900–2550</text><text x="920" y="413" class="s">OUTLET: X4850–5500 / Z2700–3000</text><text x="920" y="441" class="s">These are gross openings.</text><text x="920" y="469" class="s">Free area, fan curve, restriction,</text><text x="920" y="497" class="s">rain/debris and hot-air recirculation</text><text x="920" y="525" class="s">remain unverified.</text><text x="920" y="620" class="s">AFT SKID SUPPORT AT X4650</text><text x="920" y="648" class="s">Adds a candidate crossbeam, two</text><text x="920" y="676" class="s">frame posts and isolator spaces.</text><text x="920" y="704" class="s">Pump carrier stays on the common skid.</text><text x="920" y="732" class="s">No assumed pump mounting feet.</text><text x="65" y="780" class="l">Engine side panel: X3100–4250 / Z1900–2800. Retain removable upper handrail provision for access.</text><text x="65" y="816" class="l">Pump panel: X4440–5520 / Z1830–2540. Its lower height avoids the existing Z2584–2616 handrail.</text><text x="65" y="852" class="l">Cooler crown hatch: X2360–2940 / Y±600; removal shown on I02.</text><text x="65" y="888" class="l">Shell edge frames, latches, captive retention, seals, duct attachments and exhaust shielding are still design holds.</text><path d="M45,1028 L1455,1028" fill="none" stroke="#b6c8c0" stroke-width="2.5"/><text x="45" y="1057" class="s">PULSIPHER FARMS · LT26-I01 · 21 OCT 2026 · PROVISIONAL REVIEW GEOMETRY</text><text x="45" y="1082" class="s">No fabrication or operating release. All stated distances are layout candidates, not supplier instructions.</text></svg>
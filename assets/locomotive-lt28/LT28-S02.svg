  <g id="text_20">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start" x="51.84" y="25.275937" transform="rotate(-0 51.84 25.275937)">LT28-S02  |  Link datums, travel stack and catch demand</text>
  </g>
  <g id="text_21">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="51.84" y="501.12" transform="rotate(-0 51.84 501.12)">Catch sensitivity: sustained 22.75 kN proxy across up to 20.59 mm free gap. Extra 4 mm adds 91 J.</text>
  </g>
  <g id="text_22">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="51.84" y="527.04" transform="rotate(-0 51.84 527.04)">Fpeak = Fdrive + √[Fdrive² + 2 k (Fdrive g + ½ meff v²)]   (consistent force/length units)</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="51.84" y="555.84" transform="rotate(-0 51.84 555.84)">Proposed allocations and elastic sensitivities only. Catch stiffness, speed, material strength and supplier ratings remain unconfirmed.</text>

x="379.4" y="484.0" width="6.6" height="44.55" fill="#b9cecb" stroke="#315954" stroke-width="2"/><rect x="278.75" y="459.25" width="82.5" height="66.0" fill="#748d85" stroke="#315954" stroke-width="2"/><rect x="278.75" y="525.25" width="82.5" height="3.3" fill="#b9cecb" stroke="#315954" stroke-width="2"/><rect x="254.0" y="418.0" width="132.0" height="16.5" fill="#b9cecb" stroke="#315954" stroke-width="2"/><rect x="278.75" y="333.24355900000006" width="82.5" height="84.75644099999994" fill="#b9cecb" stroke="#315954" stroke-width="2"/><line x1="55" y1="434.5" x2="615" y2="434.5" stroke="#a8752c" stroke-width="2" stroke-dasharray="6 5"/><text x="55" y="422.5" font-family="Arial,sans-serif" font-size="17" fill="#91651f" font-weight="normal">Z1020 datum</text><line x1="580" y1="333.24355900000006" x2="580" y2="434.5" stroke="#387989" stroke-width="2"/><line x1="573" y1="333.24355900000006" x2="587" y2="333.24355900000006" stroke="#387989" stroke-width="2"/><line x1="573" y1="434.5" x2="587" y2="434.5" stroke="#387989" stroke-width="2"/><text x="594" y="383.8717795" font-family="Arial,sans-serif" font-size="17" fill="#243d3c" font-weight="normal">61.37 rise</text><line x1="580" y1="434.5" x2="580" y2="484.0" stroke="#387989" stroke-width="2"/><line x1="573" y1="434.5" x2="587" y2="434.5" stroke="#387989" stroke-width="2"/><line x1="573" y1="484.0" x2="587" y2="484.0" stroke="#387989" stroke-width="2"/><text x="594" y="459.25" font-family="Arial,sans-serif" font-size="17" fill="#243d3c" font-weight="normal">30 centre gap</text><line x1="125" y1="333.24355900000006" x2="125" y2="701.8" stroke="#387989" stroke-width="2"/><line x1="118" y1="333.24355900000006" x2="132" y2="333.24355900000006" stroke="#387989" stroke-width="2"/><line x1="118" y1="701.8" x2="132" y2="701.8" stroke="#387989" stroke-width="2"/><text x="139" y="517.5217795" font-family="Arial,sans-serif" font-size="17" fill="#243d3c" font-weight="normal">223.37</text><text x="55" y="755" font-family="Arial,sans-serif" font-size="18" fill="#243d3c" font-weight="normal">D5 envelope: OD139.7 / calculated ID91.28</text><text x="55" y="783" font-family="Arial,sans-serif" font-size="18" fill="#243d3c" font-weight="normal">Other axles require up to 76.02 mm seat rise.</text><text x="55" y="811" font-family="Arial,sans-serif" font-size="16" fill="#243d3c" font-weight="normal">Shaded spring is a bore envelope, not coil-wire CAD.</text><text x="760" y="247" font-family="Arial,sans-serif" font-size="21" fill="#243d3c" font-weight="bold">01  GMT / coil corridor</text><text x="760" y="276" font-family="Arial,sans-serif" font-size="18" fill="#243d3c" font-weight="normal">Only 0.99 mm nominal sampled radial gap.</text><text x="760" y="300" font-family="Arial,sans-serif" font-size="18" fill="#243d3c" font-weight="normal">Inverted-GMT trial: 1.85 mm minimum.</text><text x="760" y="324" font-family="Arial,sans-serif" font-size="18" fill="#243d3c" font-weight="normal">Certified bore and tolerance allowance absent.</text><text x="760" y="382" font-family="Arial,sans-serif" font-size="21" fill="#243d3c" font-weight="bold">02  Raised cap / rebound bracket</text><text x="760" y="411" font-family="Arial,sans-serif" font-size="18" fill="#243d3c" font-weight="normal">Nut and cap envelopes overlap.</text><text x="760" y="435" font-family="Arial,sans-serif" font-size="18" fill="#243d3c" font-weight="normal">M16 hole row clips or nearly touches cap edges.</text><text x="760" y="459" font-family="Arial,sans-serif" font-size="18" fill="#243d3c" font-weight="normal">Matching sideframe holes missing in LT34.</text><text x="760" y="517" font-family="Arial,sans-serif" font-size="21" fill="#243d3c" font-weight="bold">03  Steel edge / suspension travel</text><text x="760" y="546" font-family="Arial,sans-serif" font-size="18" fill="#243d3c" font-weight="normal">Tilt advances the edge before the centre stop.</text><text x="760" y="570" font-family="Arial,sans-serif" font-size="18" fill="#243d3c" font-weight="normal">LT35 equations include the actual edge contact.</text><text x="760" y="594" font-family="Arial,sans-serif" font-size="18" fill="#243d3c" font-weight="normal">Soft springs still reach steel in heavy pulling.</text><text x="760" y="652" font-family="Arial,sans-serif" font-size="21" fill="#243d3c" font-weight="bold">04  Roll cartridge / supplier fit</text><text x="760" y="681" font-family="Arial,sans-serif" font-size="18" fill="#243d3c" font-weight="normal">Guide OD37.5 / ID34: wall only 1.75 mm.</text><text x="760" y="705" font-family="Arial,sans-serif" font-size="18" fill="#243d3c" font-weight="normal">G63-152 guide clearance must be confirmed.</text><text x="760" y="729" font-family="Arial,sans-serif" font-size="18" fill="#243d3c" font-weight="normal">Keeper, lip and attachment strength unresolved.</text><line x1="45" y1="837" x2="1355" y2="837" stroke="#387989" stroke-width="2"/><text x="45" y="865" font-family="Arial,sans-serif" font-size="18" fill="#243d3c" font-weight="normal">NEXT: shorter standard spring + certified data → checked seats/stops → coordinated drawing and whole assembly</text></svg>
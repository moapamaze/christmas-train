0</text><rect x="848.125" y="516.25" width="262.5" height="20.0" class="rear"/><circle cx="882.5" cy="564.375" r="90.625" class="wheel"/><path d="M882.5 564.375L963.75 564.375" class="line"/><path d="M882.5 564.375L952.8645640574856 523.75" class="line"/><path d="M882.5 564.375L923.125 494.0104359425144" class="line"/><path d="M882.5 564.375L882.5 483.125" class="line"/><path d="M882.5 564.375L841.875 494.01043594251433" class="line"/><path d="M882.5 564.375L812.1354359425144 523.75" class="line"/><path d="M882.5 564.375L801.25 564.375" class="line"/><path d="M882.5 564.375L812.1354359425144 605.0" class="line"/><path d="M882.5 564.375L841.875 634.7395640574856" class="line"/><path d="M882.5 564.375L882.5 645.625" class="line"/><path d="M882.5 564.375L923.125 634.7395640574856" class="line"/><path d="M882.5 564.375L952.8645640574856 605.0" class="line"/><circle cx="882.5" cy="564.375" r="15.625" class="rear"/><circle cx="1076.25" cy="564.375" r="90.625" class="wheel"/><path d="M1076.25 564.375L1157.5 564.375" class="line"/><path d="M1076.25 564.375L1146.6145640574857 523.75" class="line"/><path d="M1076.25 564.375L1116.875 494.0104359425144" class="line"/><path d="M1076.25 564.375L1076.25 483.125" class="line"/><path d="M1076.25 564.375L1035.625 494.01043594251433" class="line"/><path d="M1076.25 564.375L1005.8854359425144 523.75" class="line"/><path d="M1076.25 564.375L995.0 564.375" class="line"/><path d="M1076.25 564.375L1005.8854359425144 605.0" class="line"/><path d="M1076.25 564.375L1035.625 634.7395640574856" class="line"/><path d="M1076.25 564.375L1076.25 645.625" class="line"/><path d="M1076.25 564.375L1116.875 634.7395640574856" class="line"/><path d="M1076.25 564.375L1146.6145640574857 605.0" class="line"/><circle cx="1076.25" cy="564.375" r="15.625" class="rear"/><path d="M908.75 578.125L1102.5 578.125" class="rear"/><circle cx="979.375" cy="513.75" r="8" fill="#c49e58"/><text x="914.375" y="700" class="small">Rear truck</text><path d="M882.5 738L1076.25 738" class="dim"/><text x="954.375" y="767" class="small">1,550</text><circle cx="195.0" cy="614.375" r="40.625" class="wheel"/><circle cx="326.25" cy="614.375" r="40.625" class="wheel"/><circle cx="1251.25" cy="611.25" r="43.75" class="wheel"/><circle cx="1370.0" cy="611.25" r="43.75" class="wheel"/><rect x="323.125" y="501.25" width="56.25" height="50.0" class="front"/><path d="M60 655.0L1510 655.0" class="line"/><path d="M579.375 805L979.375 805" class="dim"/><text x="695.0" y="835" class="small">3,200 pivot spacing</text><text x="50" y="880" class="small">Four driver axles: X3300 /4850 /6500 /8050. Nominal gap between middle wheel rims: 200.</text><text x="50" y="913" class="small">Aft body extension: 1,500. Main-frame top: 1,454.8; body and cab floor heights retained.</text><path d="M45 940L1555 940" class="line"/><text x="45" y="980" class="sub">B  |  Articulation and the next connections</text><text x="50" y="1020" class="small">• Both powered frames turn; each keeps its two axles parallel within a 1,550 mm wheelbase.</text><text x="50" y="1055" class="small">• Separate side rods stay within each truck. Cylinders move with the front truck; no cross-truck rod.</text><text x="50" y="1090" class="small">• Eight primary-spring spaces, two yaw-support stacks and two fixed-length small-truck arms are shown.</text><text x="50" y="1125" class="small">• Drive, springs, pivots, rebound locks, brakes and flexible hoses require new detailed engineering.</text><path d="M45 1160L1555 1160" class="line"/><text x="45" y="1205" class="small">Read with the interactive plan and LT18 engineering record. No approved minimum radius or fabrication release.</text></svg>
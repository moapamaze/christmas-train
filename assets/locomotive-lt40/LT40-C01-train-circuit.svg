rx="6" fill="#f0f5f3" stroke="#173b4b" stroke-width="2" stroke-dasharray="8 5"/><text x="80.00" y="550.00" class="small bold" style="fill:#173b4b">LOCOMOTIVE</text><text x="80.00" y="578.00" class="small">A05 reserve protection</text><text x="80.00" y="601.00" class="small">A04: 2 × 40 L protected</text><text x="80.00" y="624.00" class="small">A07 parking release</text><text x="80.00" y="647.00" class="small">Anti-compounding required</text><text x="80.00" y="670.00" class="small">Automatic + independent</text><text x="80.00" y="693.00" class="small">Control hardware TBD</text><text x="80.00" y="716.00" class="small">B06: 4 brake equivalents</text><text x="80.00" y="762.00" class="small">Reserve held on FP loss</text><text x="80.00" y="785.00" class="small">Verify protection valve</text><text x="322.00" y="485.00" class="bold" style="fill:#a26721">J1</text><polyline points="425.00,375.00 425.00,520.00" fill="none" stroke="#217d62" stroke-width="3"/><circle cx="425" cy="375" r="4" fill="#217d62"/><polyline points="480.00,440.00 480.00,520.00" fill="none" stroke="#2374ab" stroke-width="3"/><circle cx="480" cy="440" r="4" fill="#2374ab"/><rect x="370.00" y="520.00" width="250.00" height="295.00" rx="6" fill="#f0f5f3" stroke="#173b4b" stroke-width="2" stroke-dasharray="8 5"/><text x="385.00" y="550.00" class="small bold" style="fill:#173b4b">C1 · REGULAR</text><text x="385.00" y="578.00" class="small">A05 reserve protection</text><text x="385.00" y="601.00" class="small">A04: 2 × 40 L protected</text><text x="385.00" y="624.00" class="small">A07 parking release</text><text x="385.00" y="647.00" class="small">Anti-compounding required</text><text x="385.00" y="670.00" class="small">A06 reference module</text><text x="385.00" y="693.00" class="small">A11: 6 L control reference</text><text x="385.00" y="716.00" class="small">B01–B04: 4 brake stations</text><text x="385.00" y="762.00" class="small">Reserve held on FP loss</text><text x="385.00" y="785.00" class="small">Verify protection valve</text><text x="627.00" y="485.00" class="bold" style="fill:#a26721">J2</text><polyline points="730.00,375.00 730.00,520.00" fill="none" stroke="#217d62" stroke-width="3"/><circle cx="730" cy="375" r="4" fill="#217d62"/><polyline points="785.00,440.00 785.00,520.00" fill="none" stroke="#2374ab" stroke-width="3"/><circle cx="785" cy="440" r="4" fill="#2374ab"/><rect x="675.00" y="520.00" width="250.00" height="295.00" rx="6" fill="#f0f5f3" stroke="#173b4b" stroke-width="2" stroke-dasharray="8 5"/><text x="690.00" y="550.00" class="small bold" style="fill:#173b4b">C2 · REGULAR</text><text x="690.00" y="578.00" class="small">A05 reserve protection</text><text x="690.00" y="601.00" class="small">A04: 2 × 40 L protected</text><text x="690.00" y="624.00" class="small">A07 parking release</text><text x="690.00" y="647.00" class="small">Anti-compounding required</text><text x="690.00" y="670.00" class="small">A06 reference module</text><text x="690.00" y="693.00" class="small">A11: 6 L control reference</text><text x="690.00" y="716.00" class="small">B01–B04: 4 brake stations</text><text x="690.00" y="762.00" class="small">Reserve held on FP loss</text><text x="690.00" y="785.00" class="small">Verify protection valve</text><text x="932.00" y="485.00" class="bold" style="fill:#a26721">J3</text><polyline points="1035.00,375.00 1035.00,520.00" fill="none" stroke="#217d62" stroke-width="3"/><circle cx="1035" cy="375" r="4" fill="#217d62"/><polyline points="1090.00,440.00 1090.00,520.00" fill="none" stroke="#2374ab" stroke-width="3"/><circle cx="1090" cy="440" r="4" fill="#2374ab"/><rect x="980.00" y="520.00" width="250.00" height="295.00" rx="6" fill="#f0f5f3" stroke="#173b4b" stroke-width="2" stroke-dasharray="8 5"/><text x="995.00" y="550.00" class="small bold" style="fill:#173b4b">C3 · REGULAR</text><text x="995.00" y="578.00" class="small">A05 reserve protection</text><text x="995.00" y="601.00" class="small">A04: 2 × 40 L protected</text><text x="995.00" y="624.00" class="small">A07 parking release</text><text x="995.00" y="647.00" class="small">Anti-compounding required</text><text x="995.00" y="670.00" class="small">A06 reference module</text><text x="995.00" y="693.00" class="small">A11: 6 L control reference</text><text x="995.00" y="716.00" class="small">B01–B04: 4 brake stations</text><text x="995.00" y="762.00" class="small">Reserve held on FP loss</text><text x="995.00" y="785.00" class="small">Verify protection valve</text><text x="1237.00" y="485.00" class="bold" style="fill:#a26721">J4</text><polyline points="1340.00,375.00 1340.00,520.00" fill="none" stroke="#217d62" stroke-width="3"/><circle cx="1340" cy="375" r="4" fill="#217d62"/><polyline points="1395.00,440.00 1395.00,520.00" fill="none" stroke="#2374ab" stroke-width="3"/><circle cx="1395" cy="440" r="4" fill="#2374ab"/><rect x="1285.00" y="520.00" width="250.00" height="295.00" rx="6" fill="#f0f5f3" stroke="#173b4b" stroke-width="2" stroke-dasharray="8 5"/><text x="1300.00" y="550.00" class="small bold" style="fill:#173b4b">C4 · ADA</text><text x="1300.00" y="578.00" class="small">A05 reserve protection</text><text x="1300.00" y="601.00" class="small">A04: 2 × 40 L protected</text><text x="1300.00" y="624.00" class="small">A07 parking release</text><text x="1300.00" y="647.00" class="small">Anti-compounding required</text><text x="1300.00" y="670.00" class="small">A06 reference module</text><text x="1300.00" y="693.00" class="small">A11: 6 L control reference</text><text x="1300.00" y="716.00" class="small">B01–B04: 4 brake stations</text><text x="1300.00" y="762.00" class="small">Reserve held on FP loss</text><text x="1300.00" y="785.00" class="small">Verify protection valve</text><text x="55.00" y="867.00" class="small">J1–J4: two pipe crossings each = eight proposed BP/FP hose crossings. Coupling halves, cocks and terminal ends TBD.</text><text x="55.00" y="910.00" class="small">Existing layout inventory: eleven 40 L tanks = 440 L. Four A11 reference vessels add 24 L conditionally (464 L total).</text><text x="55.00" y="941.00" class="small">A11 follows BP control pressure; do not charge-budget those 24 L at 9 bar. Locomotive control volume remains unknown.</text><text x="55.00" y="972.00" class="small">BP continuity must reach every vehicle. Separation must apply both portions; self-sealing/cock arrangements need review.</text><text x="55.00" y="1003.00" class="small">Physical through-pipes beyond the first coach and final end terminations are not yet modeled.</text><text x="55.00" y="1034.00" class="small">Dryer purge, reservoir drains, relief outlets and valve exhausts need individual ports and safe discharge locations.</text><text x="55.00" y="1101.00" class="small">LEGEND: blue BP control  |  green supply  |  amber dashed safety intent / open interface  |  blocks are functional, not valve symbols</text><text x="55.00" y="1127.00" class="small">Junction dot = connection. A crossing without a dot is not a connection. Exhaust and drain locations remain open.</text><polyline points="40.00,1157.00 1560.00,1157.00" fill="none" stroke="#173b4b" stroke-width="1"/><text x="45.00" y="1187.00" class="small">PULSIPHER FARMS  |  Item tags match LT40 parts schedule  |  All pressures gauge unless stated</text><text x="1175.00" y="1187.00" class="small">Do not scale for manufacture</text></svg>
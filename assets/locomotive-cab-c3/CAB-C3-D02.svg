<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">C3 isolated two-position lock cartridge</title><desc id="desc">Dimensioned geometry study. Index disc, paired clevis cheeks, pin stroke and endpoint contact. Frame carrier and drive are absent.</desc><rect width="1600" height="1100" fill="#f7f5ed"/><g font-family="Arial,sans-serif"><text x="65" y="62" font-size="20" fill="#55726b" font-weight="700">PULSIPHER FARMS  /  CAB C3</text><text x="65" y="110" font-size="37" fill="#233e40" font-weight="700">Two positions. Separate stops. A visible pin.</text><text x="65" y="149" font-size="18" fill="#9b643e" font-weight="700">D02 · ISOLATED MECHANISM STUDY · DIMENSIONS IN mm · NOT FOR FABRICATION</text><path d="M65,174 L1535,174" fill="none" stroke="#597976" stroke-width="2"/><text x="70" y="205" font-size="23" fill="#233e40" font-weight="700">SIDE VIEW — DEPLOYED</text><text x="825" y="205" font-size="23" fill="#233e40" font-weight="700">SECTION THROUGH LOCK PIN</text><circle cx="350" cy="445" r="187.5" fill="#d7c8a4" stroke="#597976" stroke-width="2"/><circle cx="350" cy="445" r="37.650000000000006" fill="#f7f5ed" stroke="#597976" stroke-width="2"/><circle cx="350" cy="445" r="150.0" fill="none" stroke="#b6b4a7" stroke-width="1"/><path d="M115,445 L625,445" fill="none" stroke="#a9b7ac" stroke-width="1" stroke-dasharray="6 5"/><path d="M350,220 L350,690" fill="none" stroke="#a9b7ac" stroke-width="1" stroke-dasharray="6 5"/><circle cx="350.0" cy="595.0" r="15.75" fill="#f7f5ed" stroke="#597976" stroke-width="2"/><circle cx="350.0" cy="595.0" r="15.0" fill="none" stroke="#ad7148" stroke-width="1"/><circle cx="277.00604454672225" cy="313.95847044816327" r="15.75" fill="#f7f5ed" stroke="#597976" stroke-width="2"/><circle cx="277.00604454672225" cy="313.95847044816327" r="15.0" fill="none" stroke="#ad7148" stroke-width="1"/><text x="95" y="704" font-size="20" fill="#233e40" font-weight="400">Ø250 ×12 disc · Ø21 index holes on R100</text><text x="95" y="735" font-size="20" fill="#233e40" font-weight="400">Angular separation 150.880917°</text><text x="95" y="766" font-size="20" fill="#233e40" font-weight="400">Lug ±4° · two fixed stop faces at endpoints</text><polygon points="574.452,460.695 574.619,458.083 574.756,455.468 574.863,452.852 574.939,450.236 574.985,447.618 575.000,445.000 574.985,442.382 574.939,439.764 574.863,437.148 574.756,434.532 574.619,431.917 574.452,429.305 529.562,432.444 529.695,434.534 529.805,436.625 529.890,438.718 529.951,440.812 529.988,442.906 530.000,445.000 529.988,447.094 529.951,449.188 529.890,451.282 529.805,453.375 529.695,455.466 529.562,457.556" fill="#ad7148" stroke="#ad7148"/><polygon points="578.968,485.373 579.311,483.374 579.638,481.371 579.946,479.366 580.237,477.358 580.511,475.347 580.767,473.335 581.005,471.320 581.226,469.303 581.430,467.284 581.615,465.264 581.783,463.242 581.934,461.218 541.532,458.393 541.408,460.064 541.269,461.734 541.116,463.402 540.948,465.069 540.766,466.735 540.569,468.399 540.357,470.061 540.131,471.721 539.891,473.379 539.636,475.035 539.367,476.689 539.083,478.340" fill="#63847e" stroke="#63847e"/><polygon points="139.488,346.304 138.635,348.144 137.798,349.992 136.977,351.848 136.172,353.710 135.383,355.580 134.611,357.456 133.855,359.339 133.116,361.229 132.393,363.124 131.687,365.026 130.998,366.935 130.325,368.849 168.591,382.114 169.146,380.533 169.716,378.957 170.299,377.387 170.896,375.821 171.506,374.261 172.131,372.706 172.768,371.156 173.419,369.612 174.084,368.074 174.762,366.542 175.453,365.016 176.158,363.496" fill="#63847e" stroke="#63847e"/><path d="M162.5,240 L537.5,240" fill="none" stroke="#597976" stroke-width="2"/><path d="M157.5,233 L167.5,247" fill="none" stroke="#597976" stroke-width="2"/><path d="M532.5,233 L542.5,247" fill="none" stroke="#597976" stroke-width="2"/><text x="358.0" y="232.0" font-size="18" fill="#233e40" font-weight="400">250</text><path d="M350.0,595.0 L510.0,630.0" fill="none" stroke="#ad7148" stroke-width="2"/><text x="515.0" y="635.0" font-size="19" fill="#233e40" font-weight="400">Ø20 pin</text><path d="M350,445 L500.0,445" fill="none" stroke="#597976" stroke-width="2"/><text x="405" y="433" font-size="18" fill="#233e40" font-weight="400">R100</text><text x="70" y="815" font-size="17" fill="#716559" font-weight="400">Nominal fits only. Hole edge distance, pin bending, fatigue and attachments remain open.</text><rect x="1088" y="310" width="32" height="260" fill="#94aaa3" stroke="#597976"/><rect x="1200" y="310" width="32" height="260" fill="#94aaa3" stroke="#597976"/><rect x="1136" y="295" width="48" height="290" fill="#d7c8a4" stroke="#597976"/><rect x="1088" y="402" width="144" height="84" fill="#f7f5ed" stroke="#f7f5ed"/><rect x="1056" y="404" width="208" height="80" fill="#bb805a" stroke="#597976"/><rect x="1032" y="376" width="24" height="136" fill="#bb805a" stroke="#597976"/><path d="M985,444 L1330,444" fill="none" stroke="#8b988b" stroke-width="1" stroke-dasharray="6 5"/><path d="M1136,610 L1184,610" fill="none" stroke="#597976" stroke-width="2"/><path d="M1131,603 L1141,617" fill="none" stroke="#597976" stroke-width="2"/><path d="M1179,603 L1189,617" fill="none" stroke="#597976" stroke-width="2"/><text x="1168.0" y="602.0" font-size="18" fill="#233e40" font-weight="400">12</text><path d="M1120,652 L1200,652" fill="none" stroke="#597976" stroke-width="2"/><path d="M1115,645 L1125,659" fill="none" stroke="#597976" stroke-width="2"/><path d="M1195,645 L1205,659" fill="none" stroke="#597976" stroke-width="2"/><text x="1168.0" y="644.0" font-size="18" fill="#233e40" font-weight="400">20 clear</text><text x="830" y="704" font-size="20" fill="#233e40" font-weight="400">8 mm cheeks · nominal 4 mm side gaps</text><text x="830" y="735" font-size="20" fill="#233e40" font-weight="400">52 mm pin grip · 60 mm withdrawal</text><text x="830" y="766" font-size="19" fill="#233e40" font-weight="400">16 mm clear of the outer cheek when withdrawn</text><path d="M1035,550 L795,550" fill="none" stroke="#ad7148" stroke-width="3"/><text x="835" y="595" font-size="18" fill="#9b643e" font-weight="400">Withdrawal</text><rect x="65" y="850" width="1470" height="170" fill="#e8eee5" stroke="#bfccc0"/><text x="90" y="887" font-size="18" fill="#44675b" font-weight="700">BOUNDARY OF THIS DRAWING</text><text x="90" y="922" font-size="19" fill="#233e40" font-weight="400">Four cartridge studies: one at each ladder stringer on both sides. Direct pin-position witness requires a guarded viewing route.</text><text x="90" y="954" font-size="19" fill="#233e40" font-weight="400">Frame carriers, hinge bearings, hub attachments, release springs/linkage, drive, guards and electrical monitoring are not finished.</text><text x="90" y="986" font-size="18" fill="#233e40" font-weight="400">Endpoint contact and ten sampled cartridge poses checked in CAD. Full installation, continuous sweep and occupied use are unverified.</text><path d="M65,1040 L1535,1040" fill="none" stroke="#597976" stroke-width="2"/><text x="65" y="1075" font-size="17" fill="#233e40" font-weight="700">CAB-C3-D02  /  22 OCT 2026</text><text x="920" y="1075" font-size="18" fill="#233e40" font-weight="400">C2 remains the integrated LT32 baseline.</text></g></svg>
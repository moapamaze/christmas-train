<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1050"><style>text{font-family:Arial,sans-serif;fill:#17364a}.t{font-size:19px}.s{font-size:16px}.d{stroke:#9b6d2e;stroke-width:1.4;fill:none}.l{stroke:#17364a;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#fffef9"/><text x="45" y="45" font-size="29" font-weight="bold">LT2-J01 · Removable engine skid / frame-side connection</text><text x="45" y="78" class="t">Two mounting stations X2,400 / X4,500; four feet and eight M16 candidate bolts · mm</text><rect x="60.0" y="370.0" width="700.0" height="284.47999999999996" fill="#8aa1a4" stroke="#17364a" stroke-width="2"/><rect x="256.0" y="654.48" width="308.0" height="17.779999999999998" fill="#c4a66d" stroke="#17364a" stroke-width="2"/><rect x="256.0" y="352.22000000000025" width="308.0" height="17.779999999999998" fill="#c4a66d" stroke="#17364a" stroke-width="2"/><rect x="256.0" y="334.4400000000002" width="308.0" height="17.779999999999998" fill="#718b69" stroke="#17364a" stroke-width="2"/><rect x="374.44" y="192.20000000000005" width="71.11999999999999" height="142.23999999999998" fill="#718b69" stroke="#17364a" stroke-width="2"/><rect x="60.0" y="378.8899999999999" width="700.0" height="266.7" fill="#fffef9" stroke="#17364a"/><rect x="383.33" y="201.08999999999992" width="53.339999999999996" height="124.46" fill="#fffef9" stroke="#17364a"/><rect x="294.22" y="370.0" width="35.559999999999995" height="284.47999999999996" fill="#adab8e" stroke="#17364a"/><path d="M312.0,300.0V699.0" stroke="#273a42" stroke-width="8"/><rect x="295.2" y="320.4399999999999" width="33.599999999999994" height="14.0" fill="#273a42"/><rect x="295.2" y="672.2600000000001" width="33.599999999999994" height="18.2" fill="#273a42"/><rect x="490.21999999999997" y="370.0" width="35.559999999999995" height="284.47999999999996" fill="#adab8e" stroke="#17364a"/><path d="M508.0,300.0V699.0" stroke="#273a42" stroke-width="8"/><rect x="491.2" y="320.4399999999999" width="33.599999999999994" height="14.0" fill="#273a42"/><rect x="491.2" y="672.2600000000001" width="33.599999999999994" height="18.2" fill="#273a42"/><path class="d" d="M312.0,782v16M508.0,782v16M312.0,790H508.0"/><text x="365.0" y="779" class="s">140 bolt pitch</text><text x="850" y="190" class="t">Skid runner: HSS4×2×1/4; top Z1,777.0</text><text x="850" y="243" class="t">Foot plate: 240×220×12.7; two Ø18 holes</text><text x="850" y="296" class="t">Cap plate: 240×220×12.7; top Z1,662.7</text><text x="850" y="349" class="t">Crossmember: HSS8×4×1/4; top Z1,650</text><text x="850" y="402" class="t">Sleeve: OD25.4 / ID18 / length203.2</text><text x="850" y="455" class="t">Back plate: 240×220×12.7; bottom Z1434.1</text><text x="850" y="508" class="t">Frame-side hole grid: X2400/4500, Y±430/±570</text><text x="850" y="561" class="t">Bolt length, lock/preload and washer stack unresolved</text><text x="850" y="614" class="t">Engine-side pad blanks stay undrilled for OEM mounts</text><text x="45" y="865" class="t">Section follows the actual pad/sleeve stack; bolt shapes are identification proxies. No OEM isolator or engine-bolt pattern is implied.</text><text x="45" y="906" class="t">Sleeves bypass hollow walls in clamp compression. Their wall retention, end contact, welds and local bending still need design verification.</text><text x="45" y="985" class="s">PF-LOCO-LT2-R0 · Not released for manufacture · No torque value assigned before finish, preload and clamp-stack validation</text></svg>
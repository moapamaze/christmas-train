<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1050"><style>text{font-family:Arial,sans-serif;fill:#17364a}.t{font-size:19px}.s{font-size:16px}.d{stroke:#9b6d2e;stroke-width:1.4;fill:none}.l{stroke:#17364a;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#fffef9"/><text x="45" y="45" font-size="29" font-weight="bold">LT2-P01 · Custom skid plate and sleeve definitions</text><text x="45" y="78" class="t">Nominal physical parts from the CAD source · no released fit/position tolerances</text><rect x="130" y="185" width="480" height="440" fill="#dbe4df" stroke="#17364a" stroke-width="3"/><circle cx="370" cy="265" r="18" fill="#fffef9" stroke="#17364a" stroke-width="3"/><circle cx="370" cy="545" r="18" fill="#fffef9" stroke="#17364a" stroke-width="3"/><path class="d" d="M130,662v16M610,662v16M130,670H610"/><text x="325.0" y="659" class="s">240</text><path class="d" d="M100,185H120M100,625H120M110,185V625"/><text x="50" y="420" class="t">220</text><text x="125" y="725" class="t">CAP / FOOT / BACK: 12 pieces total</text><text x="125" y="760" class="t">Two Ø18 holes at local X120, Y40 / Y180</text><text x="125" y="795" class="t">12.7mm A572 Grade50 plate proposal</text><rect x="950" y="200" width="50.8" height="406.4" fill="#b4b89b" stroke="#17364a" stroke-width="3"/><rect x="957.4" y="200" width="36" height="406.4" fill="#fffef9" stroke="#17364a"/><text x="1110" y="280" class="t">Eight sleeves</text><text x="1110" y="330" class="t">OD25.4 / ID18</text><text x="1110" y="380" class="t">Length203.2</text><text x="1110" y="430" class="t">Stock grade and finish unresolved</text><text x="850" y="725" class="t">Frame wall receiving holes Ø26; radial gap0.3mm</text><text x="850" y="765" class="t">Do not infer a press fit or a qualified sleeve weld</text><text x="45" y="885" class="t">Proposed fabrication route: cut plate blanks → locate/bore holes → dry-fit sleeves and backing → qualify attachment/retention → inspect.</text><text x="45" y="930" class="t">Saw/bore/weld tolerances and acceptance limits must be assigned with actual stock, welding sequence and engine vibration loads.</text><text x="45" y="985" class="s">PF-LOCO-LT2-R0 · Main frame and bolsters require separate structural/fatigue/local-wall review before release</text></svg>
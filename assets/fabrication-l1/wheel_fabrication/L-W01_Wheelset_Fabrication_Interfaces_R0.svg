<text x="48" y="1071" font-size="16" fill="#183a46" font-weight="400" text-anchor="start">The caliper extends beyond the disc. Check worn wheel diameter, flange, track hardware, suspension, axlebox movement and bogie yaw.</text>
<text x="48" y="1097" font-size="16" fill="#183a46" font-weight="400" text-anchor="start">No bore fit, bolt pattern, flange profile, axle diameter, material class or NDT acceptance is released by this drawing.</text>

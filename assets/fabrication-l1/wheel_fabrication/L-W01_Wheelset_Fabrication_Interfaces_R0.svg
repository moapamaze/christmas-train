<title id="title">L-W01 — custom wheelset and brake-disc fabrication interfaces</title><desc id="desc">Front section and exploded sequence of two custom monobloc wheels pressed on a rotating axle, an axle-mounted brake-disc carrier, and outboard bearings. 500 millimetre wheel and 12 inch rotor are fit studies. Machining dimensions are held for engineering.</desc>

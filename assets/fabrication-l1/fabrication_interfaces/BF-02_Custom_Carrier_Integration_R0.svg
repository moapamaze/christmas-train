<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-label="AXLEBOX-REFERENCED BRAKE CARRIER"><rect width="1600" height="1080" fill="white"/><rect x="18" y="18" width="1564" height="1044" fill="white" stroke="#173547" stroke-width="2"/><text x="45" y="58" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#173547" font-weight="bold" text-anchor="start">BF-02  AXLEBOX-REFERENCED BRAKE CARRIER</text><text x="45" y="90" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536b79" font-weight="normal" text-anchor="start">Custom wheelset / disc / caliper carrier integration · arrangement and connection study · not to scale</text><path d="M35 110H1565" fill="none" stroke="#173547" stroke-width="2"/><text x="50" y="150" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#173547" font-weight="bold" text-anchor="start">PLAN — LOOKING DOWN ON ONE WHEELSET</text><rect x="160" y="428" width="1130" height="34" fill="#edcfb1" stroke="#b96c22" stroke-width="3"/><rect x="320" y="312" width="45" height="268" fill="#f4e0ca" stroke="#b96c22" stroke-width="3"/><rect x="1100" y="312" width="45" height="268" fill="#f4e0ca" stroke="#b96c22" stroke-width="3"/><rect x="190" y="382" width="78" height="126" fill="#e0e9ee" stroke="#315f70" stroke-width="3"/><rect x="1240" y="382" width="78" height="126" fill="#e0e9ee" stroke="#315f70" stroke-width="3"/><rect x="711" y="330" width="19" height="230" fill="#edcfb1" stroke="#b96c22" stroke-width="3"/><path d="M226 390V275H1277V390" fill="none" stroke="#315f70" stroke-width="23"/><rect x="669" y="277" width="105" height="80" fill="#d4e3e9" stroke="#315f70" stroke-width="3"/><path d="M710 275V245L520 185" fill="none" stroke="#315f70" stroke-width="5" stroke-dasharray="10 6"/><circle cx="710" cy="245" r="10" fill="white" stroke="#315f70" stroke-width="3"/><circle cx="520" cy="185" r="10" fill="white" stroke="#315f70" stroke-width="3"/><rect x="430" y="168" width="195" height="25" fill="#d4e3e9" stroke="#315f70" stroke-width="3"/><text x="60" y="207" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#315f70" font-weight="bold" text-anchor="start">Sprung bogie frame</text><path d="M266 201H420" fill="none" stroke="#536b79" stroke-width="1.5"/><text x="795" y="190" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#93631f" font-weight="bold" text-anchor="start">Articulated torque-reaction link — concept only</text><text x="795" y="217" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93631f" font-weight="normal" text-anchor="start">Joint type, restraints and allowable travel HELD</text><path d="M795 225H730L680 236" fill="none" stroke="#536b79" stroke-width="1.5"/><text x="330" y="247" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#315f70" font-weight="bold" text-anchor="start">Carrier follows axlebox motion</text><text x="812" y="335" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#315f70" font-weight="bold" text-anchor="start">OEM caliper + floating bracket</text><path d="M805 342L775 330" fill="none" stroke="#536b79" stroke-width="1.5"/><text x="810" y="382" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93631f" font-weight="bold" text-anchor="start">Custom carrier interface</text><text x="810" y="406" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93631f" font-weight="normal" text-anchor="start">uses BF-01 hole locations</text><path d="M800 376L773 300" fill="none" stroke="#536b79" stroke-width="1.5"/><text x="460" y="492" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#b96c22" font-weight="bold" text-anchor="start">Axle — rotates</text><text x="750" y="533" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#b96c22" font-weight="bold" text-anchor="start">Fixed-to-axle rotor</text><path d="M747 525L730 510" fill="none" stroke="#536b79" stroke-width="1.5"/><text x="50" y="555" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#315f70" font-weight="bold" text-anchor="start">Nonrotating axlebox</text><path d="M205 536L229 507" fill="none" stroke="#536b79" stroke-width="1.5"/><text x="1100" y="614" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#b96c22" font-weight="bold" text-anchor="start">Flanged wheel</text><path d="M1130 591V580" fill="none" stroke="#536b79" stroke-width="1.5"/><path d="M365 610H1100" fill="none" stroke="#536b79" stroke-width="1.2" stroke-dasharray="12 6"/><text x="732" y="638" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93631f" font-weight="bold" text-anchor="middle">Wheel back-to-back B — derived from selected wheel / rail profile, NOT 36 in</text><path d="M40 665H1560" fill="none" stroke="#536b79" stroke-width="1.5"/><text x="50" y="703" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#173547" font-weight="bold" text-anchor="start">AXIAL SECTION THROUGH ROTOR / CALIPER</text><rect x="140" y="845" width="525" height="26" fill="#edcfb1" stroke="#b96c22" stroke-width="2"/><rect x="376" y="733" width="20" height="200" fill="#edcfb1" stroke="#b96c22" stroke-width="2"/><rect x="344" y="748" width="18" height="69" fill="#f0d7d6" stroke="#b6423c" stroke-width="2"/><rect x="410" y="748" width="18" height="69" fill="#f0d7d6" stroke="#b6423c" stroke-width="2"/><path d="M327 808V717H445V808" fill="none" stroke="#315f70" stroke-width="15"/><rect x="270" y="710" width="46" height="113" fill="#d4e3e9" stroke="#315f70" stroke-width="2"/><path d="M140 737H265" fill="none" stroke="#315f70" stroke-width="12" stroke-dasharray="10 6"/><path d="M376 971H396" fill="none" stroke="#b96c22" stroke-width="1.5"/><path d="M371 977L381 965" fill="none" stroke="#b96c22" stroke-width="1.5"/><path d="M376 933V964" fill="none" stroke="#b96c22" stroke-width="1"/><path d="M391 977L401 965" fill="none" stroke="#b96c22" stroke-width="1.5"/><path d="M396 933V964" fill="none" stroke="#b96c22" stroke-width="1"/><text x="386.0" y="959" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#b96c22" font-weight="bold" text-anchor="middle">t = 0.500 in [12.7 mm] OEM-compatible disc thickness</text><text x="66" y="901" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#93631f" font-weight="bold" text-anchor="start">Carrier plate and offset</text><text x="66" y="924" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#93631f" font-weight="normal" text-anchor="start">t_c / z_c — HELD</text><path d="M229 899L282 825" fill="none" stroke="#536b79" stroke-width="1.5"/><text x="475" y="749" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#315f70" font-weight="bold" text-anchor="start">OEM float remains free</text><text x="475" y="775" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#315f70" font-weight="normal" text-anchor="start">Do not clamp the sliding function.</text><path d="M469 781L440 789" fill="none" stroke="#536b79" stroke-width="1.5"/><rect x="765" y="696" width="772" height="287" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="1"/><text x="788" y="731" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#173547" font-weight="bold" text-anchor="start">CONNECTIONS TO ENGINEER BEFORE CUTTING</text><text x="788" y="769" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">1. Rotor → hub / axle: torque, fatigue, fit and retention.</text><text x="788" y="798" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">2. Caliper → carrier: BF-01 pattern; bolt group and plate bending.</text><text x="788" y="827" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">3. Carrier → axleboxes: fasteners, local stress and bearing clearance.</text><text x="788" y="856" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">4. Carrier → bogie reaction: link load and full primary-suspension motion.</text><text x="788" y="885" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">5. Chamber → lever: force reduction, stroke, angularity and wear reserve.</text><text x="788" y="914" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">6. Entire assembly: disc runout, float, radial overlap and service access.</text><text x="788" y="943" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93631f" font-weight="normal" text-anchor="start">The 36-inch track gauge is a rail datum; it does not specify wheel spacing.</text><path d="M35 1009H1565" fill="none" stroke="#173547" stroke-width="2"/><text x="45" y="1040" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#93631f" font-weight="bold" text-anchor="start">PF-TRAIN-S3L.1-I0  |  19 OCT 2026  |  PRELIMINARY INTERFACE STUDY — NOT RELEASED FOR FABRICATION</text><text x="1545" y="1040" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#173547" font-weight="bold" text-anchor="end">BF-02</text></svg>
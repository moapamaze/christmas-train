<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-label="CALIPER MOUNT — FREE-BODY LOAD STUDY"><rect width="1600" height="1080" fill="white"/><rect x="18" y="18" width="1564" height="1044" fill="white" stroke="#173547" stroke-width="2"/><text x="45" y="58" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#173547" font-weight="bold" text-anchor="start">BF-03  CALIPER MOUNT — FREE-BODY LOAD STUDY</text><text x="45" y="90" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536b79" font-weight="normal" text-anchor="start">BF-01 centered-layout assumption · isolated caliper reactions · analytical case, not a brake or bolt rating</text><path d="M35 110H1565" fill="none" stroke="#173547" stroke-width="2"/><defs><marker id="force-tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b6423c"/></marker><marker id="reaction-tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315f70"/></marker></defs><text x="50" y="150" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#173547" font-weight="bold" text-anchor="start">REACTIONS ON ISOLATED CALIPER</text><text x="50" y="177" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b79" font-weight="normal" text-anchor="start">Arrows show direction only. Diagram is not a force-scale plot.</text><path d="M140 800A270 270 0 0 1 680 800" fill="none" stroke="#b96c22" stroke-width="2"/><path d="M108.5 800H711.5M410 285V900" fill="none" stroke="#536b79" stroke-width="1.1" stroke-dasharray="12 6 3 6"/><rect x="252.5" y="457.1" width="315" height="131.4" fill="#eef3f6" stroke="#315f70" stroke-width="1.5" stroke-dasharray="8 5"/><circle cx="303.125" cy="477.35" r="8.685" fill="white" stroke="#315f70" stroke-width="2"/><circle cx="516.875" cy="477.35" r="8.685" fill="white" stroke="#315f70" stroke-width="2"/><path d="M303.125 380H516.875" fill="none" stroke="#315f70" stroke-width="1.5"/><path d="M298.125 386L308.125 374" fill="none" stroke="#315f70" stroke-width="1.5"/><path d="M303.125 477.35V373" fill="none" stroke="#315f70" stroke-width="1"/><path d="M511.875 386L521.875 374" fill="none" stroke="#315f70" stroke-width="1.5"/><path d="M516.875 477.35V373" fill="none" stroke="#315f70" stroke-width="1"/><text x="410.0" y="368" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#315f70" font-weight="bold" text-anchor="middle">4.750 in / 120.65 mm</text><circle cx="230" cy="575" r="5" fill="#b6423c" stroke="#b6423c" stroke-width="1"/><circle cx="410" cy="571.4" r="5" fill="#b6423c" stroke="#b6423c" stroke-width="1"/><path d="M230 575H410" fill="none" stroke="#536b79" stroke-width="1.3" stroke-dasharray="8 5"/><path d="M230 575L230 477" fill="none" stroke="#b6423c" stroke-width="4"/><polygon points="230,477 223.0,492.0 237.0,492.0" fill="#b6423c"/><path d="M410 571.4L315 571.4" fill="none" stroke="#b6423c" stroke-width="4"/><polygon points="315,571.4 330.0,578.4 330.0,564.4" fill="#b6423c"/><path d="M303.125 477.35L360.125 548.35" fill="none" stroke="#315f70" stroke-width="4"/><polygon points="360.125,548.35 356.1930701460533,532.2708231671008 345.2759241269947,541.0352925063451" fill="#315f70"/><path d="M516.875 477.35L573.875 421.35" fill="none" stroke="#315f70" stroke-width="4"/><polygon points="573.875,421.35 558.2692012263346,426.8689713385617 568.0807058282221,436.85568137976855" fill="#315f70"/><text x="55" y="243" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#315f70" font-weight="bold" text-anchor="start">R1 on caliper</text><text x="55" y="271" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#315f70" font-weight="normal" text-anchor="start">(+2.820, −3.497) kN</text><path d="M210 280L323.125 505.35" fill="none" stroke="#315f70" stroke-width="1.3"/><text x="505" y="243" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#315f70" font-weight="bold" text-anchor="start">R2 on caliper</text><text x="505" y="271" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#315f70" font-weight="normal" text-anchor="start">(+2.820, +2.740) kN</text><path d="M618 280L550.875 442.35" fill="none" stroke="#315f70" stroke-width="1.3"/><text x="55" y="647" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#b6423c" font-weight="bold" text-anchor="start">Lever input: +0.757 kN upward</text><text x="55" y="675" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93631f" font-weight="normal" text-anchor="start">Assumed point (−4.00, +5.00) in</text><path d="M250 626L230 583" fill="none" stroke="#b6423c" stroke-width="1.3"/><text x="452" y="612" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#b6423c" font-weight="bold" text-anchor="start">Disc friction load:</text><text x="452" y="640" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#b6423c" font-weight="bold" text-anchor="start">−5.639 kN to left</text><text x="452" y="668" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#b6423c" font-weight="normal" text-anchor="start">Point (0, +5.08) in</text><path d="M452 600L410 579.4" fill="none" stroke="#b6423c" stroke-width="1.3"/><text x="435" y="836" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#b96c22" font-weight="bold" text-anchor="start">O — axle / disc axis</text><text x="55" y="920" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#315f70" font-weight="bold" text-anchor="start">Forces ON THE CARRIER are opposite R1 and R2.</text><text x="55" y="949" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#93631f" font-weight="normal" text-anchor="start">The carrier must also account for out-of-plane offsets and its own supports.</text><rect x="850" y="139" width="687" height="398" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="1"/><text x="875" y="176" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#173547" font-weight="bold" text-anchor="start">EXAMPLE DESIGN-DEMAND CASE</text><text x="875" y="215" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">13,200 kg coach; 4 braked axles assumed.</text><text x="875" y="254" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">a = 0.7 m/s²; wheel radius = 0.30 m (probe).</text><text x="875" y="293" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">5% rotational-inertia allowance (assumed).</text><text x="875" y="332" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">Axle brake torque = 727.65 N·m.</text><text x="875" y="371" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">Lever force = 0.757 kN from OEM equation.</text><text x="875" y="410" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">Applied moment at hole midpoint = -376.27 N·m.</text><text x="875" y="449" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">Peak load transferred at one hole = 4.492 kN.</text><text x="875" y="509" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#536b79" font-weight="normal" text-anchor="start">The chosen force directions maximize the moment in this case.</text><rect x="850" y="567" width="687" height="413" fill="#fff6e3" stroke="#d4b16e" stroke-width="1"/><text x="875" y="605" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#93631f" font-weight="bold" text-anchor="start">THIS DOES NOT SIZE THE BRACKET</text><text x="875" y="644" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93631f" font-weight="normal" text-anchor="start">Catalog 660 lbf input sensitivity gives 17.423 kN</text><text x="875" y="677" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93631f" font-weight="normal" text-anchor="start">at one hole in this in-plane model — much more than</text><text x="875" y="710" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93631f" font-weight="normal" text-anchor="start">the example demand. 660 lbf is the cast-iron catalog</text><text x="875" y="743" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93631f" font-weight="normal" text-anchor="start">value; 580 lbf covers aluminum. Confirm exact cast-iron</text><text x="875" y="776" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93631f" font-weight="normal" text-anchor="start">instructions and the assumed 4-inch input location.</text><text x="875" y="809" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93631f" font-weight="normal" text-anchor="start"></text><text x="875" y="842" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93631f" font-weight="normal" text-anchor="start">No out-of-plane offset, prying, preload, local bearing,</text><text x="875" y="875" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93631f" font-weight="normal" text-anchor="start">fatigue, heat, corrosion or jam qualification is included.</text><text x="875" y="908" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93631f" font-weight="normal" text-anchor="start">Carrier plate, fasteners and joints remain unselected.</text><path d="M35 1009H1565" fill="none" stroke="#173547" stroke-width="2"/><text x="45" y="1040" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#93631f" font-weight="bold" text-anchor="start">PF-TRAIN-S3L.1-I0  |  19 OCT 2026  |  PRELIMINARY INTERFACE STUDY — NOT RELEASED FOR FABRICATION</text><text x="1545" y="1040" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#173547" font-weight="bold" text-anchor="end">BF-03</text></svg>
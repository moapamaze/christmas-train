<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-label="REAL CALIPER MOUNTING INTERFACE"><rect width="1600" height="1080" fill="white"/><rect x="18" y="18" width="1564" height="1044" fill="white" stroke="#173547" stroke-width="2"/><text x="45" y="58" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#173547" font-weight="bold" text-anchor="start">BF-01  REAL CALIPER MOUNTING INTERFACE</text><text x="45" y="90" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536b79" font-weight="normal" text-anchor="start">Tolomatic ME220MEFI · assembly 0745-0024 · cast iron · floating bracket / fixed disc · dimensions in inches [mm]</text><path d="M35 110H1565" fill="none" stroke="#173547" stroke-width="2"/><text x="55" y="150" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#173547" font-weight="bold" text-anchor="start">VIEW NORMAL TO DISC</text><text x="55" y="176" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b79" font-weight="normal" text-anchor="start">OEM pitch / vertical offsets; centered alignment is assumed.</text><circle cx="430" cy="645" r="270" fill="#fcf3e9" stroke="#b96c22" stroke-width="3"/><circle cx="430" cy="645" r="47.25" fill="#f1dac0" stroke="#b96c22" stroke-width="2"/><path d="M95 645H765M430 205V955" fill="none" stroke="#536b79" stroke-width="1.2" stroke-dasharray="12 6 3 6"/><rect x="272.5" y="302.1" width="315" height="131.4" fill="#e6eef2" stroke="#315f70" stroke-width="2" stroke-dasharray="8 5"/><path d="M259.0 322.35H601.0" fill="none" stroke="#536b79" stroke-width="1.2" stroke-dasharray="12 6 3 6"/><circle cx="323.125" cy="322.35" r="8.685" fill="white" stroke="#315f70" stroke-width="2"/><circle cx="536.875" cy="322.35" r="8.685" fill="white" stroke="#315f70" stroke-width="2"/><path d="M310.125 322.35H336.125M323.125 309.35V335.35" fill="none" stroke="#315f70" stroke-width="1"/><path d="M523.875 322.35H549.875M536.875 309.35V335.35" fill="none" stroke="#315f70" stroke-width="1"/><circle cx="430" cy="420" r="14.4" fill="white" stroke="#315f70" stroke-width="2"/><path d="M375 420H485" fill="none" stroke="#536b79" stroke-width="1" stroke-dasharray="10 5"/><text x="465" y="427" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#315f70" font-weight="bold" text-anchor="start">L — lever/cam axis</text><text x="460" y="675" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#b96c22" font-weight="bold" text-anchor="start">O — axle / disc axis</text><path d="M323.125 237H536.875" fill="none" stroke="#315f70" stroke-width="1.5"/><path d="M318.125 243L328.125 231" fill="none" stroke="#315f70" stroke-width="1.5"/><path d="M323.125 322.35V230" fill="none" stroke="#315f70" stroke-width="1"/><path d="M531.875 243L541.875 231" fill="none" stroke="#315f70" stroke-width="1.5"/><path d="M536.875 322.35V230" fill="none" stroke="#315f70" stroke-width="1"/><text x="430.0" y="225" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#315f70" font-weight="bold" text-anchor="middle">4.750 [120.65] OEM hole pitch</text><path d="M205 420V322.35" fill="none" stroke="#315f70" stroke-width="1.5"/><path d="M199 425L211 415" fill="none" stroke="#315f70" stroke-width="1.5"/><path d="M323.125 420H212" fill="none" stroke="#315f70" stroke-width="1"/><path d="M199 327.35L211 317.35" fill="none" stroke="#315f70" stroke-width="1.5"/><path d="M323.125 322.35H212" fill="none" stroke="#315f70" stroke-width="1"/><text x="191" y="371.175" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#315f70" font-weight="bold" text-anchor="end">2.17 [55.1]</text><path d="M125 645V420" fill="none" stroke="#b96c22" stroke-width="1.5"/><path d="M119 650L131 640" fill="none" stroke="#b96c22" stroke-width="1.5"/><path d="M430 645H132" fill="none" stroke="#b96c22" stroke-width="1"/><path d="M119 425L131 415" fill="none" stroke="#b96c22" stroke-width="1.5"/><path d="M430 420H132" fill="none" stroke="#b96c22" stroke-width="1"/><text x="111" y="532.5" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#b96c22" font-weight="bold" text-anchor="end"></text><text x="81" y="526" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#b96c22" font-weight="bold" text-anchor="middle">D = 5.00</text><text x="81" y="551" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#b96c22" font-weight="bold" text-anchor="middle">[127.0]</text><path d="M544.875 322.35L715 300H790" fill="none" stroke="#315f70" stroke-width="1.5"/><text x="675" y="276" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#315f70" font-weight="bold" text-anchor="start">2 × Ø0.386 [9.80]</text><text x="697" y="323" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#315f70" font-weight="normal" text-anchor="start">OEM bracket holes</text><path d="M587.5 302.1L718 366H795" fill="none" stroke="#536b79" stroke-width="1.5"/><text x="680" y="392" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b79" font-weight="normal" text-anchor="start">OEM bracket</text><text x="680" y="416" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#536b79" font-weight="normal" text-anchor="start">envelope ONLY</text><text x="680" y="440" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#315f70" font-weight="bold" text-anchor="start">7.00 × 2.92</text><path d="M160 949H700" fill="none" stroke="#b96c22" stroke-width="1.5"/><path d="M155 955L165 943" fill="none" stroke="#b96c22" stroke-width="1.5"/><path d="M160 645V942" fill="none" stroke="#b96c22" stroke-width="1"/><path d="M695 955L705 943" fill="none" stroke="#b96c22" stroke-width="1.5"/><path d="M700 645V942" fill="none" stroke="#b96c22" stroke-width="1"/><text x="430.0" y="937" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#b96c22" font-weight="bold" text-anchor="middle">Ø12.00 [304.8] ROTOR FIT STUDY ONLY</text><text x="55" y="985" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#93631f" font-weight="bold" text-anchor="start">No custom carrier perimeter, bolt size, plate thickness, or manufacturing tolerance is released.</text><rect x="850" y="138" width="687" height="356" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="1"/><text x="875" y="173" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#173547" font-weight="bold" text-anchor="start">COORDINATES FOR CAD / MACHINIST REVIEW</text><text x="875" y="211" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#315f70" font-weight="bold" text-anchor="start">True pair datum</text><text x="1045" y="211" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">H1 = (0, 0); H2 = (4.750, 0)</text><text x="875" y="254" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#315f70" font-weight="bold" text-anchor="start">Lever Y</text><text x="1045" y="254" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">2.170 below hole line — OEM</text><text x="875" y="297" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#315f70" font-weight="bold" text-anchor="start">Axle Y</text><text x="1045" y="297" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">7.170 below hole line — derived</text><text x="875" y="340" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#315f70" font-weight="bold" text-anchor="start">Study X</text><text x="1045" y="340" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">±2.375 about axle — ASSUMED</text><text x="875" y="383" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#315f70" font-weight="bold" text-anchor="start">Hole diameter</text><text x="1045" y="383" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">0.386 — hole in OEM bracket</text><text x="875" y="426" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#315f70" font-weight="bold" text-anchor="start">Derivation</text><text x="1045" y="426" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">7.170 = D 5.000 + OEM 2.170</text><text x="875" y="475" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#536b79" font-weight="normal" text-anchor="start">DXF origin = H1. Controlled OEM CAD must confirm centering.</text><text x="875" y="538" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#173547" font-weight="bold" text-anchor="start">PART-SPECIFIC ENVELOPE</text><text x="875" y="575" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">ME220MEFI / 0745-0024: cast-iron, floating-bracket type.</text><text x="875" y="606" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">Disc thickness = 0.500 in [12.7 mm].</text><text x="875" y="637" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">OEM axial dimensions: A = 0.844, B = 3.80, C = 5.98 in.</text><text x="875" y="668" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">Use the OEM sheet for the A/B/C datum definitions.</text><text x="875" y="699" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#173547" font-weight="normal" text-anchor="start">For the 12-inch rotor row: effective braking radius = 5.08 in.</text><rect x="850" y="760" width="687" height="218" fill="#fff6e3" stroke="#d4b16e" stroke-width="1"/><text x="875" y="795" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#93631f" font-weight="bold" text-anchor="start">WHAT THIS DRAWING ALLOWS</text><text x="875" y="831" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93631f" font-weight="normal" text-anchor="start">A fabricator can locate the real OEM mounting holes and</text><text x="875" y="859" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93631f" font-weight="normal" text-anchor="start">reserve the bracket interface. Full caliper / lever travel</text><text x="875" y="887" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93631f" font-weight="normal" text-anchor="start">clearance is still required. Rotor thermal, fatigue and</text><text x="875" y="915" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93631f" font-weight="normal" text-anchor="start">rail-service qualification remain open. Verify OEM revision</text><text x="875" y="943" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#93631f" font-weight="normal" text-anchor="start">and physical part before drilling any production bracket.</text><path d="M35 1009H1565" fill="none" stroke="#173547" stroke-width="2"/><text x="45" y="1040" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#93631f" font-weight="bold" text-anchor="start">PF-TRAIN-S3L.1-I0  |  19 OCT 2026  |  PRELIMINARY INTERFACE STUDY — NOT RELEASED FOR FABRICATION</text><text x="1545" y="1040" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#173547" font-weight="bold" text-anchor="end">BF-01</text></svg>
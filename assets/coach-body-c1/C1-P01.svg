nt-size="18" font-weight="normal" fill="#203a36">0.5625</text><text x="570" y="374" font-size="18" font-weight="normal" fill="#203a36">5</text><text x="680" y="374" font-size="18" font-weight="normal" fill="#203a36">3.750</text><text x="810" y="374" font-size="18" font-weight="normal" fill="#203a36">1.500</text><text x="950" y="374" font-size="18" font-weight="normal" fill="#203a36">0.5625</text><text x="570" y="410" font-size="18" font-weight="normal" fill="#203a36">6</text><text x="680" y="410" font-size="18" font-weight="normal" fill="#203a36">3.750</text><text x="810" y="410" font-size="18" font-weight="normal" fill="#203a36">3.500</text><text x="950" y="410" font-size="18" font-weight="normal" fill="#203a36">0.5625</text><text x="570" y="500" font-size="18" font-weight="bold" fill="#203a36">Material: ASTM A36 plate, nominal 3/8 thick</text><text x="570" y="535" font-size="17" font-weight="normal" fill="#203a36">Quantity: 18 interior webs; mirrored installation does not change hole pattern.</text><text x="570" y="580" font-size="18" font-weight="bold" fill="#203a36">Proposed shop targets (designer choices, not OEM tolerances):</text><text x="570" y="620" font-size="16" font-weight="normal" fill="#203a36">Profile ±1/32; hole centres ±1/64 to common lower-left datum; deburr all edges.</text><text x="570" y="660" font-size="16" font-weight="normal" fill="#203a36">Bore sleeve holes together through both measured HSS walls in a rigid drill jig.</text><text x="570" y="700" font-size="16" font-weight="normal" fill="#203a36">Do not use profile tolerance as a bolt or sleeve fit. Sleeve bore/OD manufacturing fits need process trials.</text><text x="570" y="740" font-size="16" font-weight="normal" fill="#203a36">Trial assembly before coating. Record sleeve end flushness, web/shim bearing and hole alignment.</text><text x="570" y="780" font-size="16" font-weight="normal" fill="#203a36">Rib location: centres X±2.125 from post axis. Ribs project 2.000 inside from web inner face.</text><text x="570" y="820" font-size="16" font-weight="normal" fill="#203a36">Proposed 3/16 E70 web/rib fillets require procedure, effective length and distortion review.</text><text x="570" y="860" font-size="16" font-weight="normal" fill="#203a36">Do not weld this bracket to an occupied or finished coach; manufacturing sequence still to be released.</text><text x="45" y="1040" font-size="15" font-weight="normal" fill="#203a36">Canonical hole table: J01-web-cutting.json. STEP contains actual holes and hollow sleeves. Cutting geometry is a proposal for review.</text><text x="45" y="1064" font-size="15" font-weight="normal" fill="#203a36">A builder can identify and quote these blanks; this does not release the assembled passenger vehicle or its connections.</text><text x="45" y="1088" font-size="15" font-weight="normal" fill="#203a36">Verify actual bolt standards, plate/tube properties, local wall effects, clamp mechanism and reversing/fatigue cases before production.</text><text x="45" y="1112" font-size="15" font-weight="normal" fill="#203a36">Precision sleeves and coordinated drilling are subcontract tasks unless the farm’s tooling and inspection capability are demonstrated.</text><path d="M40,1150L1760,1150" fill="none" stroke="#2e504a" stroke-width="1"/><text x="45" y="1177" font-size="15" font-weight="normal" fill="#203a36">C1-P01 · Canonical source: build_c1.py / parameters.json / parts.json · Dimensions govern; do not scale.</text></g></svg>
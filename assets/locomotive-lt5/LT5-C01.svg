<text x="45" y="135" font-size="12" font-weight="bold" text-anchor="start">PLAN / FORWARD IS LEFT; ACTIVE DRIVER Y−</text><text x="755" y="180" font-size="13" font-weight="normal" text-anchor="start">Seat centres X8125 /Y±1050</text><text x="755" y="228" font-size="13" font-weight="normal" text-anchor="start">Study eye point Z3000</text><text x="755" y="276" font-size="13" font-weight="normal" text-anchor="start">Cushion boundary top2280</text><text x="755" y="324" font-size="13" font-weight="normal" text-anchor="start">Console worktop2460</text><text x="755" y="372" font-size="13" font-weight="normal" text-anchor="start">Instrument face X7800</text><text x="755" y="420" font-size="13" font-weight="normal" text-anchor="start">One traction command station</text><text x="755" y="468" font-size="13" font-weight="normal" text-anchor="start">Brake controller: owner interface</text><text x="755" y="516" font-size="13" font-weight="normal" text-anchor="start">Second seat: conductor only</text><text x="42" y="700" font-size="13" font-weight="normal" text-anchor="start">Brakes and traction logic remain with their respective owner. Cabin mock-up must verify reach, sightlines and emergency egress.</text><text x="42" y="721" font-size="13" font-weight="normal" text-anchor="start">PV380-R3 is an engine display candidate; separate hardwired emergency controls and inhibit interfaces need system design.</text><path class="rule" d="M20.00,761.00 L1180.00,761.00"/><text x="42" y="786" font-size="13" font-weight="normal" text-anchor="start">LT5 R0 · 2026-10-20  |  mm · NTS  |  NOMINAL GEOMETRY</text><text x="1158" y="786" font-size="13" font-weight="bold" text-anchor="end">NOT FOR FABRICATION</text></svg>
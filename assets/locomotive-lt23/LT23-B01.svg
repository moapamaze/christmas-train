  <g id="text_24">
   <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b95035" x="45.36" y="628.56" transform="rotate(-0 45.36 628.56)">LT23 · 21 OCT 2026 · STRUCTURAL REVIEW CANDIDATE · NOT FOR FABRICATION</text>
  </g>
  <g id="text_25">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203e49" x="60.48" y="550.8" transform="rotate(-0 60.48 550.8)">Brake loss means stop and remove the train from service. These distances are conditional calculations, not route clearance limits.</text>
  </g>
  <g id="text_26">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203e49" x="60.48" y="583.2" transform="rotate(-0 60.48 583.2)">Hydrostatic retardation receives no safety-brake credit. Coach capacity, wheel-slide behavior, delay, fade and parking duty are unverified.</text>

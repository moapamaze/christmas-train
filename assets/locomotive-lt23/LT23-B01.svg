  <g id="text_23">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203e49" x="45.36" y="58.32" transform="rotate(-0 45.36 58.32)">Functional proposal only · no selected valve circuit or demonstrated brake capacity</text>

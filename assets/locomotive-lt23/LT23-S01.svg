   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="390.012632" y="195.388997" transform="rotate(-0 390.012632 195.388997)">20 catch gap</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="446.763789" y="133.356701" transform="rotate(-0 446.763789 133.356701)">Rod top Z1102</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="446.763789" y="148.726806" transform="rotate(-0 446.763789 148.726806)">Cross-hole Z1089</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="446.763789" y="183.013964" transform="rotate(-0 446.763789 183.013964)">Washer underside Z1060</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="446.763789" y="206.66028" transform="rotate(-0 446.763789 206.66028)">Guide-flange top Z1040</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="446.763789" y="401.742385" transform="rotate(-0 446.763789 401.742385)">Eye centre Z875</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203e49" x="45.36" y="32.4" transform="rotate(-0 45.36 32.4)">LT23-S01 / Revised rebound capture</text>
  </g>
  <g id="text_8">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203e49" x="45.36" y="58.32" transform="rotate(-0 45.36 58.32)">Nominal millimetres · 20 mm droop catch · positive retention retained · 25 / 30 mm compression bumper / steel stop</text>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b95035" x="45.36" y="628.56" transform="rotate(-0 45.36 628.56)">LT23 · 21 OCT 2026 · STRUCTURAL REVIEW CANDIDATE · NOT FOR FABRICATION</text>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203e49" x="624.96" y="155.52" transform="rotate(-0 624.96 155.52)">CHANGE FROM LT22</text>
  </g>
  <g id="text_11">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203e49" transform="translate(624.96 202.758281)">Move washer, castle nut and cotter down 5 mm.</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203e49" transform="translate(624.96 220.090844)">Shorten shank 5 mm; eye remains fixed.</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203e49" transform="translate(624.96 237.423406)">Nominal M24×3 threaded region 1068–1102.</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203e49" transform="translate(624.96 254.755969)">Shim for cotter alignment; do not back off nut.</text>
  </g>
  <g id="text_12">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203e49" x="624.96" y="324" transform="rotate(-0 624.96 324)">WHY IT CHANGED</text>
  </g>
  <g id="text_13">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203e49" transform="translate(624.96 371.238281)">Earlier rebound contact keeps the primary coil</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203e49" transform="translate(624.96 388.570844)">compressed in the sampled stronger-pull cases.</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203e49" transform="translate(624.96 405.903406)">The rod and guide now carry the computed</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203e49" transform="translate(624.96 423.235969)">quasi-static contact reaction.</text>
  </g>
  <g id="text_14">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203e49" x="60.48" y="505.44" transform="rotate(-0 60.48 505.44)">The guide bracket retains 4×M16 attachments, 30 mm row spacing and 24 mm nominal thread engagement; 4×M8 retain the cartridge.</text>
  </g>
  <g id="text_15">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203e49" x="60.48" y="544.32" transform="rotate(-0 60.48 544.32)">Pin heads, castle nuts/cotters and drilled-head guide bolts remain positive-retention proposals. Exact grades, fits and torque are held.</text>
  </g>
  <g id="text_16">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203e49" x="60.48" y="583.2" transform="rotate(-0 60.48 583.2)">Section is schematic: thread form, eye fillet, split-pin forming, flange bending, prying, rod impact and fatigue require engineering release.</text>
  </g>
 </g>

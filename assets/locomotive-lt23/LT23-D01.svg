  <g id="text_23">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203e49" x="45.36" y="32.4" transform="rotate(-0 45.36 32.4)">LT23-D01 / Drive matched to duty</text>
  </g>
  <g id="text_24">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203e49" x="45.36" y="58.32" transform="rotate(-0 45.36 58.32)">Two 560 cc motors · 4:1 overall reduction proposal · 3.5 mph provisional duty · Ø1450 drivers</text>
  </g>
  <g id="text_25">
   <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b95035" x="45.36" y="628.56" transform="rotate(-0 45.36 628.56)">LT23 · 21 OCT 2026 · STRUCTURAL REVIEW CANDIDATE · NOT FOR FABRICATION</text>
  </g>
  <g id="text_26">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203e49" x="60.48" y="460.08" transform="rotate(-0 60.48 460.08)">At 3.5 mph: 97.2 L/min, 82.4 motor rpm and 17.3 kN after the 40 kW shaft cap.</text>
  </g>
  <g id="text_27">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203e49" x="60.48" y="492.48" transform="rotate(-0 60.48 492.48)">350 bar is a trial comparison, not a relief setting. High starting pull is available only at low speed.</text>
  </g>
  <g id="text_28">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203e49" x="60.48" y="531.36" transform="rotate(-0 60.48 531.36)">12/48-tooth, 31.75 mm-pitch packaging study: pitch diameters 122.7 / 485.5 mm. Retained guards are reservations.</text>
  </g>
  <g id="text_29">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203e49" x="60.48" y="563.76" transform="rotate(-0 60.48 563.76)">Chain product/strands, shaft bores, supported jackshaft, torque control, charge flow and tension compensation remain open.</text>
  </g>
  <g id="text_30">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1440" role="img" aria-labelledby="title"><title id="title">LT16 S01 powered axle suspension — dimensioned development sections</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M7 3.5L0 0L0 7Z" fill="#344e5b"/></marker></defs><style>text{font:20px Arial;fill:#203c48}.title{font-size:31px;font-weight:bold}.sub{font-size:24px;font-weight:bold}.small{font-size:17px}.fixed{fill:#c1d1d8;stroke:#466775;stroke-width:1.5}.moving{fill:#d8dedb;stroke:#466775;stroke-width:1.5}.rubber{fill:#69a89b;stroke:#285b51;stroke-width:1.5}.pad{fill:#d1a761;stroke:#886633}.line{fill:none;stroke:#466775;stroke-width:1.5}.hidden{fill:none;stroke:#71878e;stroke-dasharray:6 5}.dim{fill:none;stroke:#344e5b;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}</style><rect width="1600" height="1440" fill="white"/><text x="40" y="48" class="title">LT16–S01 | One powered axle: spring support, centering and retention</text><text x="40" y="83" class="">Nominal dimensions in mm • prototype on front powered axle only • development drawing, not for fabrication</text><text x="40" y="135" class="sub">A — Longitudinal section through one axlebox</text><text x="40" y="164" class="small">X offsets from axle centre; rail and parts cut open for inspection.</text><rect x="90" y="190" width="700" height="304.8" class="fixed"/><rect x="90" y="199.525" width="700" height="285.75" class="hidden"/><text x="105" y="225" class="small">Rail 152.4 × 304.8 × 9.525</text><text x="105" y="253" class="small">Restored gross section; shifted inward</text><rect x="190" y="481.8" width="500" height="20" class="fixed"/><rect x="249" y="495" width="50" height="435" class="fixed"/><rect x="300" y="700" width="10" height="230" class="pad"/><rect x="314" y="347" width="16" height="302" class="moving"/><rect x="308" y="450" width="28" height="52" class="fixed"/><rect x="300" y="494" width="44" height="8" class="fixed"/><rect x="304" y="400" width="36" height="10" class="moving"/><rect x="302" y="552" width="40" height="8" class="moving"/><rect x="302" y="512" width="40" height="20" class="rubber"/><rect x="302" y="501.8" width="40" height="10.2" class="fixed"/><rect x="310" y="647" width="24" height="8" class="moving"/><rect x="334" y="609" width="26" height="50" class="rubber"/><rect x="302" y="601" width="58" height="8" class="moving"/><rect x="581" y="495" width="50" height="435" class="fixed"/><rect x="570" y="700" width="10" height="230" class="pad"/><rect x="550" y="347" width="16" height="302" class="moving"/><rect x="544" y="450" width="28" height="52" class="fixed"/><rect x="536" y="494" width="44" height="8" class="fixed"/><rect x="540" y="400" width="36" height="10" class="moving"/><rect x="538" y="552" width="40" height="8" class="moving"/><rect x="538" y="512" width="40" height="20" class="rubber"/><rect x="538" y="501.8" width="40" height="10.2" class="fixed"/><rect x="546" y="647" width="24" height="8" class="moving"/><rect x="520" y="609" width="26" height="50" class="rubber"/><rect x="520" y="601" width="58" height="8" class="moving"/><rect x="360" y="512" width="160" height="10.2" class="fixed"/><rect x="360" y="647" width="160" height="8" class="moving"/><rect x="390" y="655" width="100" height="4" class="pad"/><rect x="360" y="659" width="160" height="6" class="moving"/><rect x="310" y="690" width="260" height="250" class="moving"/><circle cx="440" cy="815" r="107.5" fill="white" stroke="#466775"/><path d="M295 815H585M440 680V950" class="hidden"/><rect x="412" y="661" width="12" height="29" class="moving"/><rect x="456" y="661" width="12" height="29" class="moving"/><rect x="426" y="660" width="28" height="30" class="pad"/><rect x="404" y="665" width="72" height="20" class="moving"/><rect x="398" y="662" width="6" height="26" class="moving"/><rect x="476" y="662" width="6" height="26" class="moving"/><text x="373" y="808" class="small">Ø215 bearing</text><text x="386" y="835" class="small">Axle Z725</text><polyline points="378,647 502,633.5 378,620.0 502,606.5 378,593.0 502,579.5 378,566.0 502,552.5 378,539.0 502,525.5 378,512.0" fill="none" stroke="#ad8a44" stroke-width="7"/><path d="M600 512L600 647" class="dim"/><text x="612" y="582" class="small">135 loaded</text><path d="M730 481.8L730 501.8" class="dim"/><text x="742" y="497" class="small">20 header</text><path d="M310 970L570 970" class="dim"/><text x="375" y="997" class="small">260 axlebox</text><text x="60" y="1050" class="small">Primary spring trial: Ø142 outside, Ø18 wire, 3 active coils.</text><text x="60" y="1078" class="small">Saddle deck Z875…881 → pad 4 → guided seat 8 → spring Z893.</text><text x="60" y="1106" class="small">Spring top Z1028; header underside Z1038.2.</text><text x="60" y="1134" class="small">Rocker pin Ø20 ×72; cheek centres 44 apart; keeper access slots.</text><text x="60" y="1162" class="small">Raised yoke ties connect the rod pads outside this section.</text><path d="M840 110L840 1200" class="hidden"/><text x="885" y="135" class="sub">B — Centering layout, plan at Z906</text><text x="885" y="164" class="small">One axlebox; coil drawn as occupancy outline.</text><circle cx="1190" cy="370" r="106.5" fill="none" stroke="#ad8a44" stroke-width="3"/><rect x="1031.0" y="295" width="39" height="150" class="rubber"/><circle cx="1013" cy="370" r="12" fill="#7f969f"/><path d="M1050.5 338L1050.5 402" class="dim"/><rect x="1310.0" y="295" width="39" height="150" class="rubber"/><circle cx="1367" cy="370" r="12" fill="#7f969f"/><path d="M1329.5 338L1329.5 402" class="dim"/><text x="895" y="520" class="small">Four bonded shear springs per axle: 26 ×100 ×50 each.</text><text x="895" y="548" class="small">Lower face follows the rocker; upper face follows the guided seat.</text><text x="895" y="576" class="small">Trial total centering rate: 312 N/mm; rubber compound unselected.</text><text x="895" y="604" class="small">Friction leaves a return band; exact return to zero is not guaranteed.</text><text x="885" y="670" class="sub">C — Local travel limits at each spring seat</text><rect x="1148" y="720" width="24" height="275" class="moving"/><rect x="1128" y="790" width="64" height="70" class="fixed"/><rect x="1124" y="735" width="72" height="14" class="moving"/><rect x="1118" y="880" width="84" height="20" class="fixed"/><rect x="1118" y="900" width="84" height="40" class="rubber"/><rect x="1118" y="980" width="84" height="16" class="moving"/><path d="M1230 749L1230 790" class="dim"/><text x="1250" y="775" class="small">40 rebound clearance</text><path d="M1230 940L1230 980" class="dim"/><text x="1250" y="964" class="small">20 before bumper contact</text><text x="890" y="1035" class="small">+20 local: bumper first contact. +30 local: reserved hard limit.</text><text x="890" y="1063" class="small">−40 local: rebound collar reaches frame bushing.</text><text x="890" y="1091" class="small">Viewer range: −25 / 0 / +15 mean axle travel with ±2° roll.</text><text x="890" y="1119" class="small">Old −40 / +50 mean-travel poses do not apply to this spring package.</text><text x="890" y="1147" class="small">Stop force/energy, collar locks and dynamic impact remain unqualified.</text><path d="M40 1210L1560 1210" class="line"/><text x="40" y="1250" class="sub">Load path: frame → upper seat → coil → guided seat → sliding pad → rocker pin → axlebox → bearing → axle.</text><text x="40" y="1290" class="">Traction / braking / motor reaction: axlebox wear faces → 50 mm guide plates → 20 mm headers → main rails.</text><text x="40" y="1325" class="">Retained separate checks: spring fatigue, friction, rubber bonds, axlebox wall, guide relief notch, weld fatigue and rail openings.</text><text x="40" y="1360" class="">50 m remains a target. Actual wheel/rail contact forces and acceptable operating speed cannot be established from geometry alone.</text><text x="40" y="1400" class="small">LT16 development dimensions • one prototype axle • supplier and structural approval required before manufacturing</text></svg>
6" font-size="20">193.899</text><text font-family="Arial,sans-serif" fill="#243d3c" x="845" y="336" font-size="20">243.899</text><text font-family="Arial,sans-serif" fill="#243d3c" x="1060" y="336" font-size="20">1081.899</text><text font-family="Arial,sans-serif" fill="#243d3c" x="1340" y="336" font-size="20">1101.899</text><text font-family="Arial,sans-serif" fill="#243d3c" x="65" y="376" font-size="20">4 / 8050</text><text font-family="Arial,sans-serif" fill="#243d3c" x="290" y="376" font-size="20">14518.2</text><text font-family="Arial,sans-serif" fill="#243d3c" x="475" y="376" font-size="20">223.368</text><text font-family="Arial,sans-serif" fill="#243d3c" x="660" y="376" font-size="20">193.368</text><text font-family="Arial,sans-serif" fill="#243d3c" x="845" y="376" font-size="20">243.368</text><text font-family="Arial,sans-serif" fill="#243d3c" x="1060" y="376" font-size="20">1081.368</text><text font-family="Arial,sans-serif" fill="#243d3c" x="1340" y="376" font-size="20">1101.368</text><text font-family="Arial,sans-serif" fill="#243d3c" x="65" y="445" font-size="20" font-weight="bold">Plan · right side · dimensions relative to spring centre (X0 / Y0); mirror for left side</text><rect x="180.49999999999997" y="562.0" width="459.00000000000006" height="216.0" fill="#b9cecb" stroke="#315954" stroke-width="2"/><rect x="166.99999999999997" y="737.5" width="621.0" height="21.6" fill="#b9cecb" stroke="#315954" stroke-width="2"/><rect x="302.0" y="759.1" width="486.00000000000006" height="72.9" fill="#b9cecb" stroke="#315954" stroke-width="2"/><circle cx="410" cy="670" r="94.2975" fill="#ead6a9" stroke="#a27532" stroke-width="2"/><circle cx="410" cy="670" r="61.614843750000006" fill="#f8f7f0" stroke="#a27532"/><circle cx="545.0" cy="791.5" r="31.05" fill="#f8f7f0" stroke="#315954"/><circle cx="207.5" cy="748.3" r="6" fill="#315954"/><circle cx="612.5" cy="748.3" r="6" fill="#315954"/><text font-family="Arial,sans-serif" fill="#243d3c" x="880" y="500" font-size="18">CAP / BRACKET SCHEDULE</text><text font-family="Arial,sans-serif" fill="#243d3c" x="880" y="530" font-size="18">Cap:340 ×160 ×20 at axle-specific Z</text><text font-family="Arial,sans-serif" fill="#243d3c" x="880" y="560" font-size="18">Rebound web:460 ×16 ×94, X−180..+280</text><text font-family="Arial,sans-serif" fill="#243d3c" x="880" y="590" font-size="18">Web Y+50..+66; Z1016..1110</text><text font-family="Arial,sans-serif" fill="#243d3c" x="880" y="620" font-size="18">Cartridge shelf:360 ×54 ×16, Z1016..1032</text><text font-family="Arial,sans-serif" fill="#243d3c" x="880" y="650" font-size="18">Bushing centre:X+100 / Y+90 (retained)</text><text font-family="Arial,sans-serif" fill="#243d3c" x="880" y="680" font-size="18">4 × M16 mounts:X±150; Z1060 and1090</text><text font-family="Arial,sans-serif" fill="#243d3c" x="880" y="710" font-size="18">Web clearance:Ø150 around spring below cap</text><text font-family="Arial,sans-serif" fill="#243d3c" x="880" y="740" font-size="18">Drill through assembled cap/web at mounts</text><text font-family="Arial,sans-serif" fill="#243d3c" x="880" y="770" font-size="18">Weld, thread engagement and fatigue: HOLD</text><text font-family="Arial,sans-serif" fill="#243d3c" x="65" y="880" font-size="18">Minimum main spring height at the nominal steel limit:193.368; solid-height margin26.680.</text><text font-family="Arial,sans-serif" fill="#243d3c" x="65" y="912" font-size="18">A cap replaces the old70mm pocket header. Gross section equivalence has NOT been demonstrated.</text><text font-family="Arial,sans-serif" fill="#243d3c" x="65" y="944" font-size="18">Revised attachment avoids the known old-bracket/cap overlap; full bolt-head, nut, rod and assembly sweep remains to be checked.</text><text font-family="Arial,sans-serif" fill="#243d3c" x="65" y="976" font-size="18">Pocket and hardware CAD is a dimensional review model, not a machining or welding release.</text></svg>
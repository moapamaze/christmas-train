<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><rect width="1600" height="1120" fill="#f8f7f0"/><style>text{font-family:Arial,sans-serif;fill:#243d3c}.dim{stroke:#387989;fill:none;stroke-width:1.4}.metal{fill:#b9cecb;stroke:#315954;stroke-width:2}.coil{fill:#ead6a9;stroke:#a27532;stroke-width:2}.ghost{fill:none;stroke:#869894;stroke-width:1.5;stroke-dasharray:7 5}</style><rect x="24" y="24" width="1552" height="1072" fill="none" stroke="#57716c"/><text font-family="Arial,sans-serif" fill="#243d3c" x="50" y="66" font-size="18">PULSIPHER FARMS · LT34 · COMMERCIAL SPRING STUDY</text><text font-family="Arial,sans-serif" fill="#243d3c" x="50" y="110" font-size="34" font-weight="bold">Main spring seat schedule and rebound attachment</text><text font-family="Arial,sans-serif" fill="#243d3c" x="50" y="145" font-size="18">The new cap and rebound bracket form one welded review assembly. Rod, bushing and capture travel positions stay at their prior datums.</text><line x1="50" y1="166" x2="1550" y2="166" stroke="#57716c"/><text font-family="Arial,sans-serif" fill="#243d3c" x="50" y="1060" font-size="18" font-weight="bold">LT34-S02 · REV A · 23 OCT 2026 · ALL DIMENSIONS mm · DO NOT SCALE</text><text font-family="Arial,sans-serif" fill="#243d3c" x="50" y="1085" font-size="17">DEVELOPMENT REVIEW ONLY — supplier tolerances, local structure, impact and full assembly clearance remain unreleased.</text><text font-family="Arial,sans-serif" fill="#243d3c" x="65" y="215" font-size="20" font-weight="bold">Axle / X</text><text font-family="Arial,sans-serif" fill="#243d3c" x="290" y="215" font-size="20" font-weight="bold">Preload N</text><text font-family="Arial,sans-serif" fill="#243d3c" x="475" y="215" font-size="20" font-weight="bold">Datum H</text><text font-family="Arial,sans-serif" fill="#243d3c" x="660" y="215" font-size="20" font-weight="bold">H at +30</text><text font-family="Arial,sans-serif" fill="#243d3c" x="845" y="215" font-size="20"
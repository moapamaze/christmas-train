ke ratings remain open.</text><polyline points="40.00,1260.00 1560.00,1260.00" fill="none" stroke="#173b4b" stroke-width="2" /><text x="45.00" y="1290.00" class="small">PULSIPHER FARMS | Tags match LT41 parts schedule | Pressures gauge | Do not scale for manufacture</text></svg>
00" y="440.00" class="small">This is a nominal packaging screen, not an OEM mounting check.</text><text x="805.00" y="465.00" class="small">Feet, drilling, cooling, service space and generator remain open.</text><text x="805.00" y="490.00" class="small">A03 air-treatment space is not the complete Dürr package.</text><text x="805.00" y="515.00" class="small">Discharge endpoint is a marked OEM-interface hold.</text><text x="50.00" y="655.00" class="bold">FIRST COACH · FOUR DEVELOPMENT STATIONS · NATIVE COACH X/Y mm</text><polyline points="162.74,975.40 162.74,694.60" fill="none" stroke="#8b9c95" stroke-width="2" /><polyline points="378.74,975.40 378.74,694.60" fill="none" stroke="#8b9c95" stroke-width="2" /><rect x="77.74000000000001" y="733.0" width="170" height="60" rx="4" fill="#f1f5f2" stroke="#23786a" stroke-width="2" /><text x="89.74" y="761.00" class="bold">AXLE 1 · NEW</text><rect x="293.74" y="877.0" width="170" height="60" rx="4" fill="#f1f5f2" stroke="#173b4b" stroke-width="2" /><text x="305.74" y="905.00" class="bold">AXLE 2 · RETAINED</text><polyline points="1150.29,975.40 1150.29,694.60" fill="none" stroke="#8b9c95" stroke-width="2" /><polyline points="1366.29,975.40 1366.29,694.60" fill="none" stroke="#8b9c95" stroke-width="2" /><rect x="1065.292" y="733.0" width="170" height="60" rx="4" fill="#f1f5f2" stroke="#23786a" stroke-width="2" /><text x="1077.29" y="761.00" class="bold">AXLE 1 · NEW</text><rect x="1281.292" y="877.0" width="170" height="60" rx="4" fill="#f1f5f2" stroke="#173b4b" stroke-width="2" /><text x="1293.29" y="905.00" class="bold">AXLE 2 · RETAINED</text><polyline points="369.25,862.00 371.95,862.00 371.95,829.60 371.95,829.60 470.00,829.60 470.00,829.60 957.80,829.60 957.80,862.00" fill="none" stroke="#b55329" stroke-width="2" /><polyline points="1356.80,862.00 1359.50,862.00 1359.50,829.60 1359.50,829.60 1276.40,829.60 1276.40,829.60 1276.40,880.00 1272.80,880.00 1272.80,880.00 1236.80,880.00 1236.80,880.00 1236.80,829.60 957.80,829.6
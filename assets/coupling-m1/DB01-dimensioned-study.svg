0" y1="756" x2="1040" y2="756" class="c"/><text x="75" y="810" font-size="18">The outer ring, axial retention, pins and clevises are separate design items and are not shown.</text><text x="1200" y="177" font-size="20">PART DEFINITION</text><text x="1200" y="213" font-size="18">Qty: 1 per study link</text><text x="1200" y="249" font-size="18">Candidate: A572 Grade 50</text><text x="1200" y="283" font-size="18">One piece; no bar welds.</text><text x="1200" y="325" font-size="18">Seat OD basis: SKF</text><text x="1200" y="355" font-size="18">GE 60 ES-2RS, D = 90</text><text x="1200" y="397" font-size="18">Inner bore d = 60 does</text><text x="1200" y="426" font-size="18">not select a coupling pin.</text><text x="1200" y="475" font-size="18">All final fits, tolerances,</text><text x="1200" y="504" font-size="18">retention and inspection</text><text x="1200" y="533" font-size="18">criteria remain open.</text><text x="1200" y="615" font-size="20">SECTION B–B AT EYE</text><rect x="1205" y="650" width="30" height="36" class="section"/><rect x="1325" y="650" width="30" height="36" class="section"/><line x1="1205" y1="686" x2="1205" y2="744" class="ext"/><line x1="1355" y1="686" x2="1355" y2="744" class="ext"/><line x1="1205" y1="735" x2="1355" y2="735" class="dim" marker-start="url(#a)" marker-end="url(#a)"/><text x="1265.0" y="725" font-size="20">150</text><line x1="1235" y1="686" x2="1235" y2="785" class="ext"/><line x1="1325" y1="686" x2="1325" y2="785" class="ext"/><line x1="1235" y1="776" x2="1325" y2="776" class="dim" marker-start="url(#a)" marker-end="url(#a)"/><text x="1240.0" y="766" font-size="20">Ø90 void</text><text x="1190" y="819" font-size="18">30 mm radial ligament</text><line x1="45" y1="856" x2="1555" y2="856" class="ext"/><text x="45" y="888" font-size="21">WHAT THIS SHEET DOES NOT ESTABLISH</text><text x="45" y="924" font-size="18">1. The 200 kN part-load probe is not a rated, proof or operating load. Train slack and impact are not bounded.</text><text x="45" y="956" font-size="18">2. Gross/net axial and ideal Euler calculations do not close local eye contact, fatigue, eccentricity or joint strength.</text><text x="45" y="988" font-size="18">3. The 800 mm spacing is a packaging probe. Final car gap, curve motion and draw-gear arrangement may change it.</text><text x="45" y="1020" font-size="18">4. Bearing-retention design can change this profile. Do not finish seats or make cutting/machining files from this issue.</text><text x="45" y="1052" font-size="18">5. Material heat, toughness, grain orientation, machining allowance, surface finish and NDT need responsible review.</text><text x="45" y="1084" font-size="18">6. No independent restraint, guards, hoses, cables or passenger protection are supplied by this one-piece part.</text><line x1="45" y1="1124" x2="1555" y2="1124" class="ext"/><text x="45" y="1155" font-size="18">Source: design_inputs.json + build_study.py · Exact nominal geometry shared by CAD, mesh and drawing · Release: NONE</text></svg>
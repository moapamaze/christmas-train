<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="none" stroke="#17364a"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#17364a}.t{font-size:26px;font-weight:bold}.n{font-size:19px}.s{font-size:16px}.dim{stroke:#17364a;stroke-width:1.5;marker-start:url(#arrow);marker-end:url(#arrow)}.line{stroke:#17364a;stroke-width:2;fill:none}.dash{stroke:#a97831;stroke-width:2;stroke-dasharray:8 5;fill:#f4e6c4;fill-opacity:.35}</style><rect width="1400" height="1000" fill="#fff"/><rect x="22" y="22" width="1356" height="956" fill="none" stroke="#81959e"/><text x="50" y="65" class="t">DT4-M01 · Motor-to-axle packaging</text><text x="50" y="98" class="n">Coaxial shaft motor; the motor carrier must follow the axle through suspension motion.</text><rect x="114.32" y="260.0" width="60.0" height="600.0" fill="#466777" stroke="#17364a" class=""/><rect x="200.0" y="524.0" width="144.0" height="72.0" fill="#9caeb6" stroke="#17364a" class=""/><rect x="224.0" y="503.0" width="108.0" height="114.0" fill="none" stroke="#17364a" class="dash"/><rect x="320.0" y="512.0" width="84.0" height="96.0" fill="none" stroke="#17364a" class="dash"/><rect x="380.0" y="470.0" width="184.79999999999998" height="180.0" fill="#c3dfdc" stroke="#17364a" class=""/><line x1="441.2" y1="464.0" x2="441.2" y2="656.0" class="line"/><text x="416.2" y="452.0" class="s">Mount plane</text><line x1="620.0" y1="236.0" x2="620.0" y2="710.0" class="dash"/><line x1="200.0" y1="560.0" x2="635.0" y2="560.0" class="line"/><text x="650" y="546.0" class="s">Axis Z 500</text><line x1="380.0" y1="790" x2="564.8" y2="790" class="dim"/><text x="389.0" y="818" class="s">308 max · no rear brake</text><line x1="564.8" y1="845" x2="620.0" y2="845" class="dim"/><text x="690" y="875" class="s">92 static gap only</text><text x="850" y="210" class="n">CATALOG / INHERITED DIMENSIONS</text><text x="850" y="250" class="s">Wheel Ø 1,000 (existing proposal)</text><text x="850" y="280" class="s">Axle end at Y 840 (existing proposal)</text><text x="850" y="310" class="s">Motor: 300 diameter bounding envelope</text><text x="850" y="340" class="s">Motor tip → mounting plane: 102*</text><text x="850" y="370" class="s">Mounting plane → rear: 206</text><text x="850" y="400" class="s">Pilot Ø 200 (catalog; fit not released)</text><text x="850" y="430" class="s">* Derived from 308 − 206; envelope only.</text><text x="850" y="525" class="s">DESIGN WORK STILL REQUIRED</text><text x="850" y="553" class="s">Axle bearings carry vehicle loads.</text><text x="850" y="581" class="s">Coupling reserve: Ø 160 × 140; not selected.</text><text x="850" y="609" class="s">Motor shaft tip placed at Y 900 for study.</text><text x="850" y="637" class="s">Carrier attachment and reaction load path</text><text x="850" y="665" class="s">must be designed with the actual axlebox.</text><text x="850" y="693" class="s">Do not bolt motor to the sprung frame</text><text x="850" y="721" class="s">with a rigid coupling to the moving axle.</text><text x="50" y="910" class="s">Envelope is a conservative proxy, not OEM CAD. Hose fittings, brake option and service clearance can enlarge it.</text><text x="50" y="947" class="s">DT4 R0 · 19 October 2026 · mm · Layout / envelope study; NOT fabrication geometry</text></svg>
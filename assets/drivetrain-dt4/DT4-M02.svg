<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="none" stroke="#17364a"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#17364a}.t{font-size:26px;font-weight:bold}.n{font-size:18px}.s{font-size:16px}.l{fill:none;stroke:#17364a;stroke-width:2}.d{fill:none;stroke:#a97831;stroke-width:2;stroke-dasharray:8 5}.dim{stroke:#17364a;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}</style><rect width="1400" height="1000" fill="white"/><rect x="22" y="22" width="1356" height="956" class="l"/><text x="50" y="65" class="t">DT4-M02 · Sourced motor interfaces</text><text x="50" y="98" class="n">Poclain MS05-8-113-A05-2A50-0000 · base configuration; sensor variant and application approval held</text><text x="70" y="150" class="n">MOUNT FACE · dimensional reference</text><circle cx="255" cy="350" r="150" class="l"/><circle cx="255" cy="350" r="132.5" class="d"/><circle cx="255" cy="350" r="100" class="l"/><circle cx="255" cy="350" r="27.5" class="d"/><line x1="75" y1="350" x2="435" y2="350" class="d"/><line x1="255" y1="170" x2="255" y2="530" class="d"/><line x1="105" y1="550" x2="405" y2="550" class="dim"/><text x="172" y="577" class="s">Ø300 outer bound</text><text x="455" y="215" class="s">Ø200 pilot: 0 / −0.072 mm</text><line x1="355" y1="325" x2="445" y2="222" class="l"/><text x="455" y="255" class="s">Ø265 bolt pitch circle</text><line x1="387" y1="350" x2="445" y2="260" class="l"/><text x="455" y="295" class="s">8 × Ø17.5 (+0.25 / −0.10)</text><text x="455" y="325" class="s">Four pairs; angles held for OEM CAD</text><text x="455" y="365" class="s">DIN 5480: nominal Ø55, m3, z17</text><text x="455" y="395" class="s">Circle is a shaft bound, not spline teeth</text><text x="455" y="445" class="s">Pilot projection: 23 mm</text><text x="455" y="475" class="s">Catalog mass: 41 kg, without brake</text><text x="70" y="620" class="n">AXIAL DATUM CHAIN · diagrammatic</text><rect x="900" y="230" width="308" height="300" fill="#deeeeb" stroke="#17364a"/><line x1="1002" y1="190" x2="1002" y2="575" class="l"/><line x1="900" y1="370" x2="1240" y2="370" class="d"/><text x="895" y="190" class="s">Shaft tip</text><text x="1008" y="215" class="s">Mount plane</text><text x="1140" y="565" class="s">Rear bound</text><line x1="900" y1="600" x2="1208" y2="600" class="dim"/><text x="945" y="630" class="s">308 maximum</text><line x1="1002" y1="660" x2="1208" y2="660" class="dim"/><text x="1030" y="690" class="s">206 mount → rear</text><text x="840" y="745" class="s">102 tip → mount = 308 − 206; derived only</text><text x="70" y="665" class="n">SUPPORT / TORQUE PATH — TO BE DESIGNED</text><text x="70" y="704" class="s">Motor flange → independently supported carrier → rated restraint → truck.</text><text x="70" y="734" class="s">Carrier must follow the axle; coupling transmits drive torque only.</text><text x="70" y="764" class="s">Axle bearings carry wheel loads. Motor shaft is not a carrier bearing.</text><text x="70" y="794" class="s">Guided carrier OR articulated reaction system: resolve kinematics first.</text><text x="70" y="824" class="s">Mount bolt grade, tightening, bracket sections and coupling are not selected.</text><text x="840" y="805" class="s">WORK PORTS: R / L, BSP 3/4</text><text x="840" y="835" class="s">CASE PORTS: 1 / 2, BSP 3/8</text><text x="840" y="865" class="s">Catalog case-pressure limit: 1 bar</text><text x="50" y="915" class="s">Use configured OEM CAD for hole angles, port locations and mating fits. Do not drill or machine from this sheet.</text><text x="50" y="950" class="s">DT4 R1 · 19 October 2026 · mm · Interface / procurement study; NOT fabrication geometry</text></svg>
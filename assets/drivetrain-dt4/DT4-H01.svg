<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="none" stroke="#17364a"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#17364a}.t{font-size:26px;font-weight:bold}.n{font-size:19px}.s{font-size:16px}.dim{stroke:#17364a;stroke-width:1.5;marker-start:url(#arrow);marker-end:url(#arrow)}.line{stroke:#17364a;stroke-width:2;fill:none}.dash{stroke:#a97831;stroke-width:2;stroke-dasharray:8 5;fill:#f4e6c4;fill-opacity:.35}</style><rect width="1400" height="1000" fill="#fff"/><rect x="22" y="22" width="1356" height="956" fill="none" stroke="#81959e"/><text x="50" y="65" class="t">DT4-H01 · Power and hydraulic connections</text><text x="50" y="98" class="n">Functional arrangement only; no valve settings, port sizes or hose assemblies are released.</text><rect x="60" y="145" width="300" height="85" fill="#e9efef" stroke="#17364a" class=""/><text x="75" y="177" class="n">Diesel engine</text><text x="75" y="204" class="s">Rated coupling / pump adapter required</text><rect x="470" y="145" width="350" height="85" fill="#e9efef" stroke="#17364a" class=""/><text x="485" y="177" class="n">Variable reversible pump</text><text x="485" y="204" class="s">Power limit + charge / relief protection</text><line x1="360" y1="187" x2="470" y2="187" class="dim"/><rect x="470" y="305" width="350" height="85" fill="#e9efef" stroke="#17364a" class=""/><text x="485" y="337" class="n">Managed A / B loop branches</text><text x="485" y="364" class="s">Four speed sensors + traction control</text><line x1="645" y1="230" x2="645" y2="305" class="line"/><rect x="70" y="480" width="240" height="85" fill="#e9efef" stroke="#17364a" class=""/><text x="85" y="512" class="n">M1 · 376 cc candidate</text><text x="85" y="539" class="s">Reversible hydraulic shaft motor</text><rect x="400" y="480" width="230" height="85" fill="#e9efef" stroke="#17364a" class=""/><text x="415" y="512" class="n">Axle 1 + two wheels</text><text x="415" y="539" class="s">1:1 coupling; solid wheelset</text><line x1="310" y1="522" x2="400" y2="522" class="dim"/><path d="M 645 390 V 410 H 55 V 522 H 70" stroke="#227c8a" fill="none" stroke-width="3"/><rect x="750" y="480" width="240" height="85" fill="#e9efef" stroke="#17364a" class=""/><text x="765" y="512" class="n">M2 · 376 cc candidate</text><text x="765" y="539" class="s">Reversible hydraulic shaft motor</text><rect x="1080" y="480" width="230" height="85" fill="#e9efef" stroke="#17364a" class=""/><text x="1095" y="512" class="n">Axle 2 + two wheels</text><text x="1095" y="539" class="s">1:1 coupling; solid wheelset</text><line x1="990" y1="522" x2="1080" y2="522" class="dim"/><path d="M 665 390 V 430 H 735 V 522 H 750" stroke="#227c8a" fill="none" stroke-width="3"/><rect x="70" y="650" width="240" height="85" fill="#e9efef" stroke="#17364a" class=""/><text x="85" y="682" class="n">M3 · 376 cc candidate</text><text x="85" y="709" class="s">Reversible hydraulic shaft motor</text><rect x="400" y="650" width="230" height="85" fill="#e9efef" stroke="#17364a" class=""/><text x="415" y="682" class="n">Axle 3 + two wheels</text><text x="415" y="709" class="s">1:1 coupling; solid wheelset</text><line x1="310" y1="692" x2="400" y2="692" class="dim"/><path d="M 645 390 V 410 H 55 V 692 H 70" stroke="#227c8a" fill="none" stroke-width="3"/><rect x="750" y="650" width="240" height="85" fill="#e9efef" stroke="#17364a" class=""/><text x="765" y="682" class="n">M4 · 376 cc candidate</text><text x="765" y="709" class="s">Reversible hydraulic shaft motor</text><rect x="1080" y="650" width="230" height="85" fill="#e9efef" stroke="#17364a" class=""/><text x="1095" y="682" class="n">Axle 4 + two wheels</text><text x="1095" y="709" class="s">1:1 coupling; solid wheelset</text><line x1="990" y1="692" x2="1080" y2="692" class="dim"/><path d="M 665 390 V 430 H 735 V 692 H 750" stroke="#227c8a" fill="none" stroke-width="3"/><rect x="940" y="155" width="370" height="110" fill="#e9efef" stroke="#17364a" class=""/><text x="955" y="187" class="n">Reservoir / filter / cooler system</text><text x="955" y="214" class="s">Dedicated low-pressure case drains</text><text x="950" y="240" class="s">Charge and flushing circuit to be selected</text><path d="M190 565V600H1340 M870 565V600 M190 735V770H1340 M870 735V770 M1340 770V200H1310 M940 215H820" stroke="#846b98" stroke-width="2" stroke-dasharray="7 5" fill="none"/><text x="1030" y="625" class="s">Dashed: case drains</text><text x="65" y="805" class="n">A/B pressure reverses for reverse travel. Motor mounting side determines port-to-wheel direction.</text><text x="65" y="843" class="s">Case drains remain separate from the working loop; limits and routing follow the selected supplier package.</text><text x="65" y="875" class="s">Maintain independent air service / spring parking brakes. Hydrostatic retardation is not the sole brake.</text><text x="65" y="908" class="s">Diagram shows functional groups, not a buildable hydraulic schematic. Speed control must tolerate axle speed differences.</text><text x="50" y="947" class="s">DT4 R0 · 19 October 2026 · mm · Layout / envelope study; NOT fabrication geometry</text></svg>
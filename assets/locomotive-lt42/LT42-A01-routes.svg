ds.</text><text x="50.00" y="1041.00" class="small">Full coordinates and the factored combined movement scope are in branches.json and combined-summary.json.</text><text x="50.00" y="1072.00" class="small">Wheel circles and axle lines are references only. Plan/elevation projection crossings are not necessarily physical contacts.</text><text x="50.00" y="1103.00" class="small">Exact fittings, clamp locations, tool access, pressure loss, dynamic hoses and material torsion remain unqualified.</text><polyline points="40.00,1195.00 1560.00,1195.00" fill="none" stroke="#173b4b" stroke-width="2"/><text x="45.00" y="1225.00" class="small">PULSIPHER FARMS | Unresolved interfaces remain held | Dimensions mm unless stated | Do not scale</text></svg>
nchor="start">2.625</text><text x="1340.00" y="373.00" font-size="17" font-weight="normal" fill="#23443f" text-anchor="start">5</text><text x="1460.00" y="373.00" font-size="17" font-weight="normal" fill="#23443f" text-anchor="start">3.125</text><text x="1580.00" y="373.00" font-size="17" font-weight="normal" fill="#23443f" text-anchor="start">5.750</text><text x="1130.00" y="455.00" font-size="18" font-weight="bold" fill="#23443f" text-anchor="start">HP03 CHEEK · 128 / COACH</text><text x="1130.00" y="490.00" font-size="16" font-weight="normal" fill="#23443f" text-anchor="start">A36 plate 3.000 X × 2.000 Z × 0.250 Y.</text><text x="1130.00" y="517.00" font-size="16" font-weight="normal" fill="#23443f" text-anchor="start">Two cheeks, inboard and outboard of 2-wide rail.</text><text x="1130.00" y="544.00" font-size="16" font-weight="normal" fill="#23443f" text-anchor="start">Top Z31.003937. Cheek inside faces at Y19 / Y21</text><text x="1130.00" y="571.00" font-size="16" font-weight="normal" fill="#23443f" text-anchor="start">for foot Y20; same relative placement at every foot.</text><text x="1130.00" y="630.00" font-size="18" font-weight="bold" fill="#23443f" text-anchor="start">HP04 MACHINED SPACER · 256 / COACH</text><text x="1130.00" y="665.00" font-size="16" font-weight="normal" fill="#23443f" text-anchor="start">A36 bar candidate; Ø1.000 OD / Ø0.5625 bore.</text><text x="1130.00" y="692.00" font-size="16" font-weight="normal" fill="#23443f" text-anchor="start">Nominal length 12.600 mm (0.496063 in).</text><text x="1130.00" y="719.00" font-size="16" font-weight="normal" fill="#23443f" text-anchor="start">Finish matched sets after actual floor / weld fit-up.</text><text x="1130.00" y="746.00" font-size="16" font-weight="normal" fill="#23443f" text-anchor="start">Proposed ±0.05 mm length; set spread ≤0.05 mm.</text><text x="1130.00" y="773.00" font-size="16" font-weight="normal" fill="#23443f" text-anchor="start">Faces square / parallel to maintain full plate bearing.</text><text x="60.00" y="927.00" font-size="17" font-weight="normal" fill="#23443f" text-anchor="start">Proposed shop control: profile ±1/32; hole centres ±1/64 from shared datums; drill through paired cap/sole in a fixture.</text><text x="60.00" y="956.00" font-size="17" font-weight="normal" fill="#23443f" text-anchor="start">Deburr edges and holes. Inspect flat bearing faces before coating. These are design targets, not supplier tolerances.</text><path d="M42,1018L1758,1018" fill="none" stroke="#23443f" stroke-width="1"/><text x="45.00" y="1043.00" font-size="15" font-weight="normal" fill="#23443f" text-anchor="start">All plate profiles and hole locations above are read from the same solids exported to STEP; dimensions are nominal designer selections.</text><text x="45.00" y="1067.00" font-size="15" font-weight="normal" fill="#23443f" text-anchor="start">HP01 / HP02 revised to 3/4-inch after combined longitudinal / lateral inertia review; this does not establish joint strength acceptance.</text><text x="45.00" y="1091.00" font-size="15" font-weight="normal" fill="#23443f" text-anchor="start">Sleeve/spacer machining, coordinated holes, inspection and controlled finish work are subcontract tasks.</text><text x="45.00" y="1115.00" font-size="15" font-weight="normal" fill="#23443f" text-anchor="start">Final plate bending, prying, rail-wall load transfer, weld procedure, fatigue and bolt locking require completion before production.</text><path d="M42,1146L1758,1146" fill="none" stroke="#23443f" stroke-width="1"/><text x="45.00" y="1177.00" font-size="14" font-weight="normal" fill="#23443f" text-anchor="start">C2-P01  ·  Canonical: build_c2.py / parameters.json / parts.json / drawing-edges.json  ·  Dimensions govern; do not scale.</text></g></svg>
"960" y="655" fill="#23443f" font-size="18" font-weight="bold" text-anchor="start">STACK / ASSEMBLY</text><text x="960" y="690" fill="#23443f" font-size="16" font-weight="normal" text-anchor="start">Cap bottom Z31.003937; top Z31.753937.</text><text x="960" y="720" fill="#23443f" font-size="16" font-weight="normal" text-anchor="start">Sole underside Z32.250; top Z33.000.</text><text x="960" y="750" fill="#23443f" font-size="16" font-weight="normal" text-anchor="start">HP04 matched spacer set carries clamp compression.</text><text x="960" y="780" fill="#23443f" font-size="16" font-weight="normal" text-anchor="start">The panel is not inside the structural bolt clamp stack.</text><text x="960" y="810" fill="#23443f" font-size="16" font-weight="normal" text-anchor="start">Remove four bolts at each foot to lift the bench.</text><text x="960" y="840" fill="#23443f" font-size="16" font-weight="normal" text-anchor="start">Access lower nuts from below; verify tools and service route.</text><text x="960" y="870" fill="#23443f" font-size="16" font-weight="normal" text-anchor="start">Wire projection retains +X bolt row behind cut face.</text><text x="960" y="900" fill="#23443f" font-size="16" font-weight="normal" text-anchor="start">Thread envelopes are simplified; this is not a thread profile.</text><path fill="none" stroke="#23443f" stroke-width="1" d="M42 1018h1716"/><text x="45" y="1043" fill="#23443f" font-size="15" font-weight="normal" text-anchor="start">64 hardpoints / regular coach. Each has 4 spacer-and-bolt paths; 256 bolts, 256 spacers and 512 washers total.</text><text x="45" y="1067" fill="#23443f" font-size="15" font-weight="normal" text-anchor="start">Cheek/cap/rail and leg/sole welds are proposed joints; use the engineering record for load screens and required procedure / fatigue review.</text><text x="45" y="1091" fill="#23443f" font-size="15" font-weight="normal" text-anchor="start">Floor cutout 3.875 × 6.375 centred on each foot. No floor-edge seal/closeout, fastener locking or final coating torque is invented.</text><text x="45" y="1115" fill="#23443f" font-size="15" font-weight="normal" text-anchor="start">Nominal clearance resolves the earlier sole-to-floor contact; minimum clearance under actual tolerances and load remains to verify.</text><path fill="none" stroke="#23443f" stroke-width="1" d="M42 1146h1716"/><text x="45" y="1177" fill="#23443f" font-size="14" font-weight="normal" text-anchor="start">C2-J01  ·  Canonical: build_c2.py / parameters.json / parts.json / drawing-edges.json  ·  Dimensions govern; do not scale.</text></g></svg>
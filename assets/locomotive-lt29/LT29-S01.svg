  <g id="axes_2">
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(60.48 419.337638)">Normal contact ±14; ultimate seat ±34.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(60.48 433.194903)">20 mm useful crush stroke per direction.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(60.48 447.052169)">Cartridge target 75–85 kN; no selected product.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(60.48 460.909434)"/>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(60.48 474.7667)">Pin: 4140 Q&amp;T; core proof≥650 MPa requested.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(60.48 488.623966)">Sleeve: C93200 bronze; finished bore after fitting.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(60.48 502.481231)">Cheek/seat/gussets: A572 Grade 50 candidate.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(60.48 516.338497)">Actual certificates and toughness remain required.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203c3b" x="60.48" y="402.24" transform="rotate(-0 60.48 402.24)">Travel and material proposal</text>
   </g>
  </g>
  <g id="axes_3">
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 419.337638)">Pin ground 89.970–89.990.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 433.194903)">Sleeve ID 90.080–90.120.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 447.052169)">Diametral clearance 0.090–0.150 proposed.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 460.909434)"/>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 474.788497)">Ø6 axial grease bore; Ø2 outlets at X±25.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 488.645763)">Grease grooves, seals and interval unselected.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 502.503028)">Spherical bearing has a separate grease circuit.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(475.2 516.360294)">Head/nut retain pin; never clamp the sliding ring.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203c3b" x="475.2" y="402.24" transform="rotate(-0 475.2 402.24)">Running fit, retention and lubrication</text>
   </g>
  </g>
  <g id="text_12">

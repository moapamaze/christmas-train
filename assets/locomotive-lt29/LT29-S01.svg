  </g>
  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203c3b" x="47.52" y="631.8" transform="rotate(-0 47.52 631.8)">REVIEW CANDIDATE • All dimensions in mm • No qualified catch • Fabrication dimensions UNRELEASED</text>

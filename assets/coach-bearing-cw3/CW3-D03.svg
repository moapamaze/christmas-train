<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse"><path d="M6 3L0 0V6Z" fill="#27444e"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#203b45}.title{font-size:31px;font-weight:bold}.s{font-size:22px}.n{font-size:18px}.ln{fill:none;stroke:#27444e;stroke-width:1.4}.dim{fill:none;stroke:#27444e;stroke-width:1.3;marker-start:url(#arrow);marker-end:url(#arrow)}.dash{fill:none;stroke:#ad6c19;stroke-width:2;stroke-dasharray:7 5}</style><rect width="1600" height="1120" fill="#fbfcf8"/><text x="50" y="55" class="title">Grease labyrinth and flinger: both bearing ends</text><text x="50" y="92" class="s">CW3-D03 · CW3-R0 · 20 October 2026 · dimensions in mm · DESIGN REVIEW</text><path d="M50 113L1550 113" class="ln"/><text x="65" y="155" class="n">One-piece inner cover / cup; rotating flinger fixed to shaft. Open rear faces bearing.</text><rect x="100" y="390" width="960" height="260" fill="#a4b8c1" stroke="#27444e" stroke-width="1.3"/><rect x="220" y="250" width="288" height="110" fill="#79a7a0" stroke="#27444e" stroke-width="1.3"/><rect x="508" y="285" width="360" height="10" fill="#79a7a0" stroke="#27444e" stroke-width="1.3"/><rect x="580" y="375" width="288" height="15" fill="#cf8555" stroke="#27444e" stroke-width="1.3"/><rect x="664.0" y="320" width="48.0" height="55" fill="#cf8555" stroke="#27444e" stroke-width="1.3"/><path d="M100 650L1100 650" class="ln"/><text x="1140" y="230" class="s">Stationary cup</text><text x="1140" y="270" class="s">OD146 / ID142</text><text x="1140" y="310" class="s">Front opening Ø116</text><text x="1140" y="380" class="s">Rotating disc</text><text x="1140" y="420" class="s">OD132 ×2</text><text x="1140" y="460" class="s">Y583.5–585.5</text><text x="1140" y="520" class="s">Barrel OD110 / ID104</text><text x="1140" y="560" class="s">Y580–592 (12)</text><path d="M220 250L220 230" class="ln"/><path d="M508 250L508 230" class="ln"/><path d="M220 225H508" class="dim"/><text x="364.0" y="216" class="n" text-anchor="middle">12 cover</text><path d="M508 650L508 715" class="ln"/><path d="M868 650L868 715" class="ln"/><path d="M508 710H868" class="dim"/><text x="688.0" y="701" class="n" text-anchor="middle">15 cup</text><path d="M508 650L508 770" class="ln"/><path d="M664.0 650L664.0 770" class="ln"/><path d="M508 765H664.0" class="dim"/><text x="586.0" y="756" class="n" text-anchor="middle">6.5 front gap</text><path d="M712.0 650L712.0 825" class="ln"/><path d="M868 650L868 825" class="ln"/><path d="M712.0 820H868" class="dim"/><text x="790.0" y="811" class="n" text-anchor="middle">6.5 nominal overlap</text><text x="65" y="880" class="n">Screen: ±3 axial float plus 2° tilt about bearing centre Y620; additional 0.5 error reserve is illustrative.</text><text x="65" y="918" class="n">Disc edge: about 0.7 minimum front clearance / rear cup overlap after that reserve. Front barrel radial clearance ≈0.86.</text><text x="65" y="956" class="n">Interference-retained flinger, installation position and extraction method require shop release. No axle drilling for set screws.</text><text x="65" y="994" class="n">Grease enters outer cap, passes bearing, exits inward around the baffle. No water-ingress rating or lubrication interval established.</text><path d="M50 1040L1550 1040" class="ln"/><text x="50" y="1075" class="n">PROPOSED DETAILS — materials, fits, fatigue, sealing performance and purchased-part interfaces require release.</text><text x="50" y="1100" class="n">Not for machining. Bearing internals / thread helix are schematic. All positive-side Y stations mirror at the left end.</text></svg>
="#b0bac2" stroke="#27444e" stroke-width="1.3"/><rect x="600" y="458.7" width="400" height="16.8" fill="#9aadb9" stroke="#27444e" stroke-width="1.3"/><rect x="600" y="414.6" width="400" height="42.0" fill="#9aadb9" stroke="#27444e" stroke-width="1.3"/><rect x="600" y="402.0" width="400" height="11.55" fill="#9aadb9" stroke="#27444e" stroke-width="1.3"/><rect x="400" y="454.5" width="120" height="6.300000000000001" fill="#cf8555" stroke="#27444e" stroke-width="1.3"/><rect x="435.0" y="431.4" width="20.0" height="23.1" fill="#cf8555" stroke="#27444e" stroke-width="1.3"/><rect x="1000" y="460.8" width="20" height="14.700000000000001" fill="#d9b45e" stroke="#27444e" stroke-width="1.3"/><rect x="1020" y="460.8" width="30" height="14.489999999999998" fill="#d9b45e" stroke="#27444e" stroke-width="1.3"/><rect x="1050" y="456.6" width="17.5" height="18.900000000000002" fill="#bb9158" stroke="#27444e" stroke-width="1.3"/><rect x="1067.5" y="444.0" width="160.0" height="31.5" fill="#bb9158" stroke="#27444e" stroke-width="1.3"/><path d="M65 570L1510 570" class="ln"/><text x="90" y="603" class="n">Axle centreline A</text><path d="M250 570L250 245" class="ln"/><path d="M370 570L370 245" class="ln"/><path d="M250 240H370" class="dim"/><text x="310.0" y="231" class="n" text-anchor="middle">12 cover</text><path d="M370 570L370 200" class="ln"/><path d="M1350 570L1350 200" class="ln"/><path d="M370 195H1350" class="dim"/><text x="860.0" y="186" class="n" text-anchor="middle">98 main housing</text><path d="M600 570L600 290" class="ln"/><path d="M1000 570L1000 290" class="ln"/><path d="M600 285H1000" class="dim"/><text x="800.0" y="276" class="n" text-anchor="middle">40 bearing</text><path d="M1000 570L1000 655" class="ln"/><path d="M1250 570L1250 655" class="ln"/><path d="M1000 650H1250" class="dim"/><text x="1125.0" y="641" class="n" text-anchor="middle">25 retention end</text><path d="M100 570L100 705" class="ln"/><path d="M250 570L250 705" class="ln"/><path d="M100 700H250" class="dim"/><text x="175.0" y="691" class="n" text-anchor="middle">15 hub-to-cover nominal</text><path d="M1250 570L1250 765" class="ln"/><path d="M1350 570L1350 765" class="ln"/><path d="M1250 760H1350" class="dim"/><text x="1300.0" y="751" class="n" text-anchor="middle">10 tip-to-cap nominal</text><text x="70" y="825" class="s">Bearing centre Y620 and wheel hub end Y550 remain unchanged.</text><text x="70" y="865" class="n">Inner cover moves from Y553–565 to Y565–577; housing and inner outer-ring abutment shorten by 12.</text><text x="70" y="905" class="n">Locating-side abutment: 577–600 (23). Floating-side abutment: |Y|577–597 (20), with 3 end float.</text><text x="70" y="945" class="n">Ø104 shoulder; journal Ø90 ×40; shoulder fillet proposed R1.5, with bearing catalog limit r ≤2.</text><text x="70" y="985" class="n">Blind cap: 12 thick; M6×1 grease-inlet proposal. Static cover joints use a specified sealant film, not an unallowed thick gasket.</text><path d="M50 1040L1550 1040" class="ln"/><text x="50" y="1075" class="n">PROPOSED DETAILS — materials, fits, fatigue, sealing performance and purchased-part interfaces require release.</text><text x="50" y="1100" class="n">Not for machining. Bearing internals / thread helix are schematic. All positive-side Y stations mirror at the left end.</text></svg>
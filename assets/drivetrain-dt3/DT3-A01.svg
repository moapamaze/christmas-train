Motor → 2.5:1 spur</text><text x="1210" y="265" font-size="20" font-weight="normal" style="fill:#17364a">→ two cardan shafts</text><text x="1210" y="295" font-size="20" font-weight="normal" style="fill:#17364a">→ 3:1 bevel drives</text><text x="1210" y="325" font-size="20" font-weight="normal" style="fill:#17364a">→ axles and wheels</text><text x="1210" y="405" font-size="19" font-weight="normal" style="fill:#17364a">ONE SET PER TRUCK</text><text x="1210" y="435" font-size="19" font-weight="normal" style="fill:#17364a">Motor H1B110</text><text x="1210" y="465" font-size="19" font-weight="normal" style="fill:#17364a">Spur pair 24 / 60</text><text x="1210" y="495" font-size="19" font-weight="normal" style="fill:#17364a">Bevel pairs 20 / 60</text><text x="1210" y="525" font-size="19" font-weight="normal" style="fill:#17364a">Overall ratio 7.5:1</text><text x="1210" y="555" font-size="19" font-weight="normal" style="fill:#17364a">Two axles locked</text><text x="1210" y="585" font-size="19" font-weight="normal" style="fill:#17364a">mechanically together</text><text x="1210" y="650" font-size="19" font-weight="normal" style="fill:#17364a">COMMON DATUM</text><text x="1210" y="680" font-size="19" font-weight="normal" style="fill:#17364a">X0 = truck pivot</text><text x="1210" y="710" font-size="19" font-weight="normal" style="fill:#17364a">Y0 = track centre</text><text x="1210" y="740" font-size="19" font-weight="normal" style="fill:#17364a">Z0 = rail top</text><text x="1210" y="770" font-size="19" font-weight="normal" style="fill:#17364a">All shaft axes Z500</text><text x="1210" y="800" font-size="19" font-weight="normal" style="fill:#17364a">Pivots X3300 /6000</text><text x="90" y="970" font-size="19" font-weight="normal" style="fill:#17364a">New global axle centres: 2600 / 4000 / 5300 / 6700. DT2’s ±600 axle locations are superseded only in this proposal.</text></svg>
xt><path d="M1370 425L1400 425" stroke="#356d59" stroke-width="3" fill="none" stroke-dasharray="9 5"/><path d="M1400 425L1400 735" stroke="#356d59" stroke-width="3" fill="none" stroke-dasharray="9 5"/><path d="M1400 735L620 735" stroke="#356d59" stroke-width="3" fill="none" stroke-dasharray="9 5"/><path d="M620 735L620 760" stroke="#356d59" stroke-width="3" fill="none" stroke-dasharray="9 5"/><text x="1378" y="640" font-size="18" font-weight="normal" style="fill:#356d59">D2 → tank</text><path d="M560 405L650 405" stroke="#ba4c35" stroke-width="5" fill="none"/><path d="M650 405L650 245" stroke="#ba4c35" stroke-width="5" fill="none"/><path d="M650 245L1300 245" stroke="#ba4c35" stroke-width="5" fill="none"/><path d="M560 495L650 495" stroke="#217797" stroke-width="5" fill="none"/><path d="M650 495L650 585" stroke="#217797" stroke-width="5" fill="none"/><path d="M650 585L1300 585" stroke="#217797" stroke-width="5" fill="none"/><circle cx="900" cy="245" r="5" class="o"/><circle cx="900" cy="585" r="5" class="o"/><text x="690" y="215" font-size="21" font-weight="bold" style="fill:#ba4c35">A main → A1 + A2</text><text x="690" y="625" font-size="21" font-weight="bold" style="fill:#217797">B main → B1 + B2</text><rect x="390" y="760" width="270" height="100" class="v"/><text x="420" y="802" font-size="20" font-weight="normal" style="fill:#17364a">Reservoir / deaeration</text><text x="420" y="835" font-size="18" font-weight="normal" style="fill:#17364a">Dedicated case returns</text><path d="M660 710L660 800" stroke="#356d59" stroke-width="3" fill="none" stroke-dasharray="9 5"/><path d="M455 525L455 760" stroke="#356d59" stroke-width="3" fill="none" stroke-dasharray="9 5"/><text x="465" y="685" font-size="18" font-weight="normal" style="fill:#356d59">Pump case drain</text><path d="M390 810L305 810" stroke="#17364a" stroke-width="3" fill="none"/><path d="M305 810L305 660" stroke="#17364a" stroke-width="3" fill="none"/><rect x="250" y="620" width="110" height="40" class="v"/><text x="260" y="647" font-size="15" font-weight="normal" style="fill:#17364a">Charge filter</text><path d="M305 620L305 350" stroke="#17364a" stroke-width="3" fill="none"/><path d="M305 350L420 350" stroke="#17364a" stroke-width="3" fill="none"/><path d="M420 350L420 375" stroke="#17364a" stroke-width="3" fill="none"/><rect x="790" y="770" width="290" height="90" class="v"/><text x="810" y="804" font-size="18" font-weight="normal" style="fill:#17364a">Low-loop flush selection</text><text x="810" y="831" font-size="18" font-weight="normal" style="fill:#17364a">→ relief → cooler → tank</text><path d="M790 815L660 815" stroke="#217797" stroke-width="3" fill="none"/><text x="1140" y="805" font-size="18" font-weight="normal" style="fill:#17364a">Flush branch connects to A/B</text><text x="1140" y="835" font-size="18" font-weight="normal" style="fill:#17364a">through an OEM-approved selector.</text><text x="65" y="910" font-size="18" font-weight="normal" style="fill:#17364a">A/B: motor DN25 ISO6162 40 MPa series; M12×1.75 ports. Verify selected pump variant separately.</text><text x="65" y="941" font-size="18" font-weight="normal" style="fill:#17364a">D1/D2: upper motor case-drain L1 or L2 → reservoir, independent low-backpressure lines. No cooler in these lines.</text></svg>
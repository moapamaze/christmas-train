rs and</text><text x="1140" y="821" font-size="19" font-weight="normal" style="fill:#17364a">preload remain to detail.</text><text x="75" y="905" font-size="20" font-weight="bold" style="fill:#17364a">REAR UNIT: rotate the complete front unit 180° about vertical Z. This preserves the required wheel rotation.</text><text x="75" y="943" font-size="19" font-weight="normal" style="fill:#17364a">Axle bearings carry the gearcase; torque arm reacts rotation about axle Y. Bearing couples carry the other reaction moments.</text></svg>
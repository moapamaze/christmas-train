<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1220" role="img" aria-labelledby="title"><title id="title">LT17 R01 rocker pin retention and service-clearance study</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 4L0 0L0 8Z" fill="#34515c"/></marker></defs><style>text{font:21px Arial;fill:#203c48}.title{font-size:32px;font-weight:700}.sub{font-size:25px;font-weight:700}.small{font-size:18px}.fixed{fill:#c5d5da;stroke:#526c78;stroke-width:1.5}.pin{fill:#d6b576;stroke:#89692d;stroke-width:1.5}.saddle{fill:#89ada5;stroke:#40695f;stroke-width:1.5}.line{fill:none;stroke:#526c78;stroke-width:1.5}.dim{fill:none;stroke:#34515c;stroke-width:1.2;marker-start:url(#arrow);marker-end:url(#arrow)}.ghost{fill:none;stroke:#ba7c4b;stroke-width:2;stroke-dasharray:8 5}</style><rect width="1600" height="1220" fill="#fff"/><text x="44" y="50" class="title">LT17–R01 | Rocker pin: positive retention and removal space</text><text x="44" y="86" class="">Front powered axle · same detail at both axleboxes · nominal millimetres · development only</text><path d="M44 106L1556 106" class="line"/><text x="44" y="150" class="sub">A  |  Retained pin, longitudinal section</text><text x="44" y="182" class="small">Pin centre is X3500 / Z865; drawing X offsets are relative to that centre.</text><rect x="288" y="266" width="48" height="108" class="fixed"/><rect x="464" y="266" width="48" height="108" class="fixed"/><rect x="344" y="260" width="112" height="120" class="saddle"/><rect x="286.0" y="280" width="228" height="80" class="pin"/><rect x="262.0" y="292" width="24" height="56" class="pin"/><rect x="514.0" y="288" width="108" height="64" class="pin"/><rect x="514.0" y="264" width="12" height="112" class="fixed"/><rect x="526.0" y="272" width="52" height="96" class="pin"/><rect x="578.0" y="276" width="24" height="88" class="pin"/><path d="M590.0 262L590.0 378" class="line"/><rect x="337.0" y="260" width="6.0" height="120" class="fixed"/><rect x="457.0" y="260" width="6.0" height="120" class="fixed"/><path d="M150 320L690 320" class="ghost"/><path d="M286.0 420L514.0 420" class="dim"/><text x="328" y="448" class="small">57 smooth grip</text><path d="M262.0 485L622.0 485" class="dim"/><text x="385" y="514" class="small">90 overall</text><text x="50" y="550" class="small">Ø20 pin · 30 ×14 ×6 flat head · M16×2 thread, 27 long</text><text x="50" y="581" class="small">Nut: 24 AF ×19 overall. Washer: Ø28/17 ×3.</text><text x="50" y="612" class="small">Ø4.5 cross-hole at X+47.5; split-pin envelope shown.</text><text x="50" y="643" class="small">Nut clamps against the shoulder, not across the rocker.</text><path d="M800 130L800 700" class="line"/><text x="850" y="150" class="sub">B  |  Keep the rocker free to rotate</text><text x="850" y="187" class="small">Stack diagram, not to scale; tolerances still to be set.</text><rect x="870" y="230" width="640" height="110" class="fixed"/><rect x="1010" y="230" width="360" height="110" class="saddle"/><text x="900" y="275" class="">12</text><text x="1100" y="275" class="">28 sleeve</text><text x="1440" y="275" class="">12</text><text x="950" y="320" class="">1.5 washer</text><text x="1285" y="320" class="">1.5 washer</text><path d="M870 390L1510 390" class="dim"/><text x="1070" y="423" class="small">56 outside cheek stack</text><text x="870" y="475" class="small">Pin grip − cheek stack = 57 −56 = 1 mm</text><text x="870" y="515" class="small">Cheek opening − sleeve − washers</text><text x="870" y="548" class="small">32 −28 −(2 ×1.5) = 1 mm rocker side space</text><text x="870" y="601" class="small">These are packaging gaps, not fit specifications.</text><text x="870" y="633" class="small">Endplay, bearing fit, lubrication and locking need review.</text><path d="M44 704L1556 704" class="line"/><text x="44" y="750" class="sub">C  |  Pin extraction at straight track / nominal suspension</text><rect x="179.79999999999995" y="780" width="110.00000000000001" height="180" class="fixed"/><rect x="910.2" y="780" width="110.00000000000001" height="180" class="fixed"/><rect x="314.0" y="815" width="572.0" height="110" class="ghost"/><rect x="317.29999999999995" y="837" width="220.00000000000003" height="66" class="saddle"/><rect x="314.0" y="780" width="39.6" height="180" class="fixed"/><rect x="314.0" y="825" width="39.6" height="90" class="ghost"/><rect x="524.1" y="852" width="198.00000000000003" height="36" class="ghost"/><rect x="332.7" y="852" width="198.00000000000003" height="36" class="pin"/><path d="M600 1005L408.6 1005" class="dim"/><text x="380" y="1037" class="small">87 withdrawal to the left</text><text x="1120" y="817" class="sub">Exit provisions</text><text x="1120" y="858" class="small">Ø26 saddle underside relief</text><text x="1120" y="891" class="small">3 mm minimum deck remains</text><text x="1120" y="924" class="small">136-wide capture toe</text><text x="1120" y="957" class="small">36-wide central exit notch</text><text x="1120" y="990" class="small">Two 50-wide toe portions</text><text x="50" y="1080" class="small">Retainers are removed before this path. Spring load must be independently supported; a support fixture is not designed.</text><text x="50" y="1115" class="small">Part-clearance study only. Tool access, complete removal, fatigue, impact retention and manufacturing fits remain open.</text><path d="M44 1140L1556 1140" class="line"/><text x="44" y="1182" class="small">Read with LT16 suspension drawings and LT17 engineering record · Not released for construction</text></svg>
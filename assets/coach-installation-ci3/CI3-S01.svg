<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><rect width="1600" height="1120" fill="#fbfcf8"/><g font-family="Arial,sans-serif"><text x="50" y="55" font-size="32" fill="#25434e" text-anchor="start">Suspension stops — earlier contact and a positive travel limit</text><text x="50" y="92" font-size="20" fill="#25434e" text-anchor="start">CI3-S01 · CI3-R0 · Millimetres · Section through one stop; two stops per axlebox</text><path d="M50,112 L1550,112" fill="none" stroke="#335866" stroke-width="2"/><polygon points="104,195 140,195 140,630 104,630" fill="#9eb7b0" stroke="#335866" stroke-width="2"/><polygon points="560,195 596,195 596,630 560,630" fill="#9eb7b0" stroke="#335866" stroke-width="2"/><polygon points="140,402 560,402 560,450 140,450" fill="#7897a6" stroke="#335866" stroke-width="2"/><polygon points="140,252 560,252 560,402 140,402" fill="#d4e1dc" stroke="#335866" stroke-width="2"/><text x="120" y="175" font-size="21" fill="#25434e" text-anchor="start">Rib at section: 12 × 140 × 50</text><polygon points="215,450 485,450 485,600 215,600" fill="#7b9c94" stroke="#335866" stroke-width="2"/><polygon points="275,600 425,600 425,645 275,645" fill="#cda166" stroke="#335866" stroke-width="2"/><polygon points="215,600 275,600 275,624 215,624" fill="#b7b795" stroke="#335866" stroke-width="2"/><polygon points="425,600 485,600 485,624 425,624" fill="#b7b795" stroke="#335866" stroke-width="2"/><polygon points="185,720 515,720 515,780 185,780" fill="#bccbc8" stroke="#335866" stroke-width="2"/><text x="115" y="820" font-size="21" fill="#25434e" text-anchor="start">Axlebox roof: Z400 at nominal loaded position</text><path d="M140,252 L140,158" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M560,252 L560,158" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M140,150 L560,150" fill="none" stroke="#335866" stroke-width="2"/><path d="M135,156 L145,144" fill="none" stroke="#335866" stroke-width="2"/><path d="M555,156 L565,144" fill="none" stroke="#335866" stroke-width="2"/><text x="350.0" y="140" font-size="21" fill="#25434e" text-anchor="middle">140 between webs</text><path d="M560,402 L658,402" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M560,450 L658,450" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M650,402 L650,450" fill="none" stroke="#335866" stroke-width="2"/><path d="M644,407 L656,397" fill="none" stroke="#335866" stroke-width="2"/><path d="M644,455 L656,445" fill="none" stroke="#335866" stroke-width="2"/><text x="662" y="433.0" font-size="21" fill="#25434e" text-anchor="start">16</text><path d="M560,252 L658,252" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M560,402 L658,402" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M650,252 L650,402" fill="none" stroke="#335866" stroke-width="2"/><path d="M644,257 L656,247" fill="none" stroke="#335866" stroke-width="2"/><path d="M644,407 L656,397" fill="none" stroke="#335866" stroke-width="2"/><text x="662" y="334.0" font-size="21" fill="#25434e" text-anchor="start">50</text><path d="M485,645 L638,645" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M485,720 L638,720" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M630,645 L630,720" fill="none" stroke="#335866" stroke-width="2"/><path d="M624,650 L636,640" fill="none" stroke="#335866" stroke-width="2"/><path d="M624,725 L636,715" fill="none" stroke="#335866" stroke-width="2"/><text x="642" y="689.5" font-size="21" fill="#25434e" text-anchor="start">25 contact</text><path d="M215,624 L98,624" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M215,720 L98,720" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M90,624 L90,720" fill="none" stroke="#335866" stroke-width="2"/><path d="M84,629 L96,619" fill="none" stroke="#335866" stroke-width="2"/><path d="M84,725 L96,715" fill="none" stroke="#335866" stroke-width="2"/><text x="102" y="679.0" font-size="21" fill="#25434e" text-anchor="start">32 metal</text><text x="820" y="185" font-size="24" fill="#25434e" text-anchor="start">Local stop dimensions</text><text x="820" y="230" font-size="22" fill="#25434e" text-anchor="start">Block: 40 X × 90 Y × 50 Z</text><text x="820" y="270" font-size="22" fill="#25434e" text-anchor="start">Rubber: 40 × 50 × 15</text><text x="820" y="310" font-size="22" fill="#25434e" text-anchor="start">Steel shoulders: 40 × 20 × 8 each</text><text x="820" y="350" font-size="22" fill="#25434e" text-anchor="start">Contact at +25; metal limit at +32</text><text x="820" y="390" font-size="22" fill="#25434e" text-anchor="start">Rubber compression allowance: 7</text><text x="820" y="450" font-size="24" fill="#25434e" text-anchor="start">Load path</text><text x="820" y="490" font-size="21" fill="#25434e" text-anchor="start">Roof → block → guide bridge → ribs → webs</text><text x="820" y="550" font-size="21" fill="#25434e" text-anchor="start">From axle centre: rib X = ±75 ±14</text><text x="820" y="587" font-size="21" fill="#25434e" text-anchor="start">Y ±70 from box centre; Z506–556</text><text x="820" y="624" font-size="21" fill="#25434e" text-anchor="start">6 mm fillets: block perimeter, rib bases</text><text x="820" y="661" font-size="21" fill="#25434e" text-anchor="start">and rib ends at the side webs</text><text x="820" y="725" font-size="22" fill="#25434e" text-anchor="start">At +32: 8 mm guide and damper margin</text><text x="820" y="762" font-size="21" fill="#25434e" text-anchor="start">Allocate 3 mm to the local stop stack</text><text x="820" y="799" font-size="21" fill="#25434e" text-anchor="start">Nominal spring height at limit: 218</text><path d="M50,850 L1550,850" fill="none" stroke="#335866" stroke-width="2"/><text x="50" y="890" font-size="21" fill="#25434e" text-anchor="start">Bogie-local Z above rail, nominal loaded position. Wheel/box rises; the steel stop frame stays fixed.</text><text x="50" y="925" font-size="21" fill="#25434e" text-anchor="start">Machine shoulder faces from a common datum; verify actual assembled roof-to-metal gap at every axlebox.</text><text x="50" y="960" font-size="21" fill="#25434e" text-anchor="start">Elastomer is a bonded procurement envelope. Compound, bond/retention, force curve, rebound and impact energy remain unselected.</text><text x="50" y="995" font-size="21" fill="#25434e" text-anchor="start">32 mm is the proposed primary jounce limit. It does not limit body pitch/roll at the separate centre bearing.</text><text x="50" y="1030" font-size="21" fill="#25434e" text-anchor="start">Do not use the damper or guide-window edge as the travel stop. Existing 60 mm captured droop is abnormal/service only.</text><text x="50" y="1087" font-size="18" fill="#25434e" text-anchor="start">Development dimensions — material, welding procedure, local frame strength and fatigue release remain in separate engineering.</text></g></svg>
ute the earlier 12 mm endplate.</text><text x="50" y="1030" font-size="21" fill="#25434e" text-anchor="start">Steel top 787.5; floor 812.8 retained. Dimensions show fit; local HSS wall/prying and fatigue are not released.</text><text x="50" y="1087" font-size="18" fill="#25434e" text-anchor="start">Development dimensions — material, welding procedure, local frame strength and fatigue release remain in separate engineering.</text></g></svg>
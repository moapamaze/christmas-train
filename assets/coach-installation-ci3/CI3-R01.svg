<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><rect width="1600" height="1120" fill="#fbfcf8"/><g font-family="Arial,sans-serif"><text x="50" y="55" font-size="32" fill="#25434e" text-anchor="start">Spring-seat ribs and captured-droop retention</text><text x="50" y="92" font-size="20" fill="#25434e" text-anchor="start">CI3-R01 · CI3-R0 · Millimetres · Outer spring seat; mirrored at each bogie end</text><path d="M50,112 L1550,112" fill="none" stroke="#335866" stroke-width="2"/><polygon points="100.0,200.0 644.0,200.0 644.0,676.0 100.0,676.0" fill="#b5cbc0" stroke="#335866" stroke-width="2"/><polygon points="100.0,213.6 535.2,213.6 535.2,240.79999999999998 100.0,240.79999999999998" fill="#638b7c" stroke="#335866" stroke-width="2"/><path d="M117.0,193.2 L518.2,193.2" fill="none" stroke="#bd8a3c" stroke-width="2"/><path d="M117.0,261.2 L518.2,261.2" fill="none" stroke="#bd8a3c" stroke-width="2"/><polygon points="100.0,635.2 535.2,635.2 535.2,662.4000000000001 100.0,662.4000000000001" fill="#638b7c" stroke="#335866" stroke-width="2"/><path d="M117.0,614.8 L518.2,614.8" fill="none" stroke="#bd8a3c" stroke-width="2"/><path d="M117.0,682.8 L518.2,682.8" fill="none" stroke="#bd8a3c" stroke-width="2"/><circle cx="406.0" cy="438.0" r="153.0" fill="#d9ded4" stroke="#335866" stroke-width="2"/><circle cx="406.0" cy="438.0" r="42.5" fill="#fbfcf8" stroke="#335866" stroke-width="2"/><circle cx="406.0" cy="438.0" r="105.39999999999999" fill="none" stroke="#335866" stroke-dasharray="6 5" stroke-width="2"/><path d="M406.0,172.8 L406.0,703.2" fill="none" stroke="#7c9893" stroke-width="2" stroke-dasharray="8 5"/><path d="M72.8,438.0 L671.1999999999999,438.0" fill="none" stroke="#7c9893" stroke-width="2" stroke-dasharray="8 5"/><path d="M100.0,200.0 L100.0,173" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M644.0,200.0 L644.0,173" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M100.0,165 L644.0,165" fill="none" stroke="#335866" stroke-width="2"/><path d="M95.0,171 L105.0,159" fill="none" stroke="#335866" stroke-width="2"/><path d="M639.0,171 L649.0,159" fill="none" stroke="#335866" stroke-width="2"/><text x="372.0" y="155" font-size="21" fill="#25434e" text-anchor="middle">160</text><path d="M644.0,200.0 L698,200.0" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M644.0,676.0 L698,676.0" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M690,200.0 L690,676.0" fill="none" stroke="#335866" stroke-width="2"/><path d="M684,205.0 L696,195.0" fill="none" stroke="#335866" stroke-width="2"/><path d="M684,681.0 L696,671.0" fill="none" stroke="#335866" stroke-width="2"/><text x="702" y="445.0" font-size="21" fill="#25434e" text-anchor="start">140</text><path d="M100.0,676.0 L100.0,743" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M406.0,676.0 L406.0,743" fill="none" stroke="#8b9a9d" stroke-width="2"/><path d="M100.0,735 L406.0,735" fill="none" stroke="#335866" stroke-width="2"/><path d="M95.0,741 L105.0,729" fill="none" stroke="#335866" stroke-width="2"/><path d="M401.0,741 L411.0,729" fill="none" stroke="#335866" stroke-width="2"/><text x="253.0" y="725" font-size="21" fill="#25434e" text-anchor="middle">90 to coil / rod</text><text x="110" y="795" font-size="22" fill="#25434e" text-anchor="start">Plan: X700–860; right-side Y550–690</text><text x="840" y="170" font-size="24" fill="#25434e" text-anchor="start">Revised seat detail</text><text x="840" y="215" font-size="21" fill="#25434e" text-anchor="start">Seat plate 160 × 140 × 16; hole Ø62</text><text x="840" y="252" font-size="21" fill="#25434e" text-anchor="start">Two ribs 128 long × 8 thick</text><text x="840" y="289" font-size="21" fill="#25434e" text-anchor="start">Rib height 40 at X700 → 8 at X828</text><text x="840" y="326" font-size="21" fill="#25434e" text-anchor="start">Ribs Y554–562 and Y678–686</text><text x="840" y="363" font-size="21" fill="#25434e" text-anchor="start">6 mm fillets both sides, 118 effective long</text><text x="840" y="400" font-size="21" fill="#25434e" text-anchor="start">Outer capture washer Ø90 / 25 × 4</text><text x="840" y="437" font-size="21" fill="#25434e" text-anchor="start">7 mm nominal washer-to-fillet clearance</text><text x="840" y="505" font-size="24" fill="#25434e" text-anchor="start">Keeper / bolt detail</text><text x="840" y="545" font-size="21" fill="#25434e" text-anchor="start">Keeper retained: 280 × 140 × 16</text><text x="840" y="582" font-size="21" fill="#25434e" text-anchor="start">Top Z140; nominal box bottom Z200</text><text x="840" y="619" font-size="21" fill="#25434e" text-anchor="start">Capture at 60 mm droop</text><text x="840" y="656" font-size="21" fill="#25434e" text-anchor="start">Four M12 × 45; holes on 231 × 90</text><text x="840" y="693" font-size="21" fill="#25434e" text-anchor="start">29 mm nominal engagement in guides</text><text x="840" y="730" font-size="21" fill="#25434e" text-anchor="start">Ø2 predrilled heads for paired lockwire</text><text x="840" y="767" font-size="21" fill="#25434e" text-anchor="start">Guide tap drill depth 34; full thread ≥30</text><path d="M50,850 L1550,850" fill="none" stroke="#335866" stroke-width="2"/><text x="50" y="890" font-size="21" fill="#25434e" text-anchor="start">Lowered centre chord: top Z438 instead of 450; 12 mm closing plate at Z426–438, shoulders rejoin Z600 at X±350.</text><text x="50" y="925" font-size="21" fill="#25434e" text-anchor="start">Keeper bolt heads now seat at Z124. M12 × 1.75 threads and grade 8.8 are candidates; tapped envelopes are schematic.</text><text x="50" y="960" font-size="21" fill="#25434e" text-anchor="start">Use supplier-rated predrilled heads; 1 mm stainless lockwire pairs must oppose loosening. Thread/locking inspection is required.</text><text x="50" y="995" font-size="21" fill="#25434e" text-anchor="start">Capture washer and keeper retain parts when springs unload. Captured droop is not the normal running rebound setting.</text><text x="50" y="1030" font-size="21" fill="#25434e" text-anchor="start">Seat plate/root, keeper and bolt screens are separate from fatigue, lifting-impact and whole-bogie qualification.</text><text x="50" y="1087" font-size="18" fill="#25434e" text-anchor="start">Development dimensions — material, welding procedure, local frame strength and fatigue release remain in separate engineering.</text></g></svg>
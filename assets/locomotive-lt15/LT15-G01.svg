<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1110" role="img" aria-labelledby="title desc"><title id="title">LT15 G01 — Parallel sliding axle guidance</title><desc id="desc">Dimensioned side elevation and plan section of one axlebox, replaceable pads, horn guides and lateral stops. Millimetres. Development layout only.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 4L0 0L0 8Z" fill="#344e5b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#233d48;font-size:20px}.small{font-size:17px}.title{font-size:30px;font-weight:bold}.sub{font-size:23px;font-weight:bold}.fixed{fill:#a8bec8;stroke:#395969;stroke-width:2}.box{fill:#d7ded9;stroke:#344e5b;stroke-width:2}.pad{fill:#cfa45b;stroke:#805e29;stroke-width:1}.dim{stroke:#344e5b;stroke-width:1;marker-start:url(#arrow);marker-end:url(#arrow)}.ext{stroke:#7f9096;stroke-width:1}.axis{stroke:#96a6ad;stroke-dasharray:8 6;fill:none}</style><rect width="1400" height="1110" fill="white"/><text x="40" y="46" class="title">LT15–G01 | Parallel sliding axle guide candidate</text><text x="40" y="80">Dimensions in mm • nominal geometry • not a machining or fabrication release</text><path d="M700 110V720" stroke="#cbd8dc"/><text x="40" y="130" class="sub">Side elevation — looking along the axle</text><rect x="189" y="190" width="20" height="435" class="fixed"/><rect x="210" y="395" width="10" height="230" class="pad"/><rect x="491" y="190" width="20" height="435" class="fixed"/><rect x="480" y="395" width="10" height="230" class="pad"/><rect x="180" y="184.8" width="340" height="12" class="fixed"/><rect x="220" y="385" width="260" height="250" class="box"/><rect x="210" y="395" width="10" height="230" class="pad"/><rect x="480" y="395" width="10" height="230" class="pad"/><circle cx="350" cy="510" r="107.5" fill="white" stroke="#344e5b" stroke-width="2"/><path d="M170 510H530M350 350V660" class="axis"/><text x="275" y="510" class="small">Ø215 bearing seat</text><text x="260" y="539" class="small">Axle centre Z725</text><path d="M220 670L480 670" class="dim"/><text x="297" y="697" class="small">260 box</text><path d="M209 355L491 355" class="dim"/><text x="265" y="344" class="small">282 guide opening</text><path d="M570 385L570 635" class="dim"/><text x="582" y="520" class="small">250</text><text x="40" y="800" class="small">Header 340 × 180 × 12</text><text x="40" y="826" class="small">Top Z1050.2; frame underside Z1045.2</text><text x="40" y="852" class="small">Guide plate 20 × 180 × 435</text><text x="40" y="878" class="small">Z610…1045; lower inboard relief 30 × 140</text><text x="40" y="735" class="small">Gold pads: 10 × 90 × 230; 4 × Ø9 on 50 × 170 centres</text><text x="40" y="762" class="small">280 padded box in 282 opening → 1 nominal gap / face</text><text x="740" y="130" class="sub">Plan section at Z800 — lateral travel</text><rect x="920" y="360" width="260" height="100" class="box"/><rect x="972.9853909962532" y="360" width="154.02921800749363" height="100" fill="white" stroke="#344e5b"/><rect x="889" y="320" width="20" height="180" class="fixed"/><rect x="910" y="365" width="10" height="90" class="pad"/><rect x="909" y="325" width="40" height="10" class="fixed"/><rect x="909" y="485" width="40" height="10" class="fixed"/><rect x="1191" y="320" width="20" height="180" class="fixed"/><rect x="1180" y="365" width="10" height="90" class="pad"/><rect x="1151" y="325" width="40" height="10" class="fixed"/><rect x="1151" y="485" width="40" height="10" class="fixed"/><path d="M860 410H1240M1050 285V535" class="axis"/><path d="M1260 335L1260 485" class="dim"/><text x="1120" y="565" class="small">150 stop opening</text><path d="M920 545L1180 545" class="dim"/><text x="1010" y="574" class="small">260 box</text><text x="760" y="220" class="small">Axlebox slides sideways; it does not swivel.</text><text x="760" y="248" class="small">Stop faces ±75 from nominal box centre.</text><text x="760" y="276" class="small">100-wide box → ±25 nominal zero-roll stop travel.</text><text x="760" y="610" class="small">Stop ears 40 × 10 × 190; Z760…950</text><text x="760" y="640" class="small">50 m trial: outer axles +12.015, middle −12.015</text><text x="760" y="670" class="small">Reverse signs for the other curve; driver yaw = 0°.</text><text x="760" y="700" class="small">±20 lateral with ±2° roll also screened at travel extremes.</text><text x="760" y="735" class="small">Hard-stop contact is not a centering mechanism.</text><text x="760" y="762" class="small">Pad fastener seats and axlebox tapped holes unfinished.</text><path d="M40 910H1360" stroke="#8ca1ab"/><text x="40" y="950" class="sub">Load path: axlebox → wear faces → horn weldment → header → main frame.</text><text x="40" y="985" class="">Motor and chain reactions enter the axleboxes through the carrier. Guide pressure, welds and frame loads require calculation.</text><text x="40" y="1020" class="">Spring seats must permit sideways travel; centering, damping, rebound retention and bump stops remain to be designed.</text><text x="40" y="1062" class="small">Outer-wheel attack angle remains 1.776° at 50 m. Rail/flange forces and the operating radius are NOT approved.</text></svg>
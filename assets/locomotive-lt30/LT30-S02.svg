<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><pattern id="core" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#b56c20" stroke-width="1"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#23505c"/></marker></defs><rect width="1400" height="1000" fill="#fbf8ef"/><style>text{font-family:Arial,sans-serif;fill:#213c42}.title{font-size:29px;font-weight:700}.sub{font-size:17px}.label{font-size:16px}.small{font-size:14px}.dim{stroke:#23505c;stroke-width:1.4;marker-start:url(#arrow);marker-end:url(#arrow)}.line{stroke:#23505c;stroke-width:1.3;fill:none}.steel{fill:#94aeb3;stroke:#34545c}.core{fill:url(#core);stroke:#b56c20}</style><text x="45" y="55" class="title">LT30–S02 | Retention and replacement</text><text x="45" y="87" class="sub">Illustrated local service sequence. Truck separation and independent support are prerequisites; lifting plan is not released.</text><path d="M45 106H1355" class="line"/><text x="55" y="150" class="label">Captive cartridge construction</text><text x="55" y="187" class="label">Pusher</text><text x="250" y="187" class="label">6 thick; Ø109 front / Ø128 rear; M3 threaded guide engagement to detail.</text><text x="55" y="221" class="label">Core</text><text x="250" y="221" class="label">Custom AlTuCore-type annulus: Ø109 / Ø94 × 41 free; 20.5 residual.</text><text x="55" y="255" class="label">Outer sleeves</text><text x="250" y="255" class="label">Front Ø110.5 / Ø109.5; back Ø112.5 / Ø111.5; each 20.5 long.</text><text x="55" y="289" class="label">Inner sleeves</text><text x="250" y="289" class="label">Front Ø92 / Ø90.5; back Ø93 / Ø92.3; each 20.5 long.</text><text x="55" y="323" class="label">Hard ring</text><text x="250" y="323" class="label">Ø128 / Ø113 × 20.5; positively join to seat under approved weld detail.</text><text x="55" y="357" class="label">Keepers</text><text x="250" y="357" class="label">Four M3 screw reservations on PCD120, moving with pusher; no catch-load credit.</text><text x="55" y="391" class="label">Cheek access</text><text x="250" y="391" class="label">Four Ø7 through bores let Ø5.5 rear heads move +20.5 and provide driver access.</text><text x="55" y="468" class="label">Installation: seat and ring fixed to cheek → back liners → core → pusher/front liners → guide screws → pin.</text><text x="55" y="502" class="label">Specify sleeve attachment, positive screw locking and matched free gap; core preload cannot be assumed harmless.</text><rect x="65" y="570" width="390" height="230" rx="10" fill="#eef0e7" stroke="#aab8ae"/><text x="83" y="606" class="label">1 · Extract pin</text><text x="83" y="646" class="label">Unload/support body and truck.</text><text x="83" y="677" class="label">Remove key, nut/cotter and grease.</text><text x="83" y="708" class="label">Withdraw pin 354 in +X.</text><rect x="490" y="570" width="390" height="230" rx="10" fill="#eef0e7" stroke="#aab8ae"/><text x="508" y="606" class="label">2 · Separate truck</text><text x="508" y="646" class="label">Use an engineer-approved shop plan.</text><text x="508" y="677" class="label">Remove guides with long driver.</text><text x="508" y="708" class="label">Pull pack 21 inward; lower 180.</text><rect x="915" y="570" width="390" height="230" rx="10" fill="#eef0e7" stroke="#aab8ae"/><text x="933" y="606" class="label">3 · Remove pack</text><text x="933" y="646" class="label">Move 250 laterally after lowering.</text><text x="933" y="677" class="label">Exchange both affected cartridges.</text><text x="933" y="708" class="label">Inspect bearing, faces and structure.</text><text x="55" y="850" class="label">Reassemble in reverse; record core lot/curve, both free gaps and free slide. Replace the one-shot core after an event.</text><text x="55" y="882" class="label">Pin sweep and local pack paths are checked. Tools, rigging, damaged-core recovery and final fasteners remain holds.</text><path d="M45 930H1355" class="line"/><text x="45" y="962" class="label">S02 · LT30 · 21 October 2026 · all dimensions mm · review geometry only</text><text x="1020" y="962" class="label">FABRICATION UNRELEASED</text></svg>
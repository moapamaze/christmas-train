<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-label="CUSTOM PARTS / BRAKE REACTION LOAD PATH"><rect x="0" y="0" width="1600" height="1160" rx="0" fill="white" stroke="#15384a" stroke-width="2"/><rect x="20" y="20" width="1560" height="1120" rx="0" fill="white" stroke="#15384a" stroke-width="2"/><text x="44" y="59" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#15384a" font-weight="bold" text-anchor="start">L2-M03  CUSTOM PARTS / BRAKE REACTION LOAD PATH</text><text x="44" y="91" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#687c86" font-weight="normal" text-anchor="start">D1 two wheel-end drum brakes per axle · carrier references the nonrotating axlebox, never the rotating axle</text><path d="M35 111H1565" fill="none" stroke="#15384a" stroke-width="2"/><text x="55" y="149" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#15384a" font-weight="bold" text-anchor="start">PLAN AT ONE WHEEL END — CONNECTION TO THE BOGIE</text><rect x="95" y="191" width="695" height="43" rx="0" fill="#e9edef" stroke="#687c86" stroke-width="2"/><text x="113" y="220" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#687c86" font-weight="bold" text-anchor="start">Sprung bogie frame</text><rect x="120" y="390" width="677" height="30" rx="0" fill="#f0d4b6" stroke="#b4651d" stroke-width="2"/><rect x="171" y="321" width="47" height="170" rx="0" fill="#f8e9d9" stroke="#b4651d" stroke-width="2"/><rect x="311" y="357" width="101" height="98" rx="0" fill="#e2edf3" stroke="#2c6c89" stroke-width="2"/><rect x="479" y="317" width="179" height="175" rx="0" fill="#fbecdc" stroke="#b4651d" stroke-width="2" stroke-dasharray="8 5"/><path d="M419 345H455V295H634" fill="none" stroke="#6e518d" stroke-width="14"/><path d="M403 350L540 235" fill="none" stroke="#6e518d" stroke-width="5"/><circle cx="403" cy="350" r="9" fill="white" stroke="#6e518d" stroke-width="2"/><circle cx="540" cy="235" r="9" fill="white" stroke="#6e518d" stroke-width="2"/><rect x="692" y="290" width="90" height="47" rx="0" fill="#e9e0f0" stroke="#6e518d" stroke-width="2" stroke-dasharray="7 5"/><path d="M643 298H690" fill="none" stroke="#6e518d" stroke-width="7" stroke-dasharray="8 5"/><text x="85" y="537" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#b4651d" font-weight="bold" text-anchor="start">Wheel</text><path d="M145 529L190 493" fill="none" stroke="#b4651d" stroke-width="1"/><text x="285" y="537" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#2c6c89" font-weight="bold" text-anchor="start">Axlebox</text><path d="M340 516V458" fill="none" stroke="#2c6c89" stroke-width="1"/><text x="480" y="537" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#b4651d" font-weight="bold" text-anchor="start">Drum + hub</text><path d="M541 516V495" fill="none" stroke="#b4651d" stroke-width="1"/><text x="835" y="196" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">Carrier / spider / chamber support move with axlebox.</text><text x="835" y="225" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">Link above is a PLAN PROJECTION; plan offset alone</text><text x="835" y="254" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">cannot establish a moment arm about the axle axis.</text><text x="835" y="283" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">Chamber / camshaft zone, clocking and motion are HELD.</text><text x="835" y="312" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">Never weld the spider / arm to the rotating axle.</text><text x="835" y="388" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="bold" text-anchor="start">END VIEW ALONG AXLE — REQUIRED TORQUE PLANE</text><circle cx="930" cy="510" r="27" fill="#e3edf2" stroke="#2c6c89" stroke-width="2"/><circle cx="930" cy="510" r="5" fill="#15384a" stroke="#15384a" stroke-width="1"/><path d="M930 483V440" fill="none" stroke="#6e518d" stroke-width="8"/><circle cx="930" cy="440" r="8" fill="white" stroke="#6e518d" stroke-width="2"/><path d="M940 440L1180 440" fill="none" stroke="#6e518d" stroke-width="3"/><path d="M1171 435L1180 440L1171 445" fill="none" stroke="#6e518d" stroke-width="3"/><text x="1200" y="448" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6e518d" font-weight="bold" text-anchor="start">F = T / h</text><path d="M870 440V510M861 440H879M861 510H879" fill="none" stroke="#97601e" stroke-width="1.5"/><text x="856" y="482" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#97601e" font-weight="bold" text-anchor="end">h HOLD</text><text x="1020" y="505" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#15384a" font-weight="normal" text-anchor="start">Nonzero perpendicular arm h required.</text><text x="1020" y="535" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#97601e" font-weight="normal" text-anchor="start">Joint axes / travel / h are not selected.</text><path d="M40 576H1560" fill="none" stroke="#687c86" stroke-width="1"/><text x="55" y="613" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#15384a" font-weight="bold" text-anchor="start">TORQUE AND FORCE PATHS</text><text x="55" y="650" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">ROTATING: rail wheel → axle → removable hub joint → drum.</text><text x="55" y="679" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">REACTION: shoes → spider → custom carrier → articulated link → bogie.</text><text x="55" y="708" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">ACTUATION: chamber anchor + slack adjuster + cam supports also load the carrier.</text><text x="55" y="737" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">Wheel-to-bearing span need not grow merely to insert the brake; outboard mass / leverage do grow.</text><text x="55" y="761" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#97601e" font-weight="bold" text-anchor="start">Working demand study: 363.825 N·m per brake at 13,200 kg / car, 0.7 m/s², Ø600 mm wheel and 5% inertia. NOT a design maximum.</text><rect x="55" y="780" width="1490" height="271" rx="0" fill="#f2f6f8" stroke="#c3d1d8" stroke-width="1"/><text x="74" y="812" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="bold" text-anchor="start">CUSTOM ITEM</text><text x="270" y="812" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="bold" text-anchor="start">MATING / FABRICATION REQUIREMENT</text><text x="1090" y="812" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="bold" text-anchor="start">RELEASE EVIDENCE</text><text x="74" y="854" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6e518d" font-weight="bold" text-anchor="start">Axle-end hub</text><text x="270" y="854" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#15384a" font-weight="normal" text-anchor="start">Retain OEM drum seat side; joint transmits reversing torque.</text><text x="1090" y="854" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#97601e" font-weight="normal" text-anchor="start">Fit / fatigue / runout / retention</text><text x="74" y="893" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6e518d" font-weight="bold" text-anchor="start">Carrier + spider seat</text><text x="270" y="893" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#15384a" font-weight="normal" text-anchor="start">Match controlled spider datum; retain bearing service access.</text><text x="1090" y="893" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#97601e" font-weight="normal" text-anchor="start">OEM weldability / seat geometry</text><text x="74" y="932" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6e518d" font-weight="bold" text-anchor="start">Chamber mount</text><text x="270" y="932" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#15384a" font-weight="normal" text-anchor="start">Use matched bracket interfaces; sustain actuation and fault loads.</text><text x="1090" y="932" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#97601e" font-weight="normal" text-anchor="start">Force–stroke / handedness / travel</text><text x="74" y="971" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6e518d" font-weight="bold" text-anchor="start">Reaction arm + link</text><text x="270" y="971" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#15384a" font-weight="normal" text-anchor="start">Articulate through suspension; two-way tension / compression.</text><text x="1090" y="971" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#97601e" font-weight="normal" text-anchor="start">Buckling / joints / fatigue / travel</text><text x="74" y="1010" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6e518d" font-weight="bold" text-anchor="start">Guards + access</text><text x="270" y="1010" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#15384a" font-weight="normal" text-anchor="start">Clear rotating parts, hoses, track and steps at worst articulation.</text><text x="1090" y="1010" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#97601e" font-weight="normal" text-anchor="start">Full envelope + extraction trial</text><text x="55" y="1083" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#97601e" font-weight="bold" text-anchor="start">All custom thicknesses, materials, fasteners, pins, fits, welds and dimensions remain HOLD until supported by load and interface evidence.</text><path d="M35 1098H1565" fill="none" stroke="#15384a" stroke-width="2"/><text x="44" y="1125" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#97601e" font-weight="bold" text-anchor="start">PF-TRAIN  ·  3L.2 / R0  ·  19 OCT 2026 UTC  ·  DEVELOPMENT ONLY — NOT RELEASED FOR FABRICATION</text><text x="1545" y="1125" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#15384a" font-weight="bold" text-anchor="end">L2-M03</text></svg>
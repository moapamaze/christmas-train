font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#97601e" font-weight="normal" text-anchor="start">Method, fit and sizes HOLD.</text><path d="M1214 406L1178 406" fill="none" stroke="#97601e" stroke-width="1"/><text x="1230" y="517" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">Drum + hub withdraw</text><text x="1230" y="544" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">together for service.</text><text x="1230" y="571" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">Do not reverse the</text><text x="1230" y="598" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">OEM mounting face.</text><path d="M718 618H988" fill="none" stroke="#2c6c89" stroke-width="1.5"/><path d="M713 624L723 612" fill="none" stroke="#2c6c89" stroke-width="1.5"/><path d="M718 555V611" fill="none" stroke="#2c6c89" stroke-width="1"/><path d="M983 624L993 612" fill="none" stroke="#2c6c89" stroke-width="1.5"/><path d="M988 555V611" fill="none" stroke="#2c6c89" stroke-width="1"/><text x="853.0" y="606" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#2c6c89" font-weight="bold" text-anchor="middle">101.6 mm [4 in] NOMINAL LINING WIDTH</text><path d="M298 711H490" fill="none" stroke="#97601e" stroke-width="1.5"/><path d="M293 717L303 705" fill="none" stroke="#97601e" stroke-width="1.5"/><path d="M298 475V704" fill="none" stroke="#97601e" stroke-width="1"/><path d="M485 717L495 705" fill="none" stroke="#97601e" stroke-width="1.5"/><path d="M490 475V704" fill="none" stroke="#97601e" stroke-width="1"/><text x="394.0" y="699" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#97601e" font-weight="bold" text-anchor="middle">a = wheel / bearing offsets HOLD</text><path d="M622 711H1070" fill="none" stroke="#97601e" stroke-width="1.5"/><path d="M617 717L627 705" fill="none" stroke="#97601e" stroke-width="1.5"/><path d="M622 566V704" fill="none" stroke="#97601e" stroke-width="1"/><path d="M1065 717L1075 705" fill="none" stroke="#97601e" stroke-width="1.5"/><path d="M1070 566V704" fill="none" stroke="#97601e" stroke-width="1"/><text x="846.0" y="699" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#97601e" font-weight="bold" text-anchor="middle">b = outboard brake package HOLD</text><text x="52" y="750" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#97601e" font-weight="bold" text-anchor="start">No drum OD, total depth, bolt circle, pilot, axle diameter, carrier thickness, or joint size has been inferred from the nominal brake size.</text><path d="M40 773H1560" fill="none" stroke="#687c86" stroke-width="1"/><text x="55" y="810" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#15384a" font-weight="bold" text-anchor="start">RADIAL STUDY — VERIFIED FRICTION DIAMETER ONLY</text><circle cx="210" cy="944" r="87.5" fill="#faf5ed" stroke="#b4651d" stroke-width="2"/><circle cx="210" cy="944" r="54.451249999999995" fill="white" stroke="#2c6c89" stroke-width="2"/><path d="M95 944H325M210 829V1059" fill="none" stroke="#687c86" stroke-width="1" stroke-dasharray="8 5"/><text x="210" y="1071" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#b4651d" font-weight="bold" text-anchor="middle">Ø500 mm WHEEL STUDY</text><text x="210" y="950" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#2c6c89" font-weight="bold" text-anchor="middle">Ø311.15</text><text x="210" y="973" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#2c6c89" font-weight="normal" text-anchor="middle">friction ID</text><circle cx="535" cy="944" r="105.0" fill="#faf5ed" stroke="#b4651d" stroke-width="2"/><circle cx="535" cy="944" r="54.451249999999995" fill="white" stroke="#2c6c89" stroke-width="2"/><path d="M420 944H650M535 829V1059" fill="none" stroke="#687c86" stroke-width="1" stroke-dasharray="8 5"/><text x="535" y="1071" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#b4651d" font-weight="bold" text-anchor="middle">Ø600 mm WHEEL STUDY</text><text x="535" y="950" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#2c6c89" font-weight="bold" text-anchor="middle">Ø311.15</text><text x="535" y="973" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#2c6c89" font-weight="normal" text-anchor="middle">friction ID</text><text x="755" y="844" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">12¼ in = 311.15 mm is the drum INSIDE friction diameter.</text><text x="755" y="872" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">It is NOT the drum outside diameter or a fit envelope.</text><text x="755" y="900" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">500 / 600 mm wheel diameters are studies, not selected sizes.</text><text x="755" y="928" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start"></text><text x="755" y="956" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">Wheel radius − friction radius = 94.425 / 144.425 mm.</text><text x="755" y="984" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">These are geometric upper bounds before drum wall thickness;</text><text x="755" y="1012" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">actual ground clearance is smaller and remains unknown.</text><text x="755" y="1040" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">Chamber, camshaft, support and suspension envelopes are omitted.</text><text x="755" y="1080" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#687c86" font-weight="normal" text-anchor="start">OEM basis: Dexter medium-duty catalog (2019.09), pp. 12, 19–20.</text><path d="M35 1098H1565" fill="none" stroke="#15384a" stroke-width="2"/><text x="44" y="1125" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#97601e" font-weight="bold" text-anchor="start">PF-TRAIN  ·  3L.2 / R0  ·  19 OCT 2026 UTC  ·  DEVELOPMENT ONLY — NOT RELEASED FOR FABRICATION</text><text x="1545" y="1125" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#15384a" font-weight="bold" text-anchor="end">L2-M01</text></svg>
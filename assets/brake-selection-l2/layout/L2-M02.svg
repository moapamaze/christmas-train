<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-label="SERVICE EXTRACTION / ASSEMBLY BREAKDOWN"><rect x="0" y="0" width="1600" height="1160" rx="0" fill="white" stroke="#15384a" stroke-width="2"/><rect x="20" y="20" width="1560" height="1120" rx="0" fill="white" stroke="#15384a" stroke-width="2"/><text x="44" y="59" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#15384a" font-weight="bold" text-anchor="start">L2-M02  SERVICE EXTRACTION / ASSEMBLY BREAKDOWN</text><text x="44" y="91" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#687c86" font-weight="normal" text-anchor="start">D1 axle-end drum + custom removable hub · keep the pressed rail wheel and main axle bearing installed</text><path d="M35 111H1565" fill="none" stroke="#15384a" stroke-width="2"/><text x="55" y="148" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#15384a" font-weight="bold" text-anchor="start">SECTIONAL EXPLOSION — ALL EXTRACTION DISTANCES ARE HELD</text><rect x="100" y="350" width="540" height="40" rx="0" fill="#efd3b3" stroke="#b4651d" stroke-width="3"/><rect x="152" y="240" width="48" height="258" rx="0" fill="#f8e9d9" stroke="#b4651d" stroke-width="3"/><rect x="290" y="308" width="107" height="125" rx="0" fill="#e4eef4" stroke="#2c6c89" stroke-width="3"/><path d="M404 315H454V267H472M404 425H454V474H472" fill="none" stroke="#6e518d" stroke-width="12"/><path d="M470 290V342M470 398V449" fill="none" stroke="#2c6c89" stroke-width="12"/><rect x="478" y="276" width="140" height="14" rx="0" fill="#bbd2dd" stroke="#2c6c89" stroke-width="2"/><rect x="478" y="451" width="140" height="14" rx="0" fill="#bbd2dd" stroke="#2c6c89" stroke-width="2"/><path d="M85 370H1430" fill="none" stroke="#687c86" stroke-width="1" stroke-dasharray="14 6 3 6"/><text x="105" y="216" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#2c6c89" font-weight="bold" text-anchor="start">RETAINED ON WHEELSET</text><text x="105" y="548" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">Rail wheel, axle, bearing / axlebox,</text><text x="105" y="575" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">stationary carrier, spider and shoes.</text><text x="105" y="602" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">Remove guards / hoses as the released</text><text x="105" y="629" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">service procedure requires.</text><path d="M835 245H1152V337M835 495H1152V403" fill="none" stroke="#b4651d" stroke-width="20"/><rect x="1164" y="268" width="24" height="70" rx="0" fill="#e9c39b" stroke="#b4651d" stroke-width="2"/><rect x="1164" y="402" width="24" height="70" rx="0" fill="#e9c39b" stroke="#b4651d" stroke-width="2"/><rect x="1118" y="338" width="110" height="65" rx="0" fill="#e9c39b" stroke="#b4651d" stroke-width="2"/><path d="M1118 352H1224M1118 389H1224" fill="none" stroke="#b4651d" stroke-width="2" stroke-dasharray="8 5"/><path d="M1138 280H1199M1138 459H1199" fill="none" stroke="#687c86" stroke-width="4"/><rect x="1320" y="343" width="20" height="54" rx="0" fill="#f5e5d6" stroke="#b4651d" stroke-width="2" stroke-dasharray="6 4"/><text x="825" y="216" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#b4651d" font-weight="bold" text-anchor="start">REMOVED AS A UNIT</text><text x="1310" y="313" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#97601e" font-weight="normal" text-anchor="start">Retainer</text><path d="M657 270L792 270" fill="none" stroke="#b4651d" stroke-width="3"/><path d="M783 265L792 270L783 275" fill="none" stroke="#b4651d" stroke-width="3"/><text x="724" y="242" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#b4651d" font-weight="bold" text-anchor="middle">OUTWARD</text><text x="823" y="548" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">OEM drum + custom axle-end hub.</text><text x="823" y="575" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">Bench-separate at OEM-supported face.</text><text x="823" y="602" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">Inboard drum screws need bench access.</text><text x="823" y="629" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="normal" text-anchor="start">Lifting points / mass / tooling HOLD.</text><path d="M641 701H835" fill="none" stroke="#97601e" stroke-width="1.5"/><path d="M636 707L646 695" fill="none" stroke="#97601e" stroke-width="1.5"/><path d="M641 495V694" fill="none" stroke="#97601e" stroke-width="1"/><path d="M830 707L840 695" fill="none" stroke="#97601e" stroke-width="1.5"/><path d="M835 495V694" fill="none" stroke="#97601e" stroke-width="1"/><text x="738.0" y="689" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#97601e" font-weight="bold" text-anchor="middle">Extraction / tooling space HOLD</text><text x="52" y="743" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#97601e" font-weight="bold" text-anchor="start">Extraction stroke ≥ max(hub-joint release travel, drum / shoe overlap), plus separately reserved tool and handling clearance.</text><path d="M40 765H1560" fill="none" stroke="#687c86" stroke-width="1"/><text x="55" y="801" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#15384a" font-weight="bold" text-anchor="start">ASSEMBLY / SERVICE SEQUENCE TO COMPLETE IN THE RELEASED TRAVELER</text><text x="55" y="840" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="bold" text-anchor="start">1  Support and isolate</text><text x="308" y="840" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#15384a" font-weight="normal" text-anchor="start">Chock/support the vehicle; isolate air and handle spring chambers using the exact OEM procedure.</text><text x="55" y="879" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="bold" text-anchor="start">2  Retract / inspect</text><text x="308" y="879" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#15384a" font-weight="normal" text-anchor="start">Retract the foundation brake through the OEM adjuster procedure; release all shoe contact.</text><text x="55" y="918" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="bold" text-anchor="start">3  Remove retention</text><text x="308" y="918" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#15384a" font-weight="normal" text-anchor="start">Remove engineered axle-end axial retention using specified tools; do not hammer the axle end.</text><text x="55" y="957" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="bold" text-anchor="start">4  Withdraw cartridge</text><text x="308" y="957" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#15384a" font-weight="normal" text-anchor="start">Pull the hub + drum together outward; verify joint release force, extraction clearance and support.</text><text x="55" y="996" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="bold" text-anchor="start">5  Bench service</text><text x="308" y="996" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#15384a" font-weight="normal" text-anchor="start">Access inboard drum screws; replace drum / friction parts to OEM limits. Preserve serial traceability.</text><text x="55" y="1035" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#15384a" font-weight="bold" text-anchor="start">6  Reassemble / verify</text><text x="308" y="1035" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#15384a" font-weight="normal" text-anchor="start">Inspect hub joint; apply released assembly method and retention; check runout, adjustment and proof tests.</text><text x="55" y="1084" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#97601e" font-weight="bold" text-anchor="start">This sequence is a design requirement, not an executable service instruction. Joint type and actual removal tools are not selected.</text><path d="M35 1098H1565" fill="none" stroke="#15384a" stroke-width="2"/><text x="44" y="1125" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#97601e" font-weight="bold" text-anchor="start">PF-TRAIN  ·  3L.2 / R0  ·  19 OCT 2026 UTC  ·  DEVELOPMENT ONLY — NOT RELEASED FOR FABRICATION</text><text x="1545" y="1125" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#15384a" font-weight="bold" text-anchor="end">L2-M02</text></svg>
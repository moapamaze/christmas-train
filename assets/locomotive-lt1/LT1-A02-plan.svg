<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850"><style>text{font-family:Arial,sans-serif;fill:#17364a}.t{font-size:18px}.s{font-size:15px}.d{stroke:#9a691e;stroke-width:1.3;fill:none}.body{fill:#35434b;stroke:#182c38;stroke-width:2}.line{stroke:#17364a;fill:none;stroke-width:2}</style><rect width="100%" height="100%" fill="#fffef9"/><text x="40" y="42" font-size="28" font-weight="bold">LT1-A02 · Plan / installation zones</text><text x="40" y="70" class="t">Same LT1 geometry · Approximate installation reservations; not delivered-component CAD</text><rect x="70.0" y="206.5" width="912.0" height="247.0" fill="#edf0f0" stroke="#17364a"/><text x="77.0" y="335.0" class="s"></text><rect x="1039.0" y="206.5" width="475.0" height="247.0" fill="#edf0f0" stroke="#17364a"/><text x="1046.0" y="335.0" class="s"></text><rect x="203.0" y="277.75" width="76.0" height="104.5" fill="#d1e4da" stroke="#17364a"/><text x="210.0" y="335.0" class="s">Cooling</text><rect x="298.0" y="273.0" width="199.5" height="114.0" fill="#f1d4a2" stroke="#17364a"/><text x="305.0" y="335.0" class="s">Engine / pump</text><rect x="535.5" y="273.0" width="161.5" height="114.0" fill="#d1e4da" stroke="#17364a"/><text x="542.5" y="335.0" class="s">Oil / air</text><rect x="763.5" y="206.5" width="209.0" height="247.0" fill="#bcd5df" stroke="#17364a"/><text x="770.5" y="335.0" class="s">Operator cab</text><rect x="1067.5" y="258.75" width="133.0" height="142.5" fill="#f1d4a2" stroke="#17364a"/><text x="1074.5" y="335.0" class="s">Fuel / service</text><rect x="1257.5" y="244.5" width="218.5" height="171.0" fill="#d1e4da" stroke="#17364a"/><text x="1264.5" y="335.0" class="s">Utility / option</text><circle cx="383.5" cy="330" r="10" fill="none" stroke="#9a691e" stroke-width="3"/><circle cx="640.0" cy="330" r="10" fill="none" stroke="#9a691e" stroke-width="3"/><circle cx="1153.0" cy="330" r="10" fill="none" stroke="#9a691e" stroke-width="3"/><circle cx="1400.0" cy="330" r="10" fill="none" stroke="#9a691e" stroke-width="3"/><path d="M40,373.43399999999997H1560" stroke="#607582" stroke-dasharray="8 7"/><path d="M40,286.56600000000003H1560" stroke="#607582" stroke-dasharray="8 7"/><path class="d" d="M383.5,482v16 M640.0,482v16 M383.5,490H640.0"/><text x="471.75" y="480" class="s">2,700 powered pivot spacing</text><text x="40" y="555" class="t">Orange = combustion/fuel service zones · green = cooling/utility zones · blue = cab · circles = main powered / tender pivots</text><text x="40" y="595" class="t">Engine zone reserves adapter, hoses and service space beyond the published 856 × 557 × 749 engine envelope; fan is excluded by OEM.</text><text x="40" y="635" class="t">Boiler shell is a ventilated, nonpressure cover. Provide removable sides/top; protect cab from DPF/exhaust heat and direct fumes away.</text><text x="40" y="675" class="t">Tender rear utility / optional-generator bay is a reservation only: real airflow, exhaust, fuel capacity, service-door swing and unit dimensions remain open.</text><text x="40" y="715" class="t">Rail dashed lines show gauge references, not wheel-back spacing. Nothing in this sheet defines final wheel profile or flange clearances.</text><text x="40" y="795" class="s">PF-LOCO-LT1-R0 · X longitudinal / Y lateral · enclosure access and all moving envelopes require coordinated detail</text></svg>
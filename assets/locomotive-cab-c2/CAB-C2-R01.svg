<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc"><title id="title">Protected video connections and LT32 reconciliation</title><desc id="desc">One coach is shown as both first and last; additional coaches repeat the trunk and joint without moving the tail camera forward.. Dimensioned review geometry. Fabrication unreleased.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#386c60"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}*{stroke-linejoin:round;stroke-linecap:round}</style><rect x="0.00" y="0.00" width="1400.00" height="1000.00" rx="0" fill="#fbfcf8" stroke="none" stroke-width="0"/><rect x="24.00" y="24.00" width="1352.00" height="952.00" rx="0" fill="none" stroke="#bac9bf" stroke-width="1"/><text x="60.00" y="64.00" font-size="15" fill="#386c60" font-weight="bold" text-anchor="start">PULSIPHER FARMS / CAB C2</text><text x="60.00" y="110.00" font-size="31" fill="#263e43" font-weight="bold" text-anchor="start">Protected video connections and LT32 reconciliation</text><text x="60.00" y="143.00" font-size="16" fill="#597068" font-weight="normal" text-anchor="start">One coach is shown as both first and last; additional coaches repeat the trunk and joint without moving the tail camera forward.</text><text x="80.00" y="195.00" font-size="17" fill="#386c60" font-weight="bold" text-anchor="start">POWER / VIDEO ROUTE / REPEAT AT EVERY COACH JOINT</text><rect x="80.00" y="225.00" width="270.00" height="112.00" rx="4" fill="#edf2e9" stroke="#386c60" stroke-width="1.5"/><text x="95.00" y="255.00" font-size="16" fill="#386c60" font-weight="bold" text-anchor="start">LOCOMOTIVE</text><text x="95.00" y="282.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">Front camera → protected cab</text><text x="95.00" y="302.02" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">interface → monitor</text><rect x="485.00" y="225.00" width="270.00" height="112.00" rx="4" fill="#edf2e9" stroke="#386c60" stroke-width="1.5"/><text x="500.00" y="255.00" font-size="16" fill="#386c60" font-weight="bold" text-anchor="start">EACH COACH</text><text x="500.00" y="282.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">Protected trunk at local</text><text x="500.00" y="302.02" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">Y1300 / Z2100</text><rect x="890.00" y="225.00" width="270.00" height="112.00" rx="4" fill="#edf2e9" stroke="#386c60" stroke-width="1.5"/><text x="905.00" y="255.00" font-size="16" fill="#386c60" font-weight="bold" text-anchor="start">LAST COACH</text><text x="905.00" y="282.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">Tail branch and rear camera;</text><text x="905.00" y="302.02" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">move camera when consist</text><text x="905.00" y="322.04" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">changes</text><rect x="366.00" y="250.00" width="24.00" height="35.00" rx="0" fill="#5d8080" stroke="#263e43" stroke-width="1.5"/><rect x="445.00" y="250.00" width="24.00" height="35.00" rx="0" fill="#5d8080" stroke="#263e43" stroke-width="1.5"/><path d="M390.00,268.00 L400.00,300.00 L433.00,300.00 L445.00,268.00" stroke="#ad6939" stroke-width="3" fill="none"/><text x="417.00" y="236.00" font-size="14" fill="#386c60" font-weight="bold" text-anchor="middle">J1</text><text x="417.00" y="329.00" font-size="12" fill="#263e43" font-weight="normal" text-anchor="middle">Disconnect</text><rect x="771.00" y="250.00" width="24.00" height="35.00" rx="0" fill="#5d8080" stroke="#263e43" stroke-width="1.5"/><rect x="850.00" y="250.00" width="24.00" height="35.00" rx="0" fill="#5d8080" stroke="#263e43" stroke-width="1.5"/><path d="M795.00,268.00 L805.00,300.00 L838.00,300.00 L850.00,268.00" stroke="#ad6939" stroke-width="3" fill="none"/><text x="822.00" y="236.00" font-size="14" fill="#386c60" font-weight="bold" text-anchor="middle">J2…</text><text x="822.00" y="329.00" font-size="12" fill="#263e43" font-weight="normal" text-anchor="middle">Disconnect</text><text x="1190.00" y="255.00" font-size="17" fill="#386c60" font-weight="bold" text-anchor="start">12 V</text><text x="1190.00" y="284.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">camera supply via</text><text x="1190.00" y="304.02" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">an interface to</text><text x="1190.00" y="324.04" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">be qualified.</text><text x="80.00" y="374.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">Jumper reservation: 1600 length /16 OD; each socket 90 ×70 ×80, keyed and capped, with separate frame bracket.</text><text x="80.00" y="402.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">9 locomotive-joint and 27 repeated-coach poses: minimum sampled bend radius 102.3; low point 1410.7 above rail.</text><text x="80.00" y="430.00" font-size="14" fill="#ad6939" font-weight="normal" text-anchor="start">These are geometric corridors, not qualified cable cut lengths, connector pinouts or end-to-end video performance.</text><path d="M60.00,456.00 L1340.00,456.00" fill="none" stroke="#bac9bf" stroke-width="1"/><text x="80.00" y="491.00" font-size="17" fill="#386c60" font-weight="bold" text-anchor="start">REVISED AIR ROUTES / CONTINUOUS TO LT32 ISOLATION PORTS</text><text x="80.00" y="560.00" font-size="18" fill="#ba6554" font-weight="bold" text-anchor="start">BP</text><path d="M130.00,555.00 L270.00,555.00 L270.00,578.00 L540.00,578.00 L660.00,578.00 L660.00,555.00 L840.00,555.00" stroke="#ba6554" stroke-width="4" fill="none"/><circle cx="130.00" cy="555.00" r="5.00" fill="#fbfcf8" stroke="#ba6554" stroke-width="1.5"/><circle cx="540.00" cy="578.00" r="5.00" fill="#fbfcf8" stroke="#ba6554" stroke-width="1.5"/><circle cx="840.00" cy="555.00" r="5.00" fill="#fbfcf8" stroke="#ba6554" stroke-width="1.5"/><text x="130.00" y="537.00" font-size="12" fill="#ba6554" font-weight="normal" text-anchor="start">X8300</text><text x="500.00" y="601.00" font-size="12" fill="#ba6554" font-weight="normal" text-anchor="start">X11040</text><text x="750.00" y="537.00" font-size="12" fill="#ba6554" font-weight="normal" text-anchor="start">X11140</text><text x="130.00" y="620.00" font-size="12" fill="#ba6554" font-weight="normal" text-anchor="start">Y-760 / Z1740</text><text x="700.00" y="620.00" font-size="12" fill="#ba6554" font-weight="normal" text-anchor="start">Y-520 / Z1100</text><text x="80.00" y="660.00" font-size="18" fill="#528b9d" font-weight="bold" text-anchor="start">FP</text><path d="M130.00,655.00 L270.00,655.00 L270.00,678.00 L540.00,678.00 L660.00,678.00 L660.00,655.00 L840.00,655.00" stroke="#528b9d" stroke-width="4" fill="none"/><circle cx="130.00" cy="655.00" r="5.00" fill="#fbfcf8" stroke="#528b9d" stroke-width="1.5"/><circle cx="540.00" cy="678.00" r="5.00" fill="#fbfcf8" stroke="#528b9d" stroke-width="1.5"/><circle cx="840.00" cy="655.00" r="5.00" fill="#fbfcf8" stroke="#528b9d" stroke-width="1.5"/><text x="130.00" y="637.00" font-size="12" fill="#528b9d" font-weight="normal" text-anchor="start">X8300</text><text x="500.00" y="701.00" font-size="12" fill="#528b9d" font-weight="normal" text-anchor="start">X11040</text><text x="750.00" y="637.00" font-size="12" fill="#528b9d" font-weight="normal" text-anchor="start">X11140</text><text x="130.00" y="720.00" font-size="12" fill="#528b9d" font-weight="normal" text-anchor="start">Y-820 / Z1740</text><text x="700.00" y="720.00" font-size="12" fill="#528b9d" font-weight="normal" text-anchor="start">Y520 / Z1100</text><text x="285.00" y="749.00" font-size="14" fill="#386c60" font-weight="normal" text-anchor="start">Underfloor: BP Y−1228 / FP Y−1198 / Z1380</text><text x="80.00" y="782.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">20 OD main corridors with 75 centreline bends. Rear extension uses 30 centreline bends. Original LT32</text><text x="80.00" y="801.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">isolation-port positions are retained. Tube, fittings, clamps, pressure ratings and all-motion</text><text x="80.00" y="820.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">clearance remain unqualified.</text><path d="M900.00,480.00 L900.00,895.00" fill="none" stroke="#bac9bf" stroke-width="1"/><text x="945.00" y="491.00" font-size="17" fill="#386c60" font-weight="bold" text-anchor="start">LOCOMOTIVE MASS / CG</text><text x="945.00" y="529.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">LT32 baseline</text><text x="1315.00" y="529.00" font-size="15" fill="#263e43" font-weight="bold" text-anchor="end">16,418.2 kg</text><text x="945.00" y="563.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">C2 reconciled</text><text x="1315.00" y="563.00" font-size="15" fill="#263e43" font-weight="bold" text-anchor="end">16,801.8 kg</text><text x="945.00" y="597.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">Net change</text><text x="1315.00" y="597.00" font-size="15" fill="#263e43" font-weight="bold" text-anchor="end">+383.5 kg</text><text x="945.00" y="631.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">CG shift aft</text><text x="1315.00" y="631.00" font-size="15" fill="#263e43" font-weight="bold" text-anchor="end">+86.5 mm</text><text x="945.00" y="665.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">CG shift upward</text><text x="1315.00" y="665.00" font-size="15" fill="#263e43" font-weight="bold" text-anchor="end">+35.6 mm</text><text x="945.00" y="699.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">Coach additions</text><text x="1315.00" y="699.00" font-size="15" fill="#263e43" font-weight="bold" text-anchor="end">16.1 kg gross</text><text x="945.00" y="759.00" font-size="14" fill="#ad6939" font-weight="normal" text-anchor="start">504 load comparisons rerun; 322 capacity</text><text x="945.00" y="779.02" font-size="14" fill="#ad6939" font-weight="normal" text-anchor="start">flags remain. Convergence does not</text><text x="945.00" y="799.04" font-size="14" fill="#ad6939" font-weight="normal" text-anchor="start">demonstrate brake capacity, attachment</text><text x="945.00" y="819.06" font-size="14" fill="#ad6939" font-weight="normal" text-anchor="start">strength or safe operation.</text><text x="945.00" y="877.00" font-size="13" fill="#ad6939" font-weight="normal" text-anchor="start">Coach total / train CG not fully reconciled.</text><rect x="80.00" y="838.00" width="775.00" height="80.00" rx="6" fill="#edf2e9" stroke="none" stroke-width="0"/><text x="97.00" y="866.00" font-size="16" fill="#386c60" font-weight="bold" text-anchor="start">Keep services distinct</text><text x="97.00" y="892.00" font-size="15" fill="#386c60" font-weight="normal" text-anchor="start">Video power and signals use their own protection, strain relief and disconnects. Do not</text><text x="97.00" y="913.45" font-size="15" fill="#386c60" font-weight="normal" text-anchor="start">share flexible support with the BP / FP brake hoses.</text><path d="M60.00,930.00 L1340.00,930.00" fill="none" stroke="#bac9bf" stroke-width="1"/><text x="60.00" y="958.00" font-size="14" fill="#263e43" font-weight="normal" text-anchor="start">CAB-C2-R01 · 22 October 2026 · dimensions in mm · review / fabrication unreleased</text><text x="1340.00" y="958.00" font-size="14" fill="#ad6939" font-weight="bold" text-anchor="end">LT32 + Cab C2</text></svg>
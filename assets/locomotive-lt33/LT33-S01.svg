d pedestal per location</text><rect x="30" y="775" width="1140" height="110" fill="#e8e4d9"/><text x="48" y="804" font-size="20" fill="#243c45" text-anchor="start">8 × GMT STOP-BF1001-71 + 8 × revised steel pedestals</text><text x="48" y="832" font-size="16" fill="#243c45" text-anchor="start">70 mm rubber-bulge reservation requires manufacturer confirmation; it is not published product data.</text><text x="48" y="858" font-size="16" fill="#243c45" text-anchor="start">Thread locking, base attachment, edge contact, impact and fatigue remain for supplier/engineer review.</text><text x="30" y="907" font-size="15" fill="#243c45" text-anchor="start">LT33-S01 · 22 October 2026 · NOT FOR FABRICATION · Steel stop +30 / rebound −20 retained</text></g></svg>
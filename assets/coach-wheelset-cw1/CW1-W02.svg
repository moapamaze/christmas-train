<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 4L0 0V8Z" fill="#263e49"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#85949a" stroke-width="1"/></pattern></defs><rect width="1600" height="1120" fill="#fbfcf8"/><style>text{font-family:Arial,sans-serif;fill:#203c46}.title{font-size:34px;font-weight:bold}.sub{font-size:21px}.small{font-size:17px}.dim{font-size:19px}.edge{stroke:#203c46;stroke-width:2}.line{stroke:#263e49;stroke-width:1.4;fill:none}.dimline{stroke:#263e49;stroke-width:1.4;marker-start:url(#arr);marker-end:url(#arr)} </style><text x="50" y="55" class="title">Bearing retention: locknut + keyed tab washer</text><text x="50" y="90" class="sub">PULSIPHER FARMS · CW1-W02 / CW1 · 20 October 2026 · dimensions in mm</text><path d="M50 110H1550" class="line"/><text x="60" y="150" class="sub">Right-hand end, upper half section · left end mirrored</text><text x="60" y="182" class="small">The wheel is pressed on first. This hardware clamps only the bearing inner ring.</text><rect x="100" y="475" width="250" height="260" fill="#9aabb4" class="edge"/><rect x="350" y="510" width="200" height="225" fill="#9aabb4" class="edge"/><rect x="550" y="520" width="15" height="215" fill="#9aabb4" class="edge"/><rect x="565" y="510" width="110" height="225" fill="#9aabb4" class="edge"/><rect x="175" y="235" width="550" height="100" fill="#a9bbad" class="edge"/><rect x="175" y="335" width="175" height="27.5" fill="#a9bbad" class="edge"/><rect x="550" y="335" width="175" height="27.5" fill="#a9bbad" class="edge"/><rect x="350" y="470" width="200" height="40" fill="#ccd9de" class="edge"/><rect x="350" y="365" width="200" height="100" fill="#859ea6" class="edge"/><rect x="350" y="335" width="200" height="27.5" fill="#ccd9de" class="edge"/><rect x="550" y="475" width="15" height="34.5" fill="#ab8861" class="edge"/><rect x="565" y="465" width="8.75" height="45" fill="#d6aa4f" class="edge"/><rect x="573.75" y="435" width="80" height="75" fill="#d6aa4f" class="edge"/><rect x="573.75" y="435" width="80" height="20" fill="#fbfcf8" class="edge"/><rect x="565" y="446.25" width="43.75" height="8.75" fill="#d6aa4f" class="edge"/><rect x="565" y="510" width="110" height="20" fill="#fbfcf8" class="edge"/><rect x="565" y="510" width="8.75" height="17.5" fill="#d6aa4f" class="edge"/><rect x="725" y="235" width="60" height="500" fill="#a9bbad" class="edge"/><path d="M75 735L830 735" class="line"/><text x="75" y="225" class="sub">Axlebox &amp; outer-ring abutments</text><path d="M300 235L300 265" class="line"/><text x="100" y="420" class="sub">Ø104</text><text x="100" y="447" class="sub">shoulder</text><text x="365" y="535" class="sub">22218 E</text><text x="365" y="561" class="sub">90 × 160 × 40</text><text x="405" y="408" class="sub">MB18 washer</text><path d="M560 415L569.375 465" class="line"/><text x="800" y="450" class="sub">KM18</text><text x="800" y="476" class="sub">M90 × 2</text><path d="M800 490L615 470" class="line"/><path d="M350 735L350 818" class="line"/><path d="M550 735L550 818" class="line"/><path d="M350 810H550" class="dimline"/><text x="450.0" y="801" text-anchor="middle" class="dim">40 bearing</text><path d="M550 735L550 883" class="line"/><path d="M675 735L675 883" class="line"/><path d="M550 875H675" class="dimline"/><text x="612.5" y="866" text-anchor="middle" class="dim">25 end stack</text><path d="M675 735L675 953" class="line"/><path d="M725 735L725 953" class="line"/><path d="M675 945H725" class="dimline"/><text x="700.0" y="936" text-anchor="middle" class="dim">10 cover clearance</text><text x="65" y="1005" class="small">Axle datum stations from centre: 600 shoulder · 640 bearing end · 643 washer · 644.75 nut · 660.75 nut end · 665 axle end</text><path d="M900 215L900 960" class="line"/><text x="950" y="245" class="sub">How the nut stays locked</text><text x="950" y="285" class="sub">1  Inner tab engages the axle groove.</text><text x="950" y="325" class="sub">2  Tighten nut to the approved procedure.</text><text x="950" y="365" class="sub">3  Bend one outer tab into a nut slot.</text><text x="950" y="405" class="sub">4  Fit the closed axlebox cover.</text><text x="950" y="470" class="sub">Catalog hardware</text><text x="950" y="510" class="sub">KM18: Ø120 × 16; four 10 × 4 slots.</text><text x="950" y="550" class="sub">MB18: Ø90 bore, Ø108 face, t1.75.</text><text x="950" y="590" class="sub">Tabs reach Ø126; inner tab is 10 wide.</text><text x="950" y="630" class="sub">Fit a NEW tab washer at reassembly.</text><text x="950" y="700" class="sub">Custom details — provisional</text><text x="950" y="740" class="sub">Spacer: Ø104 / Ø90.2 bore × 3.</text><text x="950" y="780" class="sub">Thread relief stays outside bearing seat.</text><text x="950" y="820" class="sub">Groove: 10.4 wide × 4 deep envelope.</text><text x="950" y="860" class="sub">Thread, groove radii and torque: held.</text><text x="950" y="920" class="small">No castle nut or cotter pin in this proposal.</text><text x="950" y="952" class="small">Thread and tab bend drawn schematically.</text><path d="M50 1050L1550 1050" class="line"/><text x="50" y="1085" class="small">NOMINAL DEVELOPMENT — NOT FOR MACHINING. Fits, materials, rail profile and release checks remain open.</text><text x="1430" y="1085" class="small">CW1-W02</text></svg>
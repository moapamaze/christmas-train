<text x="70" y="470" class="label">Body is 17.04″ wider than the pocket.</text><text x="70" y="497" class="small">67.72″ clear width needed with 35 mm side gaps.</text><text x="70" y="524" class="small">26.57″ depth exceeds the 21.42″ pocket.</text><text x="670" y="470" class="label">54.38″ width needed with side clearances.</text><text x="670" y="497" class="small">Usual top gap puts the bottom below the door top.</text><text x="670" y="524" class="small">OEM doorway / vibration restrictions also apply.</text><rect x="70" y="559" width="18" height="18" fill="#e8eee8" stroke="#347462"/><text x="100" y="574" class="small">Existing finished pocket</text><rect x="340" y="559" width="18" height="18" fill="#f5d9cc" stroke="#b55743"/><text x="370" y="574" class="small">Unit body</text><path d="M560 568h35" stroke="#b55743" stroke-dasharray="7 4"/><text x="610" y="574" class="small">Published clearance envelope</text><text x="35" y="622" class="small">25 OCT 2026 PDT · FIT REVIEW ONLY · ADA HOOD NOT PRESENT IN CURRENT MODEL · NO FABRICATION RELEASE</text></svg>